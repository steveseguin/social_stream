<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Meta Overlay. Part of the Social Stream Ninja toolkit for managing live chat, stream overlays and audience interactions.">
    <meta name="robots" content="noindex">
  <script type="text/javascript" src="./js/local-server-url.js"></script>
  <script src="./shared/overlay-control-transport.js"></script>
  <script src="./libs/objects.js"></script>
  <script src="./shared/utils/chatHtml.js"></script>
  <script src="./currency.js"></script>
  <script src="./shared/session-stats.js"></script>
    <!--
        ================================================================================
        META OVERLAY CONTEXT FOR FUTURE CONTRIBUTORS / AI AGENTS
        ================================================================================

        Role of this page:
        - This overlay is a dedicated renderer for metadata-only events (no chat bubble text
          required), primarily for auction / commerce / giveaway style workflows.
        - It acts like a compact status bar: values are updated in place as new meta events
          arrive (for example auction status, current bidder, bids, timer, product counts).
        - It is intentionally separate from message overlays (featured/dock) so streamers can
          show "state" data independently of chat.

        Why this exists:
        - Some platforms emit important non-message updates under `data.meta`.
        - Main chat overlays optimize for messages; this page optimizes for continuously
          changing structured values.

        Canonical event references:
        - Event vocabulary and payload contract:
            docs/event-reference.html
        - Whatnot source that emits commerce/auction meta updates:
            sources/whatnot.js
        - Message pipeline/filtering behavior (important for metadata-only events):
            background.js

        Popup wiring (this page depends on it):
        - Overlay section and controls:
            popup.html  (search for "Meta Data Bar", id="meta", id="metalink")
        - URL-generation + parameter plumbing:
            popup.js
            - setupPageLinks(): adds { id: "meta", path: "meta.html" }
            - getTargetMap(): index 24 reserved for this overlay (`meta: 24`)
            - refreshLinks()/cleanup maps include `metalink`
        - Query params for this page are set via `data-param24`, `data-numbersetting24`,
          and `data-textparam24` in popup.html.

        Presentation URL params (all optional):
        - &style=glass|neon|minimal|card|strip   visual theme for the stat chips (default: pill chips).
          strip is a flat full-width bar, at the bottom unless &position says otherwise.
        - &stats=biggest,donations,subs,bits,follows,lastchat,latestfollow,latestsub,latesttip,latestbits,
          topgifter,topbits,totalsubs,totalfollows,subathon,subathonrules,clock   running values this page
          works out itself from the feed, shown in the order listed (bare &stats = biggest,subs,bits,clock).
          Saved in this browser. &statsreset=manual keeps the day's totals past midnight; the popup's
          reset button sends {cmd:"resetmetastats"}. &demo shows sample values.
          Rename any stat with &<key>label=, for example &biggestlabel=Biggest%20D.
        - &counters=Deaths|!death,Owed%20Pushups|!pushup|sub:15|gift:15   named tallies. Mods, hosts and
          admins change them from chat: !death, !death -1, !death =5, !death reset. &counterall lets anyone add 1.
          Optional rules add on events: sub, gift (per sub), bits (per 100), tip (per $1), follow, raid.
          goal:25 shows 3/25 with a bar, so a list of them makes a stacked goal panel, and daily:1 resets at midnight.
        - &subathon=6h&subathonsub=10&subathonbits=4&subathontip=1&subathonfollow=0&subathonraid=30&subathonmax=72h
          a countdown that support pushes back, in minutes (subathonsub=6,15,40 for tiers 1, 2, 3).
          It waits for "!subathon start" or the popup button unless &subathonstart is set. Mods also get
          pause, add 30m, remove 10m, set 6h and reset. &subathoncmd renames the command.
        - Feed: stats use the existing dock feed and its host filters. They add a hidden bridge
          labelled "dock" (or use the &server2 socket). The meta bridge only supplies channel totals
          and metadata chips; it does not bypass dock filters for counting support.
        - &demo needs &stats, &counters or &subathon and stays offline.
        - &layout=column|grid              chip flow (default: wrapping row)
        - &position=top-left|top-center|top-right|middle-left|center|middle-right|
                    bottom-left|bottom-center|bottom-right
          placement within the frame (default: top-left). Legacy &alignright and
          &align=center are still honored.
        - Viewer-count chips render a green pulsing "live" dot instead of an emoji icon.

        Expected inbound payload shape:
        - Standard Social Stream event object, with metadata in top-level `meta`.
        - Common event names handled directly:
            auction_update
            commerce_update
            viewer_update
            viewer_updates
            hype_train
        - Optional generic fallback for other meta events when enabled.

        Guardrails / do not do:
        - Do NOT change core event field names casually (`event`, `type`, `meta`) here.
          If event schema changes, update docs/event-reference.html first.
        - Do NOT assume `chatname` / `chatmessage` exists; this page is meta-first.
        - Do NOT break zero values (for example `meta: 0` in viewer updates). Zero is a valid
          state and must still render.
        - Do NOT mutate outbound contracts from this page; it is a renderer only.
        - Do NOT hardcode source-specific assumptions outside clearly isolated logic.

        Extension + Electron compatibility notes:
        - This page supports both transport styles:
            1) session iframe/WebRTC bridge (`?session=...`)
            2) websocket relay modes (`?server=...` or `?server2=...` / `?server3=...`)
        - When server params are present, websocket mode is preferred to avoid duplicate
          updates from simultaneous transports.
        - Keep logic browser-safe and avoid extension-only APIs in this file.

        Maintenance expectations:
        - If you add support for new meta event types:
            1) Add/adjust parsing here.
            2) Verify popup controls if new toggles are needed.
            3) Update docs/event-reference.html.
            4) Run a syntax check on this script.
        ================================================================================
    -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Overlay - Social Stream Ninja</title>
    <link rel="icon" href="./favicon.ico" />
    <style>
        :root {
            --text-color: #f4f6ff;
            --muted-color: #b8bfda;
            --chip-bg: rgba(12, 16, 28, 0.88);
            --chip-border: rgba(171, 183, 229, 0.28);
            --title-bg: rgba(8, 12, 22, 0.76);
            --hype-purple: #9146ff;
            --hype-purple-dark: #451093;
            --hype-purple-light: #bf94ff;
            --hype-cyan: #00f5d4;
            --hype-gold: #f6d365;
            --outline: -0.5px -0.5px 0 #000, 0.5px -0.5px 0 #000, -0.5px 0.5px 0 #000, 0.5px 0.5px 0 #000;
            --scale: 1;
            --panel-opacity: 1;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            color: var(--text-color);
            font-family: "Sora", "Segoe UI", Roboto, Arial, sans-serif;
            background: transparent;
        }

        body {
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            text-shadow: var(--outline);
        }

        body.no-outline {
            text-shadow: none;
        }

        /* 9-zone placement: pos-x-{left|center|right} + pos-y-{top|middle|bottom} */
        body.pos-x-center {
            justify-content: center;
        }

        body.pos-x-right {
            justify-content: flex-end;
        }

        body.pos-y-middle {
            align-items: center;
        }

        body.pos-y-bottom {
            align-items: flex-end;
        }

        #root {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 14px;
            width: fit-content;
            max-width: min(96vw, 1800px);
            transform: scale(var(--scale));
            transform-origin: top left;
            opacity: var(--panel-opacity);
        }

        body.pos-x-center #root {
            align-items: center;
        }

        body.pos-x-center #bar {
            justify-content: center;
        }

        body.pos-x-right #root {
            align-items: flex-end;
        }

        body.pos-x-right #bar {
            justify-content: flex-end;
        }

        #title {
            display: inline-flex;
            align-items: center;
            width: fit-content;
            max-width: 100%;
            padding: 6px 12px;
            border-radius: 999px;
            background: var(--title-bg);
            border: 1px solid rgba(164, 178, 231, 0.4);
            color: #dce3ff;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.01em;
            white-space: nowrap;
        }

        #bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            min-height: 36px;
        }

        .stat {
            display: inline-flex;
            align-items: center;
            max-width: min(94vw, 460px);
            gap: 6px;
            padding: 7px 11px;
            border-radius: 999px;
            border: 1px solid var(--chip-border);
            background: linear-gradient(180deg, rgba(22, 28, 46, 0.92), rgba(10, 13, 24, 0.92));
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(3px);
            font-size: 15px;
            line-height: 1;
        }

        .live-dot {
            position: relative;
            display: inline-block;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 8px 2px rgba(34, 197, 94, 0.6);
            animation: livePulse 1.8s ease-out infinite;
        }

        @keyframes livePulse {
            0% {
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.55), 0 0 8px 2px rgba(34, 197, 94, 0.6);
            }
            70% {
                box-shadow: 0 0 0 7px rgba(34, 197, 94, 0), 0 0 8px 2px rgba(34, 197, 94, 0.6);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0), 0 0 8px 2px rgba(34, 197, 94, 0.6);
            }
        }

        .chat-line {
            display: block;
            min-width: 0;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .chat-name {
            margin-right: 0.35em;
            font-weight: 700;
        }

        .chat-text img {
            width: auto;
            height: 1.2em;
            vertical-align: middle;
        }

        .stat-clock.bump .value {
            animation: none;
        }

        .stat-subathon .value {
            font-variant-numeric: tabular-nums;
        }

        .stat.is-paused .value {
            opacity: 0.6;
        }

        .stat-counter {
            position: relative;
        }

        .stat.category-stats .label,
        .stat.category-stats .value {
            flex: 0 1 auto;
            min-width: 0;
        }

        .stat.category-stats .label {
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stat-counter .value,
        .stat-subs .value,
        .stat-bits .value,
        .stat-donations .value,
        .stat-follows .value,
        .stat-totalsubs .value,
        .stat-totalfollows .value,
        .stat-subathon .value,
        .stat-clock .value {
            flex: 0 0 auto;
            overflow: visible;
        }

        .stat-subathonrules {
            max-width: min(94vw, 900px);
        }

        .stat-subathonrules .icon {
            display: none;
        }

        .stat-subathonrules .value {
            white-space: normal;
            line-height: 1.25;
        }

        body.style-strip .stat-subathonrules .value {
            white-space: nowrap;
        }

        body.layout-grid.has-stats #bar {
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        }

        .stat.has-progress {
            padding-bottom: 11px;
        }

        body.style-strip .stat.has-progress {
            padding-bottom: 0;
        }

        .stat-progress {
            position: absolute;
            left: 11px;
            right: 11px;
            bottom: 2px;
            height: 3px;
            border-radius: 2px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.2);
        }

        .stat-progress span {
            display: block;
            height: 100%;
            background: var(--text-color);
            transition: width 0.4s ease;
        }

        body.style-strip .stat-progress {
            display: none;
        }

        .stat.bump .value {
            display: inline-block;
            animation: valueBump 0.55s ease;
        }

        @keyframes valueBump {
            0% {
                transform: scale(1.22);
                color: #aef4c2;
            }
            100% {
                transform: scale(1);
            }
        }

        .stat.category-auction {
            border-color: rgba(255, 190, 88, 0.6);
        }

        .stat.category-commerce {
            border-color: rgba(89, 214, 181, 0.55);
        }

        .stat.category-viewers {
            border-color: rgba(130, 164, 255, 0.62);
        }

        .stat.category-hype {
            border-color: rgba(145, 70, 255, 0.68);
        }

        .stat.category-othermeta {
            border-color: rgba(208, 157, 255, 0.55);
        }

        #hype {
            display: none;
            width: 100%;
            min-width: min(720px, 92vw);
        }

        .hype-topbar {
            position: relative;
            overflow: hidden;
            width: 100%;
            min-height: 62px;
            border-radius: 8px;
            border: 1px solid rgba(191, 148, 255, 0.72);
            background: linear-gradient(90deg, rgba(35, 7, 77, 0.94), rgba(79, 23, 149, 0.94) 42%, rgba(24, 14, 48, 0.94));
            box-shadow: 0 8px 26px rgba(30, 0, 74, 0.42), inset 0 0 0 1px rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(2px);
        }

        .hype-topbar.is-treasure {
            border-color: rgba(246, 211, 101, 0.78);
            background: linear-gradient(90deg, rgba(44, 26, 4, 0.96), rgba(103, 65, 10, 0.94) 44%, rgba(35, 17, 48, 0.94));
            box-shadow: 0 8px 26px rgba(71, 39, 0, 0.42), inset 0 0 0 1px rgba(255, 255, 255, 0.08);
        }

        .hype-topbar.is-ended {
            opacity: 0.9;
        }

        .hype-progress-fill {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 0%;
            min-width: 4px;
            background: linear-gradient(90deg, rgba(145, 70, 255, 0.92), rgba(0, 245, 212, 0.74));
            box-shadow: 0 0 24px rgba(145, 70, 255, 0.56);
            transition: width 360ms ease;
        }

        .hype-topbar.is-treasure .hype-progress-fill {
            background: linear-gradient(90deg, rgba(246, 211, 101, 0.94), rgba(255, 151, 79, 0.76));
            box-shadow: 0 0 24px rgba(246, 211, 101, 0.45);
        }

        .hype-progress-sheen {
            position: absolute;
            inset: 0;
            background:
                linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.18), transparent),
                repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0 1px, transparent 1px 12px);
            opacity: 0.45;
            pointer-events: none;
        }

        .hype-content {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            min-height: 62px;
            padding: 10px 14px;
        }

        .hype-main {
            min-width: 0;
        }

        .hype-label-row,
        .hype-detail-row {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .hype-title {
            color: #ffffff;
            font-size: 20px;
            font-weight: 900;
            line-height: 1;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .hype-phase {
            padding: 3px 8px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.22);
            color: #ffffff;
            font-size: 11px;
            font-weight: 800;
            line-height: 1;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .hype-detail-row {
            margin-top: 7px;
            color: rgba(245, 241, 255, 0.92);
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
        }

        .hype-detail {
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .hype-side {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 5px;
            max-width: 46%;
            min-width: 150px;
        }

        .hype-level {
            color: #ffffff;
            font-size: 18px;
            font-weight: 900;
            line-height: 1;
            white-space: nowrap;
        }

        .hype-contributors {
            max-width: 100%;
            overflow: hidden;
            color: rgba(245, 241, 255, 0.82);
            font-size: 12px;
            font-weight: 700;
            line-height: 1.25;
            text-align: right;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        @media (max-width: 680px) {
            .hype-content {
                align-items: flex-start;
                flex-direction: column;
                gap: 8px;
            }

            .hype-side {
                align-items: flex-start;
                max-width: 100%;
                min-width: 0;
            }

            .hype-contributors {
                text-align: left;
            }
        }

        .icon {
            display: inline-flex;
            align-items: center;
            flex: 0 0 auto;
            font-size: 15px;
            color: #9db1dd;
        }

        .icon svg {
            display: block;
            width: 1.05em;
            height: 1.05em;
            filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.55));
        }

        .stat.category-auction .icon {
            color: #fbbf24;
        }

        .stat.category-commerce .icon {
            color: #34d399;
        }

        .stat.category-hype .icon {
            color: #bf94ff;
        }

        .stat.category-othermeta .icon {
            color: #d09dff;
        }

        .label {
            color: var(--muted-color);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            white-space: nowrap;
        }

        .value {
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .empty {
            color: rgba(225, 231, 255, 0.78);
            font-size: 15px;
            padding: 8px 12px;
            border-radius: 999px;
            border: 1px dashed rgba(170, 185, 233, 0.45);
            background: rgba(10, 14, 24, 0.58);
        }

        body.hide-icons .icon {
            display: none;
        }

        body.hide-labels .label {
            display: none;
        }

        body.hide-values .value {
            display: none;
        }

        body.compact #bar {
            gap: 5px;
        }

        body.compact .stat {
            padding: 5px 8px;
            gap: 5px;
            font-size: 13px;
        }

        body.compact .label {
            font-size: 11px;
        }

        body.no-bg .stat {
            background: transparent;
            border-color: transparent;
            padding-left: 4px;
            padding-right: 4px;
            box-shadow: none;
        }

        body.no-bg #title {
            background: transparent;
            border-color: transparent;
            padding-left: 0;
            padding-right: 0;
        }

        body.no-bg .hype-topbar {
            background: transparent;
            box-shadow: none;
        }

        /* ---------------- Theme: glass ---------------- */
        body.style-glass .stat,
        body.style-glass #title {
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.28);
            border-radius: 14px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(14px) saturate(160%);
        }

        body.style-glass .label {
            color: rgba(255, 255, 255, 0.78);
        }

        body.style-glass .empty {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            backdrop-filter: blur(14px);
        }

        /* ---------------- Theme: neon ---------------- */
        body.style-neon .stat {
            background: rgba(4, 7, 14, 0.92);
            border-radius: 10px;
            border-width: 1px;
        }

        body.style-neon #title {
            background: rgba(4, 7, 14, 0.92);
            border-radius: 10px;
        }

        body.style-neon .stat.category-auction {
            border-color: rgba(251, 191, 36, 0.85);
            box-shadow: 0 0 12px rgba(251, 191, 36, 0.35), inset 0 0 10px rgba(251, 191, 36, 0.10);
        }

        body.style-neon .stat.category-auction .value {
            color: #ffd76a;
        }

        body.style-neon .stat.category-commerce {
            border-color: rgba(52, 211, 153, 0.85);
            box-shadow: 0 0 12px rgba(52, 211, 153, 0.35), inset 0 0 10px rgba(52, 211, 153, 0.10);
        }

        body.style-neon .stat.category-commerce .value {
            color: #7df0c6;
        }

        body.style-neon .stat.category-viewers {
            border-color: rgba(34, 197, 94, 0.85);
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.35), inset 0 0 10px rgba(34, 197, 94, 0.10);
        }

        body.style-neon .stat.category-viewers .value {
            color: #8af2ae;
        }

        body.style-neon .stat.category-hype {
            border-color: rgba(191, 148, 255, 0.85);
            box-shadow: 0 0 12px rgba(145, 70, 255, 0.45), inset 0 0 10px rgba(145, 70, 255, 0.12);
        }

        body.style-neon .stat.category-hype .value {
            color: #d3b4ff;
        }

        body.style-neon .stat.category-othermeta {
            border-color: rgba(208, 157, 255, 0.7);
            box-shadow: 0 0 12px rgba(208, 157, 255, 0.3), inset 0 0 10px rgba(208, 157, 255, 0.08);
        }

        /* ---------------- Theme: minimal ---------------- */
        body.style-minimal .stat,
        body.style-minimal #title {
            background: transparent;
            border-color: transparent;
            box-shadow: none;
            backdrop-filter: none;
            padding: 3px 6px;
        }

        body.style-minimal .empty {
            background: transparent;
            border-color: transparent;
        }

        body.style-minimal .hype-topbar {
            backdrop-filter: none;
        }

        /* ---------------- Theme: card ---------------- */
        body.style-card .stat {
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 4px 6px;
            min-width: 132px;
            padding: 11px 14px;
            border-radius: 13px;
            background: linear-gradient(160deg, rgba(26, 32, 54, 0.95), rgba(9, 12, 22, 0.95));
            border: 1px solid rgba(171, 183, 229, 0.30);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.07);
        }

        body.style-card .stat .value {
            flex-basis: 100%;
            font-size: 21px;
            font-weight: 800;
            line-height: 1.1;
        }

        body.style-card .stat .label {
            font-size: 11px;
            letter-spacing: 0.06em;
        }

        body.style-card #title {
            border-radius: 13px;
        }

        body.style-card.compact .stat .value {
            font-size: 17px;
        }

        /* ---------------- Layout: column ---------------- */
        body.style-strip #root {
            width: 100%;
            max-width: none;
            margin: 0;
            gap: 0;
            transform: none;
            font-size: calc(24px * var(--scale));
        }

        body.style-strip #bar {
            box-sizing: border-box;
            width: 100%;
            min-height: 0;
            flex-wrap: nowrap;
            justify-content: flex-end;
            gap: 0;
            padding: 0.25em 0.3em;
            background: rgba(0, 0, 0, 0.72);
        }

        body.style-strip.no-bg #bar {
            background: transparent;
        }

        body.style-strip .stat {
            flex: 0 0 auto;
            max-width: none;
            padding: 0 0.7em;
            border: 0;
            border-left: 1px solid rgba(255, 255, 255, 0.55);
            border-radius: 0;
            background: none;
            box-shadow: none;
            backdrop-filter: none;
            font-size: 1em;
            line-height: 1.2;
        }

        body.style-strip .stat:first-child {
            border-left: 0;
        }

        body.style-strip .stat-lastchat {
            flex: 1 1 0;
            min-width: 0;
        }

        body.style-strip .icon {
            display: none;
        }

        body.style-strip .label {
            color: #fff;
            font-size: 1em;
            text-transform: none;
            letter-spacing: 0;
        }

        body.style-strip .label::after {
            content: ":";
        }

        body.style-strip .value {
            font-weight: 600;
        }

        /* A crowded strip shortens names. Numbers never shrink: "Total Subs: 1" for 1,601 would be wrong. */
        body.style-strip .stat-biggest,
        body.style-strip .stat-latestfollow,
        body.style-strip .stat-latestsub,
        body.style-strip .stat-latesttip,
        body.style-strip .stat-latestbits,
        body.style-strip .stat-latestraid,
        body.style-strip .stat-subathonrules,
        body.style-strip .stat-topgifter,
        body.style-strip .stat-topbits {
            flex: 0 1 auto;
            min-width: 0;
            overflow: hidden;
        }

        /* On the one-line bar a name gives way before its label does. */
        body.style-strip .stat.category-stats .label {
            flex-shrink: 0;
        }

        body.layout-column #bar {
            flex-direction: column;
            align-items: stretch;
        }

        body.layout-column .stat {
            width: 100%;
            min-width: 220px;
            max-width: min(94vw, 360px);
            justify-content: space-between;
        }

        body.layout-column .stat .label {
            margin-right: auto;
        }

        body.layout-column.style-card .stat {
            justify-content: flex-start;
        }

        body.layout-column #hype {
            min-width: min(360px, 92vw);
        }

        /* ---------------- Layout: grid ---------------- */
        body.layout-grid #bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            width: min(92vw, 760px);
        }

        body.layout-grid .stat {
            width: 100%;
            max-width: none;
        }
    </style>
</head>
<body>
    <main id="root">
        <div id="title"></div>
        <div id="hype" aria-live="polite"></div>
        <div id="bar" aria-live="polite"></div>
    </main>

    <script>
        (function () {
            var urlParams = new URLSearchParams(window.location.search);

            var showIcon = !urlParams.has("noicon");
            var showLabel = !urlParams.has("nolabel");
            var showValue = !urlParams.has("novalue");
            if (!showIcon && !showLabel && !showValue) {
                showValue = true;
            }

            var STAT_LABELS = {
                lastchat: "", biggest: "Biggest Donation", donations: "Donations", subs: "Subs", bits: "Bits", follows: "Follows",
                latestfollow: "Latest Follower", latestsub: "Latest Sub", latesttip: "Latest Tip", latestbits: "Latest Bits", latestraid: "Latest Raid",
                topgifter: "Top Gifter", topbits: "Top Bits", totalsubs: "Total Subs", totalfollows: "Followers",
                subathon: "Time Remaining", subathonrules: "", clock: ""
            };
            var STAT_ICONS = {
                biggest: "trophy", donations: "money", subs: "user", bits: "gift", follows: "user", clock: "clock",
                latestfollow: "user", latestsub: "user", latesttip: "money", latestbits: "gift", latestraid: "user",
                topgifter: "trophy", topbits: "trophy", totalsubs: "user", totalfollows: "user", subathon: "clock", subathonrules: "activity"
            };
            var statKeys = !urlParams.has("stats") ? [] : (urlParams.get("stats") || "biggest,subs,bits,clock")
                .split(",")
                .map(function (key) { return key.trim().toLowerCase(); })
                .filter(function (key) { return Object.prototype.hasOwnProperty.call(STAT_LABELS, key); });
            ["subathon", "subathonrules"].forEach(function (key) {
                if (urlParams.has(key) && statKeys.indexOf(key) === -1) statKeys.push(key);
            });
            var counterDefs = SSNSessionStats.parseCounters(urlParams.get("counters"));
            var statsActive = statKeys.length > 0 || counterDefs.length > 0;
            var statsDaily = urlParams.get("statsreset") !== "manual";
            var statsDemo = statsActive && (urlParams.has("demo") || urlParams.has("preview"));
            var statsSession = String(urlParams.get("session") || "").split(",")[0];
            var sessionStats = null;
            var counters = null;
            var subathon = null;
            var subathonCommand = String(urlParams.get("subathoncmd") || "!subathon").trim().toLowerCase();
            var lastChat = null;
            var clockText = "";
            var feedIframe = null;

            var explicitFilter = {
                auction: urlParams.has("auction"),
                commerce: urlParams.has("commerce"),
                viewers: urlParams.has("viewers"),
                hype: urlParams.has("hype"),
                othermeta: urlParams.has("othermeta")
            };
            var hasExplicitFilter = explicitFilter.auction || explicitFilter.commerce || explicitFilter.viewers || explicitFilter.hype || explicitFilter.othermeta || statsActive;
            var hideAuctionExtras = urlParams.has("hideauctionextras");
            var hideCommerceExtras = urlParams.has("hidecommerceextras");
            var hideViewerPlatforms = urlParams.has("hideviewerplatforms");
            var hideDebugMeta = urlParams.has("hidedebugmeta");
            var hiddenFieldKeywords = String(urlParams.get("hidefields") || "")
                .split(",")
                .map(function (keyword) { return keyword.trim().toLowerCase(); })
                .filter(Boolean);

            var titleNode = document.getElementById("title");
            var hypeNode = document.getElementById("hype");
            var barNode = document.getElementById("bar");
            var state = new Map();
            var hypeTrainState = null;
            var hypeTrainTimer = null;
            var hypeTrainRemoveTimer = null;
            var HYPE_TRAIN_REMOVE_DELAY_MS = 30000;
            var viewerCounts = Object.create(null);
            var sequenceCounter = 0;
            var iframe = null;
            var sockets = [];
            var hasServerMode = urlParams.has("server") || urlParams.has("server2") || urlParams.has("server3");

            var requestedTitle = String(urlParams.get("title") || "").trim();
            if (requestedTitle) {
                titleNode.textContent = requestedTitle;
            } else {
                titleNode.style.display = "none";
            }
            if (urlParams.has("hidetitle")) {
                titleNode.style.display = "none";
            }
            if (!showIcon) {
                document.body.classList.add("hide-icons");
            }
            if (!showLabel) {
                document.body.classList.add("hide-labels");
            }
            if (!showValue) {
                document.body.classList.add("hide-values");
            }
            if (urlParams.has("compact")) {
                document.body.classList.add("compact");
            }
            if (urlParams.has("nobg") || urlParams.has("transparent")) {
                document.body.classList.add("no-bg");
            }
            if (urlParams.has("nooutline")) {
                document.body.classList.add("no-outline");
            }

            var styleName = (urlParams.get("style") || urlParams.get("theme") || "").toLowerCase();
            if (["glass", "neon", "minimal", "card", "strip"].indexOf(styleName) > -1) {
                document.body.classList.add("style-" + styleName);
            }

            var layoutName = (urlParams.get("layout") || "").toLowerCase();
            if (layoutName === "column" || layoutName === "stack" || layoutName === "vertical") {
                document.body.classList.add("layout-column");
            } else if (layoutName === "grid") {
                document.body.classList.add("layout-grid");
            }

            // Placement: &position=top-left|top-center|top-right|middle-left|center|middle-right|bottom-left|bottom-center|bottom-right
            var posX = "left";
            var posY = "top";
            var positionValue = (urlParams.get("position") || (styleName === "strip" ? "bottom" : "")).toLowerCase().replace(/[^a-z]+/g, "-");
            if (positionValue) {
                var tokens = positionValue.split("-").filter(Boolean);
                var sawCenter = false;
                tokens.forEach(function (token) {
                    if (token === "left" || token === "right") {
                        posX = token;
                    } else if (token === "top" || token === "bottom") {
                        posY = token;
                    } else if (token === "middle") {
                        posY = "middle";
                    } else if (token === "center" || token === "centre") {
                        sawCenter = true;
                    }
                });
                if (sawCenter) {
                    if (tokens.indexOf("top") > -1 || tokens.indexOf("bottom") > -1) {
                        posX = "center";
                    } else if (tokens.indexOf("left") > -1 || tokens.indexOf("right") > -1) {
                        posY = "middle";
                    } else {
                        posX = "center";
                        posY = "middle";
                    }
                }
            }
            // Legacy params still supported
            if (urlParams.has("alignright")) {
                posX = "right";
            } else if ((urlParams.get("align") || "").toLowerCase() === "center") {
                posX = "center";
            }
            document.body.classList.add("pos-x-" + posX);
            document.body.classList.add("pos-y-" + posY);
            document.getElementById("root").style.transformOrigin =
                posX + " " + (posY === "middle" ? "center" : posY);

            var scaleValue = parseFloat(urlParams.get("scale"));
            if (Number.isFinite(scaleValue) && scaleValue > 0) {
                document.documentElement.style.setProperty("--scale", String(Math.max(0.35, Math.min(4, scaleValue))));
            }

            var opacityValue = parseFloat(urlParams.get("opacity"));
            if (Number.isFinite(opacityValue)) {
                document.documentElement.style.setProperty("--panel-opacity", String(Math.max(0.05, Math.min(1, opacityValue))));
            }

            if (urlParams.has("pagebg")) {
                var pageBg = (urlParams.get("pagebg") || "").trim();
                if (pageBg) {
                    document.body.style.background = pageBg;
                }
            }

            function normalizeEventName(eventName) {
                if (typeof eventName !== "string") return "";
                return eventName
                    .toLowerCase()
                    .replace(/[^a-z0-9]+/g, "_")
                    .replace(/_+/g, "_")
                    .replace(/^_+|_+$/g, "");
            }

            function getEventCategory(normalizedEventName) {
                if (normalizedEventName === "auction_update") return "auction";
                if (normalizedEventName === "commerce_update") return "commerce";
                if (normalizedEventName === "viewer_update" || normalizedEventName === "viewer_updates") return "viewers";
                if (normalizedEventName === "hype_train") return "hype";
                return "othermeta";
            }

            function eventIsEnabled(normalizedEventName) {
                var category = getEventCategory(normalizedEventName);
                if (hasExplicitFilter) {
                    return !!explicitFilter[category];
                }
                return category !== "othermeta";
            }

            function isPlainObject(value) {
                return Object.prototype.toString.call(value) === "[object Object]";
            }

            function toDisplayLabel(rawKey) {
                if (!rawKey || typeof rawKey !== "string") return "Value";
                return rawKey
                    .replace(/\./g, " ")
                    .replace(/([a-z0-9])([A-Z])/g, "$1 $2")
                    .replace(/[_\-]+/g, " ")
                    .trim()
                    .replace(/\b\w/g, function (char) { return char.toUpperCase(); });
            }

            function formatCurrency(value) {
                var numeric = Number(value);
                if (!Number.isFinite(numeric)) return String(value);
                var hasDecimals = Math.abs(numeric % 1) > 0;
                return "$" + numeric.toLocaleString(undefined, {
                    minimumFractionDigits: hasDecimals ? 2 : 0,
                    maximumFractionDigits: hasDecimals ? 2 : 0
                });
            }

            function formatValue(value) {
                if (value === null || typeof value === "undefined") return "";
                if (typeof value === "boolean") return value ? "Yes" : "No";
                if (typeof value === "number") return Number.isFinite(value) ? value.toLocaleString() : String(value);
                if (typeof value === "string") return value.trim();
                if (Array.isArray(value)) {
                    if (!value.length) return "";
                    var primitiveOnly = value.every(function (item) {
                        return item === null || ["string", "number", "boolean"].indexOf(typeof item) > -1;
                    });
                    if (primitiveOnly) {
                        return value.map(formatValue).filter(Boolean).join(", ");
                    }
                    return value.length.toLocaleString() + " items";
                }
                if (isPlainObject(value)) {
                    return Object.keys(value).length.toLocaleString() + " fields";
                }
                return String(value);
            }

            function trimValue(value, maxLength) {
                var stringValue = String(value || "");
                if (stringValue.length <= maxLength) return stringValue;
                return stringValue.slice(0, maxLength - 1) + "…";
            }

            var SVG_ICON_PREFIX = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
            var SVG_ICONS = {
                money: '<line x1="12" y1="2" x2="12" y2="22"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>',
                gavel: '<path d="m14.5 12.5-8 8a2.119 2.119 0 1 1-3-3l8-8"></path><path d="m16 16 6-6"></path><path d="m8 8 6-6"></path><path d="m9 7 8 8"></path><path d="m21 11-8-8"></path>',
                clock: '<circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline>',
                trophy: '<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path>',
                user: '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle>',
                calendar: '<rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line>',
                target: '<circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle>',
                tag: '<path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.83z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line>',
                folder: '<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>',
                box: '<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line>',
                gift: '<polyline points="20 12 20 22 4 22 4 12"></polyline><rect x="2" y="7" width="20" height="5"></rect><line x1="12" y1="22" x2="12" y2="7"></line><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path>',
                dice: '<rect x="3" y="3" width="18" height="18" rx="3"></rect><circle cx="8.5" cy="8.5" r="1.1" fill="currentColor" stroke="none"></circle><circle cx="15.5" cy="8.5" r="1.1" fill="currentColor" stroke="none"></circle><circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none"></circle><circle cx="8.5" cy="15.5" r="1.1" fill="currentColor" stroke="none"></circle><circle cx="15.5" cy="15.5" r="1.1" fill="currentColor" stroke="none"></circle>',
                bag: '<path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path>',
                activity: '<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>'
            };

            function iconForField(fieldKey, category) {
                var key = String(fieldKey || "").toLowerCase();
                if (/viewer|view/.test(key)) return "::live";
                if (/price|amount|cost|revenue/.test(key)) return "money";
                if (/bid/.test(key)) return "gavel";
                if (/timer|time|countdown/.test(key)) return "clock";
                if (/winner|bidder|winning|won|sold|status/.test(key)) return "trophy";
                if (/seller|host/.test(key)) return "user";
                if (/schedule|reminder|date/.test(key)) return "calendar";
                if (/action|button|cta/.test(key)) return "target";
                if (/qty|quantity|stock|available|availability|left|remaining/.test(key)) return "box";
                if (/giveaway/.test(key)) return "gift";
                if (/surprise/.test(key)) return "dice";
                if (/title|name|item|listing|featured/.test(key)) return "tag";
                if (/product/.test(key)) return "bag";
                if (/category|type/.test(key)) return "folder";
                if (/total/.test(key)) return "money";
                if (category === "auction") return "gavel";
                if (category === "commerce") return "bag";
                if (category === "viewers") return "::live";
                return "activity";
            }

            function setEntry(id, label, value, fieldKey, category, order) {
                if (!id) return;
                if (shouldHideEntry(id, label, fieldKey, category)) return;
                var formatted = trimValue(formatValue(value), 96);
                if (!formatted) return;

                var existing = state.get(id);
                state.set(id, {
                    id: id,
                    label: label || toDisplayLabel(id),
                    value: formatted,
                    icon: iconForField(fieldKey || id, category),
                    category: category || "othermeta",
                    order: Number.isFinite(order) ? order : 500,
                    sequence: existing ? existing.sequence : ++sequenceCounter,
                    changedAt: existing && existing.value !== formatted ? Date.now() : (existing ? existing.changedAt : 0)
                });
            }

            function shouldHideEntry(id, label, fieldKey, category) {
                var fingerprint = [
                    String(id || ""),
                    String(label || ""),
                    String(fieldKey || ""),
                    String(category || "")
                ].join(" ").toLowerCase();

                if (hideDebugMeta) {
                    var debugPattern = /(index|profile|href|url|source\s*mode|source|debug|raw|avatar|image|sellerurl|reminder|callback|trace|technical)/;
                    if (debugPattern.test(fingerprint)) {
                        return true;
                    }
                }

                if (hiddenFieldKeywords.length) {
                    for (var i = 0; i < hiddenFieldKeywords.length; i++) {
                        if (!hiddenFieldKeywords[i]) continue;
                        if (fingerprint.indexOf(hiddenFieldKeywords[i]) !== -1) {
                            return true;
                        }
                    }
                }

                return false;
            }

            function removeEntriesByPrefix(prefix) {
                Array.from(state.keys()).forEach(function (key) {
                    if (key.indexOf(prefix) === 0) {
                        state.delete(key);
                    }
                });
            }

            function parseNumber(value) {
                if (typeof value === "number" && Number.isFinite(value)) {
                    return value;
                }
                if (typeof value === "string") {
                    var cleaned = value.replace(/[^0-9.-]/g, "");
                    if (!cleaned) return null;
                    var parsed = parseFloat(cleaned);
                    return Number.isFinite(parsed) ? parsed : null;
                }
                return null;
            }

            function formatHypeTrainNumber(value) {
                var numeric = parseNumber(value);
                if (numeric === null) return "";
                return numeric.toLocaleString();
            }

            function getHypeTrainTitle(meta) {
                var trainType = String(meta && meta.trainType ? meta.trainType : "").toLowerCase();
                if (trainType.indexOf("treasure") !== -1) return "Treasure Train";
                if (meta && meta.isSharedTrain) return "Shared Hype Train";
                return "Hype Train";
            }

            function getHypeTrainPhaseLabel(phase) {
                if (phase === "begin") return "Started";
                if (phase === "end") return "Complete";
                return "In Progress";
            }

            function getHypeTrainPercent(meta) {
                if (!meta) return 0;
                if (String(meta.phase || "").toLowerCase() === "end") return 100;
                var progressPercent = parseNumber(meta.progressPercent);
                if (progressPercent !== null) return Math.max(0, Math.min(100, progressPercent));
                var progress = parseNumber(meta.progress);
                var goal = parseNumber(meta.goal);
                if (progress === null || goal === null || goal <= 0) return 0;
                return Math.max(0, Math.min(100, (progress / goal) * 100));
            }

            function formatTimeUntil(value) {
                if (!value) return "";
                var target = new Date(value);
                if (isNaN(target.getTime())) return "";
                var seconds = Math.max(0, Math.round((target.getTime() - Date.now()) / 1000));
                var minutes = Math.floor(seconds / 60);
                var remainder = seconds % 60;
                return minutes > 0 ? minutes + "m " + remainder + "s left" : remainder + "s left";
            }

            function formatHypeTrainContributors(contributions) {
                if (!Array.isArray(contributions) || !contributions.length) return "";
                return contributions.slice(0, 3).map(function (contribution) {
                    var name = contribution.userName || contribution.userLogin || "Anonymous";
                    var total = formatHypeTrainNumber(contribution.total);
                    var type = contribution.type ? " " + contribution.type : "";
                    return name + (total ? " " + total : "") + type;
                }).join(", ");
            }

            function clearHypeTrain() {
                hypeTrainState = null;
                if (hypeTrainTimer) {
                    clearInterval(hypeTrainTimer);
                    hypeTrainTimer = null;
                }
                if (hypeTrainRemoveTimer) {
                    clearTimeout(hypeTrainRemoveTimer);
                    hypeTrainRemoveTimer = null;
                }
                hypeNode.style.display = "none";
                hypeNode.textContent = "";
                render();
            }

            function renderHypeTrainTopbar() {
                if (!hypeTrainState || !isPlainObject(hypeTrainState.meta)) {
                    hypeNode.style.display = "none";
                    hypeNode.textContent = "";
                    return;
                }

                var meta = hypeTrainState.meta;
                var phase = String(meta.phase || "progress").toLowerCase();
                var percent = getHypeTrainPercent(meta);
                var progress = formatHypeTrainNumber(meta.progress);
                var goal = formatHypeTrainNumber(meta.goal);
                var total = formatHypeTrainNumber(meta.total);
                var level = formatHypeTrainNumber(meta.level);
                var timeText = phase === "end" ? "" : formatTimeUntil(meta.expiresAt);
                var contributors = formatHypeTrainContributors(meta.topContributions);
                var trainType = String(meta.trainType || "").toLowerCase();
                var isTreasure = trainType.indexOf("treasure") !== -1;

                hypeNode.style.display = "block";
                hypeNode.textContent = "";

                var topbar = document.createElement("div");
                topbar.className = "hype-topbar" + (isTreasure ? " is-treasure" : "") + (phase === "end" ? " is-ended" : "");

                var fill = document.createElement("div");
                fill.className = "hype-progress-fill";
                fill.style.width = percent.toFixed(1) + "%";
                topbar.appendChild(fill);

                var sheen = document.createElement("div");
                sheen.className = "hype-progress-sheen";
                topbar.appendChild(sheen);

                var content = document.createElement("div");
                content.className = "hype-content";

                var main = document.createElement("div");
                main.className = "hype-main";

                var labelRow = document.createElement("div");
                labelRow.className = "hype-label-row";

                var title = document.createElement("div");
                title.className = "hype-title";
                title.textContent = getHypeTrainTitle(meta);
                labelRow.appendChild(title);

                var phaseNode = document.createElement("div");
                phaseNode.className = "hype-phase";
                phaseNode.textContent = getHypeTrainPhaseLabel(phase);
                labelRow.appendChild(phaseNode);

                main.appendChild(labelRow);

                var detailRow = document.createElement("div");
                detailRow.className = "hype-detail-row";
                if (progress && goal) {
                    var progressDetail = document.createElement("span");
                    progressDetail.className = "hype-detail";
                    progressDetail.textContent = progress + " / " + goal;

            function flattenMeta(value, prefix, depth, output) {
                if (depth > 2 || value === null || typeof value === "undefined") return;

                if (Array.isArray(value)) {
                    if (!value.length) return;
                    var primitiveOnly = value.every(function (item) {
                        return item === null || ["string", "number", "boolean"].indexOf(typeof item) > -1;
                    });
                    if (primitiveOnly) {
                        output.push([prefix, value.map(formatValue).filter(Boolean).join(", ")]);
                    } else {
                        output.push([prefix + ".count", value.length]);
                    }
                    return;
                }

                if (isPlainObject(value)) {
                    var keys = Object.keys(value);
                    for (var i = 0; i < keys.length && i < 12; i++) {
                        var key = keys[i];
                        var nextPrefix = prefix ? prefix + "." + key : key;
                        flattenMeta(value[key], nextPrefix, depth + 1, output);
                    }
                    return;
                }

                output.push([prefix, value]);
            }

            function updateGenericMetaEntries(normalizedEventName, meta) {
                var basePrefix = "othermeta." + normalizedEventName + ".";
                var flattened = [];
                flattenMeta(meta, "", 0, flattened);

                if (!flattened.length) {
                    setEntry(basePrefix + "value", toDisplayLabel(normalizedEventName), meta, normalizedEventName, "othermeta", 400);
                    return;
                }

                var keep = Object.create(null);
                var limit = 10;
                for (var i = 0; i < flattened.length && i < limit; i++) {
                    var pair = flattened[i];
                    var key = pair[0] || "value";
                    var id = basePrefix + key;
                    keep[id] = true;
                    setEntry(id, toDisplayLabel(key), pair[1], key, "othermeta", 410 + i);
                }

                Array.from(state.keys()).forEach(function (entryId) {
                    if (entryId.indexOf(basePrefix) === 0 && !keep[entryId]) {
                        state.delete(entryId);
                    }
                });
            }

                    if (subathon.isEnded()) return "Ended";
                    if (!subathon.isRunning()) return "Paused";

                var custom = String(urlParams.get(key + "label") || "").trim();
                if (custom) return custom;
                return statsDaily && (key === "subs" || key === "follows") ? STAT_LABELS[key] + " Today" : STAT_LABELS[key];
            }

            function personText(person) {
                if (!person) return "-";
                return person.amount ? person.name + " " + person.amount : person.name;
            }

            function statValue(key, totals) {
                switch (key) {
                    case "biggest": return totals.biggest ? totals.biggest.name + ": " + totals.biggest.amount : "-";
                    case "donations": return "$" + totals.donations.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                    case "clock": return clockText;
                    case "latestfollow": return personText(totals.latest.follow);
                    case "latestsub": return personText(totals.latest.sub);
                    case "latesttip": return personText(totals.latest.tip);
                    case "latestbits": return personText(totals.latest.bits);
                    case "latestraid": return personText(totals.latest.raid);
                    case "topgifter": return totals.topGifter ? totals.topGifter.name + " " + totals.topGifter.count.toLocaleString() : "-";
                    case "topbits": return totals.topBits ? totals.topBits.name + " " + totals.topBits.count.toLocaleString() : "-";
                    case "totalsubs": return totals.totalSubs;
                    case "totalfollows": return totals.totalFollows;
                    case "subathon": return subathon ? SSNSessionStats.formatClock(subathon.remaining()) : "-";
                    case "subathonrules": return subathon ? subathon.rules() || "-" : "-";
                    default: return totals[key];
                }
            }

            function syncStatEntries() {
                var totals = sessionStats.read();
                statKeys.forEach(function (key, index) {
                    var id = "stats-" + key;
                    // The clock stays at the end of a bar, wherever it was listed.
                    var order = key === "clock" ? 900 : 100 + index;
                    if (key === "lastchat") {
                        state.set(id, { id: id, label: "", value: "", icon: "", category: "stats", order: order, sequence: 0, changedAt: 0, statKey: key, chat: lastChat });
                        return;
                    }
                    setEntry(id, getStatLabel(key), statValue(key, totals), key, "stats", order);
                    var entry = state.get(id);
                    if (entry) {
                        entry.label = getStatLabel(key);
                        entry.icon = STAT_ICONS[key];
                        entry.statKey = key;
                        entry.paused = key === "subathon" && !!subathon && !subathon.isRunning();
                        if (key === "subathonrules") entry.value = statValue(key, totals);
                    }
                });
                if (counters) {
                    counters.list().forEach(function (counter, index) {
                        var id = "counter-" + index;
                        var count = Math.floor(counter.value);
                        var unit = counter.money ? "$" : "";
                        var shown = counter.goal ? unit + count.toLocaleString() + "/" + unit + counter.goal.toLocaleString() : count;
                        setEntry(id, counter.label, shown, "counter", "stats", 300 + index);
                        var entry = state.get(id);
                        if (entry) {
                            entry.label = counter.label;
                            entry.icon = "target";
                            entry.statKey = "counter";
                            entry.progress = counter.goal ? Math.max(0, Math.min(1, counter.value / counter.goal)) : null;
                        }
                    });
                }
            }

            // Mods, hosts and admins only: a viewer must not be able to change a counter or the subathon clock.
            function handleChatCommand(data) {
                // The same rule giveaways use, so a command relayed to several platforms only counts once.
                if (data.event || data.bot || data.private || data.reflection) return false;
                var text = String(data.chatmessage || "").trim();
                if (text.charAt(0) !== "!") return false;
                var trusted = !!(data.mod || data.host || data.admin);
                if (subathon && trusted) {
                    var lower = text.toLowerCase();
                    if (lower === subathonCommand || lower.indexOf(subathonCommand + " ") === 0) {
                        subathon.control(text.slice(subathonCommand.length));
                        return true;
                    }
                }
                if (!counters) return false;
                if (trusted) return counters.command(text);
                return urlParams.has("counterall") && counters.viewerAdd(text, data.userid || data.chatname);
            }

            function trackStats(data, allowCommands) {
                if (!SSNSessionStats.isCountable(data)) return false;
                var changed = false;
                var worth = sessionStats.record(data);
                if (worth) {
                    changed = true;
                    if (!worth.changedOnly) {
                        if (counters) counters.onEvent(worth);
                        if (subathon) subathon.onEvent(worth);
                    }
                }
                if (allowCommands && handleChatCommand(data)) return true;
                if (statKeys.indexOf("lastchat") > -1 && data.chatname && data.chatmessage && !data.event && !data.private) {
                    lastChat = {
                        name: String(data.chatname),
                        color: typeof data.nameColor === "string" ? data.nameColor : "",
                        message: String(data.chatmessage),
                        isHtml: !data.textonly
                    };
                    changed = true;
                }
                return changed;
            }

            function buildChatLine(chat) {
                var line = document.createElement("span");
                line.className = "chat-line";
                if (!chat) return line;
                var name = document.createElement("span");
                name.className = "chat-name";
                name.textContent = chat.name + ":";
                if (chat.color) name.style.color = chat.color;
                var text = document.createElement("span");
                text.className = "chat-text";
                if (chat.isHtml && window.SocialStreamChatHTML) {
                    text.innerHTML = SocialStreamChatHTML.sanitize(chat.message);
                    Array.prototype.forEach.call(text.querySelectorAll("br"), function (lineBreak) {
                        lineBreak.parentNode.replaceChild(document.createTextNode(" "), lineBreak);
                    });
                } else {
                    text.textContent = chat.message;
                }
                line.appendChild(name);
                line.appendChild(text);
                return line;
            }

            function updateClock() {
                var text = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
                var rolledOver = sessionStats.rollover();
                var subathonEnded = !!subathon && subathon.tick();
                var countersRolledOver = !!counters && counters.rollover();
                if (subathon && !subathonEnded) updateSubathonChip();
                if (text === clockText && !rolledOver && !subathonEnded && !countersRolledOver) return;
                clockText = text;
                syncStatEntries();
                render();
            }

            function handleStatsControl(data) {
                if (data.cmd === "resetmetastats") {
                    sessionStats.reset();
                    lastChat = null;
                } else if (data.cmd === "metastats" && typeof data.value === "string") {
                    var parts = data.value.split(":");
                    if (parts[0] === "subathon" && subathon) subathon.control(parts[1] + " " + parts.slice(2).join(":"));
                    if (parts[0] === "counter" && counters) counters.control(parts[1], parts.slice(2).join(":"));
                } else {
                    return false;
                }
                syncStatEntries();
                render();
                return true;
            }

            function startStats() {
                var storage = null;
                try { storage = statsDemo ? null : window.localStorage; } catch (e) {}
                sessionStats = SSNSessionStats.create({
                    storage: storage,
                    key: "ssn-meta-stats:" + statsSession + ":" + (statsDaily ? "daily" : "manual"),
                    daily: statsDaily,
                    getUSD: getDonationValueUSD
                });
                if (counterDefs.length) {
                    counters = SSNSessionStats.createCounters({ storage: storage, key: "ssn-meta-counters:" + statsSession, counters: counterDefs });
                }
                if (statKeys.indexOf("subathon") > -1 || statKeys.indexOf("subathonrules") > -1) {
                    subathon = SSNSessionStats.createSubathon({
                        storage: storage,
                        key: "ssn-meta-subathon:" + statsSession,
                        durationMs: SSNSessionStats.parseDuration(urlParams.get("subathon")) || 3600000,
                        maxMs: SSNSessionStats.parseDuration(urlParams.get("subathonmax")),
                        perSubMinutes: String(urlParams.get("subathonsub") || "").split(",").map(Number).filter(function (value) { return value >= 0; }),
                        perBitsMinutes: Math.max(0, Number(urlParams.get("subathonbits")) || 0),
                        perTipMinutes: Math.max(0, Number(urlParams.get("subathontip")) || 0),
                        perFollowMinutes: Math.max(0, Number(urlParams.get("subathonfollow")) || 0),
                        perRaidMinutes: Math.max(0, Number(urlParams.get("subathonraid")) || 0),
                        autostart: urlParams.has("subathonstart") || statsDemo
                    });
                }
                updateClock();
                setInterval(updateClock, 1000);
                if (statsDemo) {
                    [
                        { type: "twitch", chatname: "Weakskills", hasDonation: "$123.64", donoValue: 123.64 },
                        { type: "twitch", event: "subscription_gift", chatname: "Maple", total: 20 },

                        { type: "twitch", event: "new_subscriber", chatname: "Juniper" },
                        { type: "twitch", event: "new_follower", chatname: "Sage" },
                        { type: "twitch", chatname: "Rowan", hasDonation: "4670 bits", donoValue: 46.7, meta: { bits: 4670 } },
                        { type: "twitch", chatname: "Sage", chatmessage: "Looking good!", nameColor: "#ff8fb1", textonly: true },

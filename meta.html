                        { type: "twitch", event: "follower_update", meta: 16617 }
                    ].forEach(function (sample) { processPayload(sample, "local"); });
                } else {
                    SSNOverlayControl.connect(urlParams, urlParams.get("session"), "meta", function (data) { processPayload(data); });
                }
            }

            function render() {
                var entries = Array.from(state.values()).sort(function (a, b) {
                    if (a.order !== b.order) return a.order - b.order;
                    return a.sequence - b.sequence;
                });

                barNode.textContent = "";
                if (!entries.length) {
                    if (hypeTrainState) {
                        barNode.style.display = "none";
                        return;
                    }
                    barNode.style.display = "";
                    var emptyNode = document.createElement("div");
                    emptyNode.className = "empty";
                    emptyNode.textContent = "Waiting for meta data events…";
                    barNode.appendChild(emptyNode);
                    return;
                }

                barNode.style.display = "";
                for (var i = 0; i < entries.length; i++) {
                    var entry = entries[i];
                    var chip = document.createElement("div");
                    chip.className = "stat category-" + entry.category;
                    if (entry.changedAt && Date.now() - entry.changedAt < 900) {
                        chip.className += " bump";
                    }
                    if (entry.statKey) {
                        chip.className += " stat-" + entry.statKey;
                    }
                    if (entry.paused) {
                        chip.className += " is-paused";
                    }
                    if (entry.statKey === "lastchat") {
                        chip.appendChild(buildChatLine(entry.chat));
                        barNode.appendChild(chip);
                        continue;
                    }

                    if (showIcon) {
                        var iconNode = document.createElement("span");
                        iconNode.className = "icon";
                        if (entry.icon === "::live") {
                            var dotNode = document.createElement("span");
                            dotNode.className = "live-dot";
                            iconNode.appendChild(dotNode);
                        } else if (SVG_ICONS[entry.icon]) {
                            iconNode.innerHTML = SVG_ICON_PREFIX + SVG_ICONS[entry.icon] + "</svg>";
                        } else {
                            iconNode.textContent = entry.icon;
                        }
                        chip.appendChild(iconNode);
                    }

                    if (showLabel && entry.label) {
                        var labelNode = document.createElement("span");
                        labelNode.className = "label";
                        labelNode.textContent = entry.label;
                        chip.appendChild(labelNode);
                    }

                    if (showValue) {
                        var valueNode = document.createElement("span");
                        valueNode.className = "value";
                        valueNode.textContent = entry.value;
                        chip.appendChild(valueNode);
                    }

                    if (typeof entry.progress === "number") {
                        var track = document.createElement("span");
                        track.className = "stat-progress";
                        var fill = document.createElement("span");
                        fill.style.width = (entry.progress * 100) + "%";
                        track.appendChild(fill);
                        chip.appendChild(track);
                        chip.className += " has-progress";
                        if (entry.progress >= 1) chip.className += " is-complete";
                    }

                    barNode.appendChild(chip);
                }
            }

            // source: "feed" = the dock bridge, "socketFeed" = the &server2 socket, "metaLabel" = the meta bridge,
            // "local" = a direct postMessage. Anything else (the &server command socket, relay controls) never counts.
            function processPayload(data, source) {
                if (!data || typeof data !== "object") return;
                if (data.content && typeof data.content === "object") {
                    data = data.content;
                }
                if (!SSNOverlayControl.accept(data, "meta")) return;

                if (statsActive) {
                    if (handleStatsControl(data)) return;
                    // Count support from the dock feed only, respecting the host's existing filters.
                    // The meta bridge supplies channel totals, not an alternate support feed.
                    var fullFeed = source === "feed" || source === "socketFeed" || source === "local";
                    var channelTotal = data.event === "subscriber_update" || data.event === "follower_update";
                    var countable = fullFeed || (source === "metaLabel" && channelTotal);
                    if (countable && trackStats(data, fullFeed)) {
                        syncStatEntries();
                        render();
                    }
                }
                if (source === "feed") return;

                var normalizedEventName = normalizeEventName(data.event || data.type || "");
                if (!normalizedEventName || typeof data.meta === "undefined" || data.meta === null) return;
                if (!eventIsEnabled(normalizedEventName)) return;

                var meta = data.meta;
                var category = getEventCategory(normalizedEventName);

                if (normalizedEventName === "hype_train" && isPlainObject(meta)) {
                    updateHypeTrain(meta);
                } else if (normalizedEventName === "auction_update" && isPlainObject(meta)) {
                    updateAuctionEntries(meta);
                } else if (normalizedEventName === "commerce_update" && isPlainObject(meta)) {
                    updateCommerceEntries(meta);
                } else if (normalizedEventName === "viewer_update") {
                    var platformName = (data.type || data.platform || "").toString().toLowerCase();
                    var singleCount = parseNumber(meta);
                    if (platformName && singleCount !== null) {
                        viewerCounts[platformName] = singleCount;
                        syncViewerEntries(false);
                    }
                } else if (normalizedEventName === "viewer_updates" && isPlainObject(meta)) {
                    viewerCounts = Object.create(null);
                    Object.keys(meta).forEach(function (platform) {
                        var numeric = parseNumber(meta[platform]);
                        if (numeric !== null) {
                            viewerCounts[platform] = numeric;
                        }
                    });
                    syncViewerEntries(true);
                } else if (category === "othermeta") {
                    updateGenericMetaEntries(normalizedEventName, meta);
                }

                render();
            }

            function processIncomingData(raw, source) {
                if (!raw || typeof raw !== "object") return;
                if (raw.dataReceived && raw.dataReceived.overlayNinja) {
                    processPayload(raw.dataReceived.overlayNinja, source);
                    return;
                }
                if (raw.overlayNinja) {
                    processPayload(raw.overlayNinja, source);
                    return;
                }
                processPayload(raw, source);
            }

            function connectIframe() {
                var sessionId = urlParams.get("session");
                // Transport migration: meta uses one receive path. Server modes connect by socket, so skip the VDO bridge to avoid duplicate feed events.
                if (!sessionId || hasServerMode) return;

                var password = encodeURIComponent(urlParams.get("password") || "false");
                var lanonly = urlParams.has("lanonly") ? "&lanonly" : "";
                iframe = document.createElement("iframe");
                iframe.src = "https://vdo.socialstream.ninja/?ln&salt=vdo.ninja&notmobile&password=" + encodeURIComponent(password) + lanonly + "&solo&view=" + encodeURIComponent(sessionId) + "&novideo&noaudio&label=meta&cleanoutput&room=" + encodeURIComponent(sessionId);
                iframe.style.width = "0px";
                iframe.style.height = "0px";
                iframe.style.position = "fixed";
                iframe.style.left = "-100px";
                iframe.style.top = "-100px";
                iframe.setAttribute("aria-hidden", "true");
                document.body.appendChild(iframe);
            }

            // Stats need the whole feed. &server2 and &server3 carry it by socket; otherwise it comes over a dock bridge.
            function connectFeedIframe() {
                var sessionId = urlParams.get("session");
                if (!sessionId || urlParams.has("server2") || urlParams.has("server3")) return;
                var password = encodeURIComponent(urlParams.get("password") || "false");
                var lanonly = urlParams.has("lanonly") ? "&lanonly" : "";
                feedIframe = document.createElement("iframe");
                feedIframe.src = "https://vdo.socialstream.ninja/?ln&salt=vdo.ninja&notmobile&password=" + password + lanonly + "&solo&view=" + encodeURIComponent(sessionId) + "&novideo&noaudio&label=dock&cleanoutput&room=" + encodeURIComponent(sessionId);
                feedIframe.style.cssText = "width:0;height:0;position:fixed;left:-100px;top:-100px;";
                feedIframe.setAttribute("aria-hidden", "true");
                document.body.appendChild(feedIframe);
            }

            function connectSocket(serverURL, roomId, outChannel, inChannel, source) {
                if (!serverURL || !roomId) return;

                var connection = {
                    socket: null,
                    attempts: 1,
                    timer: null,
                    closed: false
                };
                sockets.push(connection);

                function scheduleReconnect() {
                    if (connection.closed) return;
                    var delay = Math.min(12000, 200 * connection.attempts);
                    if (connection.timer) {
                        clearTimeout(connection.timer);
                    }
                    connection.timer = setTimeout(function () {
                        connection.attempts += 1;
                        connectNow();
                    }, delay);
                }

                function connectNow() {
                    if (connection.closed) return;
                    try {
                        connection.socket = new WebSocket(serverURL);
                    } catch (e) {
                        scheduleReconnect();
                        return;
                    }

                    connection.socket.onopen = function () {
                        connection.attempts = 1;
                        try {
                            connection.socket.send(JSON.stringify({
                                join: roomId,
                                out: outChannel,
                                in: inChannel
                            }));
                        } catch (e) {}
                    };

                    connection.socket.onmessage = function (event) {
                        if (!event || !event.data) return;
                        try {
                            var parsed = JSON.parse(event.data);
                            processIncomingData(parsed, source);
                            if (parsed && parsed.get) {
                                connection.socket.send(JSON.stringify({
                                    callback: {
                                        get: parsed.get,
                                        result: true
                                    }
                                }));
                            }
                        } catch (e) {}
                    };

                    connection.socket.onerror = function () {
                        try {
                            connection.socket.close();
                        } catch (e) {}
                    };

                    connection.socket.onclose = function () {
                        scheduleReconnect();
                    };
                }

                connectNow();
            }

            function connectServerModes() {
                var roomId = (urlParams.get("session") || "").split(",")[0];
                if (!roomId) return;

                if (urlParams.has("server")) {
                    var apiServerURL = urlParams.get("server") || (urlParams.has("localserver") ? SocialStreamLocalServer.getWebSocketUrl() : "wss://io.socialstream.ninja/api");
                    connectSocket(apiServerURL, roomId, 2, 1, "commands");
                }

                if (urlParams.has("server2") || urlParams.has("server3")) {
                    var extensionServerURL = urlParams.has("server2")
                        ? (SocialStreamLocalServer.getRelayUrl(urlParams, "server2", "wss://io.socialstream.ninja/extension"))
                        : (SocialStreamLocalServer.getRelayUrl(urlParams, "server3", "wss://io.socialstream.ninja/extension"));
                    connectSocket(extensionServerURL, roomId, 3, 4, "socketFeed");
                }
            }

            window.addEventListener("message", function (event) {
                var payload = null;
                var source = "local";

                if (event && event.data && event.data.dataReceived && event.data.dataReceived.overlayNinja) {
                    if (feedIframe && event.source === feedIframe.contentWindow) {
                        processIncomingData(event.data.dataReceived.overlayNinja, "feed");
                        return;
                    }
                    if (iframe && event.source !== iframe.contentWindow) {
                        return;
                    }
                    payload = event.data.dataReceived.overlayNinja;
                    source = "metaLabel";
                } else if (event && event.data && event.data.overlayNinja) {
                    payload = event.data.overlayNinja;
                }

                if (payload) {
                    processIncomingData(payload, source);
                }
            });

            window.addEventListener("beforeunload", function () {
                sockets.forEach(function (connection) {
                    if (connection.timer) {
                        clearTimeout(connection.timer);
                    }
                    connection.closed = true;
                    if (connection.socket) {
                        try {
                            connection.socket.onclose = null;
                            connection.socket.close();
                        } catch (e) {}
                    }
                });
            });

            if (statsActive) {
                document.body.classList.add("has-stats");
                startStats();
            }
            render();
            if (!statsDemo) {
                connectServerModes();
                connectIframe();
                if (statsActive) connectFeedIframe();
            }
        })();
    </script>
</body>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="title">
  <title id="title">Thank you for supporting the stream</title>
  <style>.star{transform-origin:center;animation:pulse 1.5s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.08)}}@media(prefers-reduced-motion:reduce){.star{animation:none}}</style>
  <rect x="12" y="12" width="456" height="276" rx="40" fill="#18233b" stroke="#43ecb0" stroke-width="5"/>
  <g fill="#ffd35a" class="star"><path d="m240 42 14 29 32 5-23 22 6 32-29-15-29 15 6-32-23-22 32-5z"/></g>
  <g fill="#43ecb0"><circle cx="76" cy="75" r="9"/><circle cx="402" cy="205" r="9"/><path d="m385 63 15 8-15 8zM60 210l20-8v16z"/></g>
  <text x="240" y="190" fill="white" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="46">Thank you!</text>
  <text x="240" y="232" fill="#bdebdc" text-anchor="middle" font-family="Arial,sans-serif" font-size="22">You make this stream possible</text>
</svg>

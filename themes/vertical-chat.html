<!DOCTYPE html>
<!--
Social Stream Ninja - "Vertical Chat" overlay.
Portrait (9:16) chat for TikTok, YouTube Shorts, Instagram Reels and vertical OBS canvases.
Designed for a 1080x1920 browser source; text sizes follow the source width, so smaller
sources (540x960 etc.) scale down evenly. Large high-contrast cards, newest at the bottom,
older ones push upward and fade out near the top of the chat area.

SAFE ZONES (on by default) keep chat clear of the platform UI: the top bar, the right-side
action rail (like/comment/share) and the bottom caption/description area. Values are a
percentage of the canvas height (top/bottom) or width (left/right).

DATA: arrives via a hidden VDO.Ninja iframe (WebRTC) at event.data.dataReceived.overlayNinja,
or via WebSocket when &server / &server2 is set. Payload fields: chatname, chatmessage,
chatimg, type, nameColor, chatbadges, membership, subtitle, hasDonation, contentimg, event,
textonly... Meta-only events (viewer counts and similar) are skipped.

URL PARAMETERS:
  session=ID        (required) your Social Stream session id
  password=PASS     optional room password (default false)
  showtime=MS       auto-hide messages after MS ms; 0 = never hide (default 0)
  limit=N           max messages kept on screen (default 20)
  align=left|right  which side the cards hug (default left; right sits beside the action rail)
  safe=0            turn the safe zones off (chat uses the full canvas with small margins)
  safetop=PCT       top safe zone, % of canvas height (default 10)
  safebottom=PCT    bottom safe zone, % of canvas height (default 22)
  safeleft=PCT      left safe zone, % of canvas width (default 4)
  saferight=PCT     right safe zone (action rail), % of canvas width (default 15)
  height=PCT        chat area height, % of canvas height (default 50; 100 = everything between the safe zones)
  width=PX          cap the chat column to a fixed px width
  style=NAME        matching collection: cute, cozy, cats, music, arcade, slate, paper, micro, spring, summer, hearts, lunar
  light             light cards instead of dark
  scale=N           size multiplier for the whole chat (e.g. scale=1.25)
  font=PX           base font size in px (default follows the canvas width)
  fontfamily=NAME   chat font family; loads matching Google Font (e.g. fontfamily=Roboto)
  css=URL|CSS       extra stylesheet URL or inline CSS
  b64css=BASE64     extra CSS, base64 encoded (also base64css, cssbase64, cssb64)
  chroma=HEX        solid background colour for chroma keying (e.g. chroma=00FF00)
  fadezone=PX       height of the soft fade at the top of the chat area; 0 = hard edge
  hidebots          hide messages flagged as bots (dock still shows them)
  noavatar          hide avatars
  nobadges          hide platform badges
  stripmemberships  hide membership labels (subscriber/sponsorship)
  noicon            hide the small source platform icon
  time              show a clock timestamp per message
  server / server2  connect via WebSocket instead of (or in addition to) WebRTC
  localserver       use ws://127.0.0.1:3000 (override with localserverport=PORT)
  deleteonlylast    delete commands only remove the most recent match

Keep this file Chrome-80 friendly: no <script type="module">, no top-level import/export,
no flexbox gap.
-->

}
body {

    font-size: 3.4vw;

}

    --member-text: #8a5a00;
    --dono-card-bg: #e3f7ec;
}

#chat-container {
    position: absolute;
    /* Side padding gives card shadows room; the offsets keep card edges on the safe lines. */
    left: calc(var(--safe-left) - 0.5em);
    bottom: var(--safe-bottom);
    width: calc(100vw - var(--safe-left) - var(--safe-right) + 1em);
    height: var(--chat-height);
    max-height: calc(100vh - var(--safe-top) - var(--safe-bottom));

/* Matching collections (themes/collections.css): rescale their px spacing for the larger

}

<script>
    var urlParams = new URLSearchParams(window.location.search);
    var collectionStyle = urlParams.get('style');
    var collectionActive = ['cute', 'cozy', 'cats', 'music', 'arcade', 'slate', 'paper', 'micro', 'spring', 'summer', 'hearts', 'lunar'].indexOf(collectionStyle) !== -1;
    if (collectionActive) {
        document.body.classList.add('collection', 'collection-chat', 'style-' + collectionStyle);
    }
    var SERVER_EXCLUSIVE_TRANSPORT_VERSION = "3.52.0";
    // Transport migration guard: only pages with full server parity may skip the legacy bridge.
    var TRANSPORT_CAPABILITIES = {
        serverFeed: true,
        serverTargeted: false,
        upstreamCommands: false,
        customChannel: false,
        legacyBridgeRequired: false,
        exclusiveServerParams: { server: false, server2: true, server3: false }
    };
    function versionAtLeast(value, minimum) {
        var a = String(value || "").split(".");
        var b = String(minimum || "").split(".");
        var len = Math.max(a.length, b.length);
        for (var i = 0; i < len; i++) {
            var av = parseInt(a[i], 10) || 0;
            var bv = parseInt(b[i], 10) || 0;
            if (av > bv) return true;
            if (av < bv) return false;
        }
        return true;
    }
    // Only feed-carrying server params listed by this page may disable the bridge; server3 alone is command-only.
    function hasExclusiveServerTransport(caps) {
        var params = caps && typeof caps.exclusiveServerParams === "object" ? caps.exclusiveServerParams : { server2: true };

            (params.server2 !== false && urlParams.has("server2")) ||
            (params.server3 === true && urlParams.has("server2") && urlParams.has("server3"));
    }
    function useServerOnlyTransport() {
        var caps = (typeof TRANSPORT_CAPABILITIES === "object" && TRANSPORT_CAPABILITIES) ? TRANSPORT_CAPABILITIES : {};
        return hasExclusiveServerTransport(caps) &&
            versionAtLeast(urlParams.get("v"), SERVER_EXCLUSIVE_TRANSPORT_VERSION) &&
            caps.serverFeed === true &&
            caps.legacyBridgeRequired !== true &&
            caps.upstreamCommands !== true &&
            caps.customChannel !== true;
    }
    var roomID = urlParams.has("session") ? urlParams.get("session") : "iWWnKL28tQ";
    var password = urlParams.has("password") ? urlParams.get("password") : "false";
    var featuredMode = false;
    var deleteOnlyLast = urlParams.has("deleteonlylast");
    var hideAvatar = urlParams.has("noavatar");
    var hideBadges = urlParams.has("nobadges");
    var stripMemberships = urlParams.has("stripmemberships");
    var hideIcon = urlParams.has("noicon");
    var showClock = urlParams.has("time");
    var hideBots = urlParams.has("hidebots");
    var lightCards = urlParams.has("light");

    if (lightCards) { document.body.classList.add("light"); }
    if (urlParams.has("chroma")) {
        var c = urlParams.get("chroma") || "";
        document.body.style.backgroundColor = c.charAt(0) === "#" ? c : "#" + c;
    }

    var safeValue = (urlParams.get("safe") || "").toLowerCase();
    if (urlParams.has("safe") && ["0", "false", "off", "no", "none"].indexOf(safeValue) !== -1) {
        document.body.classList.add("safe-off");
    }
    function readPercentParam(name, max) {
        if (!urlParams.has(name)) { return null; }
        var value = parseFloat(urlParams.get(name));
        if (isNaN(value) || value < 0) { return null; }
        return Math.min(value, max);
    }
    [["safetop", "--safe-top", "vh"], ["safebottom", "--safe-bottom", "vh"],
        ["safeleft", "--safe-left", "vw"], ["saferight", "--safe-right", "vw"]].forEach(function (zone) {
        var value = readPercentParam(zone[0], 45);
        if (value !== null) { document.body.style.setProperty(zone[1], value + zone[2]); }
    });
    var chatHeight = readPercentParam("height", 100);
    if (chatHeight !== null && chatHeight >= 5) {
        document.body.style.setProperty("--chat-height", chatHeight + "vh");
    }

    var scale = 1;
    if (urlParams.has("scale")) {
        scale = parseFloat(urlParams.get("scale"));
        if (isNaN(scale) || scale <= 0) { scale = 1; }
        document.documentElement.style.setProperty("--vc-scale", scale);
    }
    if (urlParams.has("font")) {
        var fs = parseInt(urlParams.get("font"), 10);
        if (!isNaN(fs) && fs > 0) {
            document.body.style.fontSize = (fs * scale) + "px";
        }
    }
    if (urlParams.has("fontfamily")) {
        var ff = (urlParams.get("fontfamily") || "").trim();
        if (ff) {
            var safeFamily = ff.replace(/['"\\;{}<>]/g, "");
            var gf = document.createElement("link");
            gf.rel = "stylesheet";
            gf.href = "https://fonts.googleapis.com/css2?family=" +
                encodeURIComponent(safeFamily).replace(/%20/g, "+") + ":wght@400;500;600;700&display=swap";
            document.head.appendChild(gf);
            document.body.style.fontFamily = "'" + safeFamily +
                "', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif";
        }

    if (urlParams.has("css")) {
        var cssURL = urlParams.get("css");
        try {
            cssURL = decodeURI(cssURL);
        } catch (e) {}
        var cssStylesheet;
        if (cssURL.startsWith("http")) {
            cssStylesheet = document.createElement("link");
            cssStylesheet.rel = "stylesheet";
            cssStylesheet.type = "text/css";
            cssStylesheet.media = "screen";
            cssStylesheet.href = cssURL;
        } else {
            cssStylesheet = document.createElement("style");
            cssStylesheet.innerHTML = cssURL;
        }
        document.getElementsByTagName("head")[0].appendChild(cssStylesheet);
    }
    if (urlParams.has("base64css") || urlParams.has("b64css") || urlParams.has("cssbase64") || urlParams.has("cssb64")) {
        try {
            var base64Css = urlParams.get("base64css") || urlParams.get("b64css") || urlParams.get("cssbase64") || urlParams.get("cssb64");
            try {
                base64Css = atob(base64Css);
            } catch (e) {}
            try {
                base64Css = decodeURIComponent(base64Css);
            } catch (e) {}
            var cssStyleSheet = document.createElement("style");
            cssStyleSheet.innerText = base64Css;
            document.querySelector("head").appendChild(cssStyleSheet);
        } catch (e) {
            console.error(e);
        }
    }

    const chatContainer = document.getElementById('chat-container');
    const messageListWrapper = document.getElementById('message-list-wrapper');
    const topSpacer = document.getElementById('spacer');
    // The spacer must stay taller than the chat area so the stack stays bottom-anchored.
    const initialSpacerHeight = Math.max(2200, Math.ceil((window.innerHeight || 0) * 1.2)) + 'px';
    topSpacer.style.height = initialSpacerHeight;

    if (urlParams.has("width")) {
        var w = parseInt(urlParams.get("width"), 10);
        if (!isNaN(w) && w > 0) { chatContainer.style.maxWidth = "calc(" + w + "px + 1em)"; }
    }
    if ((urlParams.get("align") || "").toLowerCase() === "right") {
        chatContainer.classList.add("align-right");
    }
    if (urlParams.has("fadezone")) {
        var fadePx = parseInt(urlParams.get("fadezone"), 10);
        if (!isNaN(fadePx) && fadePx >= 0) {
            if (fadePx === 0) { chatContainer.classList.add("no-fade"); }
            else { chatContainer.style.setProperty("--fade", fadePx + "px"); }
        }
    }

    const MAX_MESSAGES = (function () {
        var parsed = urlParams.has("limit") ? parseInt(urlParams.get("limit"), 10) : NaN;
        return !isNaN(parsed) && parsed > 0 ? parsed : 20;
    })();
    const showtime = urlParams.has("showtime") ? parseInt(urlParams.get("showtime")) : 0;
    var overlayMessageCounter = 0;
    var localBlockUserList = {};
    var timedOutUsers = {};
    const messageTimestamps = new Map();
    const MAX_SPACER_HEIGHT_BEFORE_RESET = 18000000;

    function escapeHtml(str) {
        return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    function escapeAttr(str) {
        return typeof fallbackEscapeHtml === "function" ? fallbackEscapeHtml(str) : escapeHtml(str).replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
    function nowClock() {
        var d = new Date();
        var h = d.getHours();
        var m = d.getMinutes();
        return (h < 10 ? "0" + h : h) + ":" + (m < 10 ? "0" + m : m);
    }

    function adjustMessageWrapperScroll() {
        requestAnimationFrame(function () {
            const wrapperScrollHeight = messageListWrapper.scrollHeight;
            const containerClientHeight = chatContainer.clientHeight;
            let translateY = 0;
            if (wrapperScrollHeight > containerClientHeight) {
                translateY = -(wrapperScrollHeight - containerClientHeight);
            }
            translateY = Math.min(0, translateY);
            messageListWrapper.style.transform = 'translateY(' + translateY + 'px)';
        });
    }

    function getOverlayMessages() {
        return Array.from(messageListWrapper.children).filter(function (child) {
            return child.id !== 'spacer' && child.classList.contains('message');
        });
    }

    function getPayloadMessageId(data) {
        var keys = ['mid', 'id', 'messageId', 'message_id'];
        for (var i = 0; i < keys.length; i++) {
            if (data[keys[i]] !== undefined && data[keys[i]] !== null && data[keys[i]] !== "") {
                return String(data[keys[i]]);
            }
        }
        if (data.meta) {
            if (data.meta.messageId) { return String(data.meta.messageId); }
            if (data.meta.message_id) { return String(data.meta.message_id); }
        }
        overlayMessageCounter += 1;
        return 'msg-' + Date.now() + '-' + overlayMessageCounter;
    }

    function removeOverlayMessage(message) {
        if (!message) { return; }
        messageTimestamps.delete(message.id);
        if (message.parentNode) { message.parentNode.removeChild(message); }
    }

    // Removing the oldest (top) card hands its height to the spacer, so the rest of the
    // stack stays put instead of jumping.
    function retireOldestMessage(message) {
        if (!message || !message.parentNode) { return; }
        const style = getComputedStyle(message);
        const space = message.offsetHeight + (parseFloat(style.marginBottom) || 0);
        var newHeight = (parseFloat(topSpacer.style.height) || 0) + space;
        if (newHeight > MAX_SPACER_HEIGHT_BEFORE_RESET) {
            newHeight = parseFloat(initialSpacerHeight);
            messageListWrapper.style.transition = 'none';
            setTimeout(function () { messageListWrapper.style.transition = ''; }, 50);
        }
        topSpacer.style.height = newHeight + 'px';
        removeOverlayMessage(message);
    }

    function getNewestMessage(messages) {
        return messages.reduce(function (newest, message) {
            return (messageTimestamps.get(newest.id) || 0) > (messageTimestamps.get(message.id) || 0) ? newest : message;
        });
    }

    function removeMatchingMessages(matches, onlyLast) {
        const messages = getOverlayMessages().filter(matches);
        if (!messages.length) { return false; }
        if (onlyLast) { removeOverlayMessage(getNewestMessage(messages)); }
        else { messages.forEach(removeOverlayMessage); }
        adjustMessageWrapperScroll();
        return true;
    }

    function deleteMessageById(id) {
        if (id === undefined || id === null || id === "") { return false; }
        const idString = String(id);
        return removeMatchingMessages(function (message) {
            return message.dataset.mid === idString || message.id === idString;
        }, true);
    }

    function deleteMessages(data, onlyLast) {
        if (!data.delete || typeof data.delete !== "object") { return false; }
        const d = data.delete;
        const nativeId = d.meta && d.meta.messageId;
        return removeMatchingMessages(function (message) {
            if (d.type && message.dataset.sourceType !== String(d.type)) { return false; }
            if (nativeId !== undefined && nativeId !== null && nativeId !== "") {
                return message.dataset.nativeMessageId === String(nativeId);
            }
            if (d.id !== undefined && d.id !== null && d.id !== "") {
                const idString = String(d.id);
                return message.dataset.mid === idString || message.id === idString;
            }
            if (d.userid !== undefined && d.userid !== null && d.userid !== "") {
                return message.dataset.userid === String(d.userid);
            }
            if (d.chatname && message.dataset.chatname !== String(d.chatname)) { return false; }
            return !!(d.chatname || d.type);
        }, onlyLast || d.onlyLast);
    }

    function removeUserMessages(username, type) {
        if (!username) { return false; }
        username = String(username);
        type = type ? String(type) : "";
        return removeMatchingMessages(function (message) {
            if (message.dataset.chatname !== username) { return false; }
            if (!type) { return true; }
            return message.dataset.sourceType === type || (type === "youtube" && message.dataset.sourceType === "youtubeshorts");
        }, false);
    }

    function addLocalBlock(username, type) {
        if (!username) { return; }
        username = String(username);
        const types = type ? [String(type)] : ["*"];
        if (type === "youtube") { types.push("youtubeshorts"); }
        if (!localBlockUserList[username]) { localBlockUserList[username] = []; }
        types.forEach(function (t) {
            if (!localBlockUserList[username].includes(t)) { localBlockUserList[username].push(t); }
        });
        setTimeout(function () {
            if (!localBlockUserList[username]) { return; }
            types.forEach(function (t) {
                const idx = localBlockUserList[username].indexOf(t);
                if (idx !== -1) { localBlockUserList[username].splice(idx, 1); }
            });
            if (!localBlockUserList[username].length) { delete localBlockUserList[username]; }
        }, 10000);
    }

    function isMessageBlocked(data) {
        if (hideBots && data.bot) { return true; }
        if (!data.chatname) { return false; }
        const chatname = String(data.chatname);
        const type = data.type ? String(data.type) : "";
        if (localBlockUserList[chatname] && (localBlockUserList[chatname].includes(type) || localBlockUserList[chatname].includes("*"))) {
            return true;
        }
        if (type && timedOutUsers[chatname + ":" + type]) {
            if (timedOutUsers[chatname + ":" + type] < Date.now()) { delete timedOutUsers[chatname + ":" + type]; }
            else { return true; }
        }
        return false;
    }

    function clearAllMessages() {
        getOverlayMessages().forEach(removeOverlayMessage);
        topSpacer.style.height = initialSpacerHeight;
        messageListWrapper.style.transform = '';
        adjustMessageWrapperScroll();
    }

    function handleControlPayload(data) {
        if (!data || typeof data !== "object") { return false; }
        if ("deleteMessage" in data) { deleteMessageById(data.deleteMessage); return true; }
        if ("clearAll" in data || data.action === "clear" || data.action === "clearAll") { clearAllMessages(); return true; }
        if ("delete" in data) { deleteMessages(data, deleteOnlyLast); return true; }
        if ("timeoutUser" in data && data.timeoutUser) {
            const name = data.timeoutUser.username || data.timeoutUser.chatname;
            if (name && data.timeoutUser.type && data.timeoutUser.duration) {
                timedOutUsers[String(name) + ":" + String(data.timeoutUser.type)] = Date.now() + (Number(data.timeoutUser.duration) * 1000);
            }
            removeUserMessages(name, data.timeoutUser.type);
            return true;
        }
        if ("blockUser" in data && data.blockUser) {
            const name = data.blockUser.chatname || data.blockUser.username;
            addLocalBlock(name, data.blockUser.type);
            removeUserMessages(name, data.blockUser.type);
            return true;
        }
        return false;
    }

    setInterval(function () {
        if (!(showtime > 0)) { return; }
        const now = Date.now();
        getOverlayMessages().forEach(function (message) {
            const ts = messageTimestamps.get(message.id);
            if (ts && (now - ts) > showtime && !message.classList.contains('fading')) {
                message.classList.add('fading');
                setTimeout(function () {
                    if (getOverlayMessages()[0] === message) { retireOldestMessage(message); }
                    else { removeOverlayMessage(message); }
                    adjustMessageWrapperScroll();
                }, 1000);
            }
        });
    }, 1000);

    function buildBadges(data) {
        return hideBadges ? "" : SocialStreamBadges.render(data.chatbadges);
    }

    // Dark cards brighten source colours a little; light cards and collections keep theirs.
    function pickNameColor(data) {
        if (collectionActive) { return ""; }
        var color = (data.nameColor && typeof sanitizeRelayCssColor === "function") ? sanitizeRelayCssColor(data.nameColor) : "";
        if (!color && !lightCards && data.type && typeof getColorFromType === "function") {
            try { color = getColorFromType(data.type) || ""; } catch (e) { color = ""; }
        }
        if (color && !lightCards && /^#[0-9a-f]{6}$/i.test(color) && typeof adjustColorForOverlay === "function") {
            try { color = adjustColorForOverlay(color); } catch (e) {}
        }
        return color;
    }

    // Cross-transport dedupe: in server mode the same feed message can arrive over both
    // the websocket relay and the VDO.Ninja bridge; render only the first copy.
    var CROSS_TRANSPORT_DEDUPE_TTL_MS = 12000;
    var recentTransportDeliveries = new Map();
    var transportDeliveryDedupe = typeof SocialStreamTransportDedupe !== "undefined" ? SocialStreamTransportDedupe.create() : null;
    function isDuplicateTransportDelivery(data, source) {
        if (!(urlParams.has("server") || urlParams.has("server2") || urlParams.has("server3"))) {
            return false;
        }
        if (transportDeliveryDedupe) return transportDeliveryDedupe(data, source);
        if (!data || typeof data !== "object") {
            return false;
        }
        if (data.id === undefined || data.id === null) {
            return false;
        }
        if ("action" in data || "get" in data || "callback" in data || "mid" in data) {
            return false;
        }
        if (!(data.chatname || data.chatmessage || data.chatimg || data.hasDonation || data.membership || data.event || data.contentimg)) {
            return false;
        }
        var key =
            String(data.id) +
            "|" + (data.type || "") +
            "|" + (data.chatname || "") +
            "|" + String(data.chatmessage || "").slice(0, 100) +
            "|" + (data.hasDonation || "") +
            "|" + (data.event || "");
        var now = Date.now();
        recentTransportDeliveries.forEach(function (seenAt, seenKey) {
            if (now - seenAt > CROSS_TRANSPORT_DEDUPE_TTL_MS) {
                recentTransportDeliveries.delete(seenKey);
            }
        });
        if (recentTransportDeliveries.has(key)) {
            return true;
        }
        recentTransportDeliveries.set(key, now);
        return false;
    }
    function addMessageToOverlay(data, source) {
        if (isDuplicateTransportDelivery(data, source)) {
            return;
        }
        if (handleControlPayload(data)) { return; }
        if (!data || typeof data !== "object") { return; }
        if (isMessageBlocked(data)) { return; }
        if (!data.chatname && !data.chatmessage && !data.hasDonation && !data.donation && !data.contentimg) { return; }
        if (!data.chatname && data.meta && !data.chatmessage && !data.contentimg && !data.hasDonation && !data.donation) { return; }

        const messageDiv = document.createElement('div');
        messageDiv.classList.add('message');
        const messageId = getPayloadMessageId(data);
        messageDiv.id = messageId;
        messageDiv.dataset.mid = messageId;
        if (data.meta && data.meta.messageId !== undefined && data.meta.messageId !== null && data.meta.messageId !== "") {
            messageDiv.dataset.nativeMessageId = String(data.meta.messageId);
        }
        if (data.userid !== undefined && data.userid !== null && data.userid !== "") {
            messageDiv.dataset.userid = String(data.userid);
        }
        if (data.chatname) { messageDiv.dataset.chatname = data.chatname; }
        if (data.type) { messageDiv.dataset.sourceType = data.type; }
        messageTimestamps.set(messageId, Date.now());

        var sourceType = data.type ? String(data.type).replace(/[^a-zA-Z0-9_-]/g, "") : "";
        var nameColor = pickNameColor(data);
        var donation = data.hasDonation || data.donation || "";
        if (donation) { messageDiv.classList.add('is-donation'); }
        if (data.event) { messageDiv.classList.add('is-event'); }
        if (data.membership) { messageDiv.classList.add('is-member'); }

        var avatarHtml = (!hideAvatar && data.chatimg)
            ? "<span class='avatar' style=\"background-image:url('" + escapeCssUrlAttribute(data.chatimg) + "')\"></span>" : "";
        if (!avatarHtml) { messageDiv.classList.add('no-avatar'); }
        var iconHtml = (!hideIcon && sourceType)
            ? "<img class='source-icon' src='https://socialstream.ninja/sources/images/" + sourceType + ".png' alt='" + sourceType + "' onerror=\"this.style.display='none'\">" : "";
        var badgesHtml = buildBadges(data);
        var clockHtml = showClock ? "<span class='timestamp'>" + nowClock() + "</span>" : "";
        var nameHtml = data.chatname
            ? "<span class='name'" + (nameColor ? " style='color:" + escapeAttr(nameColor) + "'" : "") + ">" + escapeHtml(data.chatname) + "</span>" : "";
        var headHtml = (nameHtml || iconHtml || badgesHtml || clockHtml) ? "<div class='head'>" + nameHtml + iconHtml + badgesHtml + clockHtml + "</div>" : "";
        var membershipHtml = (!stripMemberships && data.membership) ? "<span class='membership'>" + escapeHtml(data.membership) + "</span>" : "";
        var subtitleHtml = data.subtitle ? "<span class='subtitle'>" + escapeHtml(data.subtitle) + "</span>" : "";
        var tagsHtml = (membershipHtml || subtitleHtml) ? "<div class='tags'>" + membershipHtml + subtitleHtml + "</div>" : "";
        // textonly=true means literal chatmessage: use textContent or one HTML-template escape, never HTML decoding/filtering. HTML mode checks a display copy before rendering.
        var msg = data.chatmessage ? (data.textonly ? escapeHtml(data.chatmessage) : (window.SocialStreamChatHTML ? SocialStreamChatHTML.sanitize(data.chatmessage) : fallbackEscapeHtml(data.chatmessage))) : "";
        var textHtml = msg ? "<div class='text" + (data.event ? " event-text" : "") + "'>" + msg + "</div>" : "";
        var donationHtml = donation ? "<div class='donation'>" + escapeHtml(donation) + "</div>" : "";
        var contentSrc = data.contentimg ? (typeof sanitizeRelayUrl === "function" ? sanitizeRelayUrl(data.contentimg, true) : String(data.contentimg)) : "";
        var contentImgHtml = contentSrc
            ? "<img class='content-img' src='" + escapeAttr(contentSrc) + "' alt='' onerror=\"this.style.display='none'\">" : "";

        messageDiv.innerHTML =
            avatarHtml +
            "<div class='body'>" +
                headHtml + tagsHtml + donationHtml + textHtml + contentImgHtml +
            "</div>";

        messageListWrapper.appendChild(messageDiv);
        void messageDiv.offsetWidth;
        messageDiv.classList.add('visible');

        const messages = getOverlayMessages();
        if (messages.length > MAX_MESSAGES) {
            retireOldestMessage(messages[0]);
        }
        adjustMessageWrapperScroll();
    }

    // --- WebRTC bridge (hidden VDO.Ninja iframe) ---
    if (!useServerOnlyTransport()) {
        var iframe = document.createElement("iframe");
        if (featuredMode) {
            iframe.src = "https://vdo.socialstream.ninja/?ln&password=" + encodeURIComponent(password) + "&salt=vdo.ninja&label=overlay&exclude=" + roomID + "&scene&novideo&noaudio&cleanoutput&room=" + roomID;
        } else {
            iframe.src = "https://vdo.socialstream.ninja/?ln&salt=vdo.ninja&password=" + encodeURIComponent(password) + "&push&label=dock&vd=0&ad=0&novideo&noaudio&autostart&cleanoutput&room=" + roomID;
        }
        iframe.style.cssText = "width: 0px; height: 0px; position: fixed; left: -100px; top: -100px;";
        document.body.appendChild(iframe);
        window.addEventListener("message", function (e) {
            if (e.source != iframe.contentWindow) return;
            if (e.data && typeof e.data === "object" && e.data.dataReceived && typeof e.data.dataReceived === "object" && e.data.dataReceived.overlayNinja) {
                addMessageToOverlay(e.data.dataReceived.overlayNinja, "p2p");
            }
        });
    }

    // --- optional WebSocket ---
    var conCon = 1;
    var socketserver = false;
    var serverURL = urlParams.has("localserver") ? SocialStreamLocalServer.getWebSocketUrl() : "wss://io.socialstream.ninja";
    function setupSocket() {
        socketserver.onclose = function () {
            setTimeout(function () { conCon += 1; socketserver = new WebSocket(serverURL); setupSocket(); }, 100 * conCon);
        };
        socketserver.onopen = function () {
            conCon = 1;
            socketserver.send(JSON.stringify({ "join": roomID, "out": 3, "in": 4 }));
        };
        socketserver.addEventListener('message', function (event) {
            if (event.data) {
                try { var data = JSON.parse(event.data); if (data) { addMessageToOverlay(data, "server"); } }
                catch (err) { console.error("Error processing WebSocket message:", err); }
            }
        });
    }
    if (urlParams.has("server") || urlParams.has("server2")) {
        serverURL = urlParams.get("server") || urlParams.get("server2") || serverURL;
        socketserver = new WebSocket(serverURL);
        setupSocket();
    }
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<script type="text/javascript" src="../../js/local-server-url.js"></script>
<script type="text/javascript" src="../../js/transport-dedupe.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Overlay</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@300..800&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevent external scrollbars in OBS */
            background-color: rgba(10, 22, 40, 0);
            font-family: 'Host Grotesk', sans-serif;
        }

        #chat-container {
            padding: 25px;
            max-width: 350px;
            height: 100%;
            overflow-y: auto; /* Allow internal scrolling */
            scrollbar-width: none; /* Hide scrollbar for Firefox */
            -ms-overflow-style: none; /* Hide scrollbar for IE and Edge */
            margin: auto;
            scroll-behavior: smooth; /* Optional for smooth scrolling */
        }

        #chat-container::-webkit-scrollbar {
            display: none; /* Hide scrollbar for WebKit browsers */
        }
        
        /* Overlay size adjustments */
        .small-overlay #chat-container {
            transform: scale(0.6);
        }
        .large-overlay #chat-container {
            transform: scale(1.2);
        }

        .message-container {
            position: relative;
            margin-bottom: 5px;
        }

        .event-message {
            background: rgba(50, 50, 70, 1); /* Different background for events */
            padding: 10px;
            border-radius: 10px;
            color: #ffd700; /* Gold color for events */
            font-weight: bold;
            margin-bottom: 10px;
            opacity: 0;
            transform: translateY(20px);
            animation: slideFadeInEvent 0.6s ease forwards;
        }

        .username-box {
            display: inline-flex; /* Use inline-flex for consistent sizing */
            align-items: center; /* Vertically align username and badges */
            gap: 5px; /* Space between username and badges */
            position: absolute;
            top: -19px;
            left: 0px;
            padding: 8px 10px;
            color: #17191c;
            font-weight: 600;
            background: rgba(240, 240, 240, 1);
            z-index: 2;
            white-space: nowrap; /* Prevent wrapping */
            max-width: 300px; /* Ensure it does not overflow the container */
        }

        .badges, .badge {
            display: inline-flex; /* Ensure badges are laid out horizontally */
            align-items: center;
            gap: 5px; /* Space between badges */
        }

        .badge {
            height: 0.9em;
            width: auto; /* Auto width to maintain aspect ratio */
            vertical-align: middle;
            margin-top: -2px; /* Move each badge up slightly */
        }

        .source-icon {
            height: 1em;
            margin-right: 0px; /* Space between icon and username */
            vertical-align: middle;
        }

        .message {
            display: inline-block;
            max-width: 100%;
            background: rgba(23, 25, 28, 0.9);
            padding: 24px 8px 8px 8px;
            margin-top: 22px;
            margin-left: 15px;
            color: rgba(240, 240, 240, 1);
            opacity: 0;
            transform: translateX(-20px);
            animation: slideFadeIn 0.5s ease forwards;
            position: relative;
            word-wrap: break-word;
        }

        .text {
            font-size: clamp(0.85em, 2.5vw, 1em);
            line-height: 1.4;
        }
        
        @keyframes slideFadeIn {
            0% {
                opacity: 0;
                transform: translateX(-30px); /* Start further to the left */
            }
            100% {
                opacity: 1;
                transform: translateX(0); /* Slide to the original position */
            }
        }

        @keyframes slideFadeInEvent {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .text img,
        .text svg {
            max-width: 1.5em; /* Adjust size as needed */
            max-height: 1.5em;
            vertical-align: middle; /* Align emotes with text */
         }

        .message-container.fading {
            opacity: 0;
            transition: opacity 1.5s ease-out;
        }
        .badge.svg { overflow: hidden; }
        .badge.svg svg { display: block; width: auto !important; height: 100% !important; max-width: 100px !important; max-height: 100% !important; }

/* Keep content attachments separate from the smaller inline emotes. */
img.ssn-content-image {
    display: block;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 200px;
    object-fit: contain;
    border-radius: 8px;
    margin-top: 6px;
}
</style>
</head>
<body>
    <div id="chat-container"></div>
<script>
	const chatContainer = document.getElementById('chat-container');
	let lastSender = null;
	let lastMessageDiv = null;

	// Parameters for Social Stream Ninja
	const urlParams = new URLSearchParams(window.location.search);
	const SERVER_EXCLUSIVE_TRANSPORT_VERSION = "3.52.0";
	// Transport migration guard: only pages with full server parity may skip the legacy bridge.
	var TRANSPORT_CAPABILITIES = {
		serverFeed: true,
		serverTargeted: false,
		upstreamCommands: false,
		customChannel: false,
		legacyBridgeRequired: false,
		exclusiveServerParams: { server: false, server2: true, server3: false }
	};
	function versionAtLeast(value, minimum) {
		const a = String(value || "").split(".");
		const b = String(minimum || "").split(".");
		const len = Math.max(a.length, b.length);
		for (let i = 0; i < len; i++) {
			const av = parseInt(a[i], 10) || 0;
			const bv = parseInt(b[i], 10) || 0;
			if (av > bv) return true;
			if (av < bv) return false;
		}
		return true;
	}
	// Only feed-carrying server params listed by this page may disable the bridge; server3 alone is command-only.
	function hasExclusiveServerTransport(caps) {
		var params = caps && typeof caps.exclusiveServerParams === "object" ? caps.exclusiveServerParams : { server2: true };
		return (params.server === true && urlParams.has("server")) ||
			(params.server2 !== false && urlParams.has("server2")) ||
			(params.server3 === true && urlParams.has("server2") && urlParams.has("server3"));
	}
	function useServerOnlyTransport() {
		var caps = (typeof TRANSPORT_CAPABILITIES === "object" && TRANSPORT_CAPABILITIES) ? TRANSPORT_CAPABILITIES : {};
		return hasExclusiveServerTransport(caps) &&
			versionAtLeast(urlParams.get("v"), SERVER_EXCLUSIVE_TRANSPORT_VERSION) &&
			caps.serverFeed === true &&
			caps.legacyBridgeRequired !== true &&
			caps.upstreamCommands !== true &&
			caps.customChannel !== true;
	}
	const roomID = urlParams.get("session") || "7RUWtGBfz2";
	const password = urlParams.get("password") || urlParams.get("pass") || urlParams.get("pw") || "false";
	const featuredMode = false;

	// showtime: if set via URL, override default. Otherwise keep current default (0 = no auto-hiding)
	// Use showtime=30000 to auto-hide messages after 30 seconds
	var showtime = urlParams.has("showtime") ? parseInt(urlParams.get("showtime")) : 0;

	function escapeHtml(value) {
		return String(value == null ? '' : value)
			.replace(/&/g, '&amp;')
			.replace(/</g, '&lt;')
			.replace(/>/g, '&gt;')
			.replace(/"/g, '&quot;')
			.replace(/'/g, '&#039;');
	}

	// --- Common overlay tweaks (shared across themes) ---
	var hideBots = urlParams.has("hidebots");
	if (urlParams.has("chroma")) {
		var _c = urlParams.get("chroma") || "";
		document.body.style.backgroundColor = _c.charAt(0) === "#" ? _c : "#" + _c;
	}
	if (urlParams.has("font")) {
		var _fs = parseInt(urlParams.get("font"), 10);
		if (!isNaN(_fs) && _fs > 0) {
			document.documentElement.style.fontSize = _fs + "px";
			document.body.style.fontSize = _fs + "px";
		}
	}
	if (urlParams.has("fontfamily")) {
		var _ff = (urlParams.get("fontfamily") || "").trim();
		if (_ff) {
			var _safe = _ff.replace(/['"\\;{}<>]/g, "");
			var _gf = document.createElement("link");
			_gf.rel = "stylesheet";
			_gf.href = "https://fonts.googleapis.com/css2?family=" + encodeURIComponent(_safe).replace(/%20/g, "+") + ":wght@400;500;600;700&display=swap";
			document.head.appendChild(_gf);
			document.body.style.fontFamily = "'" + _safe + "', sans-serif";
		}
	}
	const messageTimestamps = new Map();

	// Function to apply overlay size based on URL parameter
	function applyOverlaySize() {
		const size = urlParams.get('size'); // Get the 'size' parameter
		document.body.classList.remove("small-overlay", "large-overlay"); // Reset any existing classes
		if (size === "small") {
			document.body.classList.add("small-overlay");
		} else if (size === "large") {
			document.body.classList.add("large-overlay");
		}
	}

	function isFullyVisible(element) {
		const containerRect = chatContainer.getBoundingClientRect();
		const elementRect = element.getBoundingClientRect();
		return elementRect.top >= containerRect.top && elementRect.bottom <= containerRect.bottom;
	}

	function removeCutOffMessages() {
		let firstMessage = chatContainer.firstElementChild;
		while (firstMessage && !isFullyVisible(firstMessage)) {
			chatContainer.removeChild(firstMessage);
			firstMessage = chatContainer.firstElementChild;
		}
	}

	function autoScroll() {
		const lastMessage = chatContainer.lastElementChild;
		if (lastMessage) {
			lastMessage.scrollIntoView({ behavior: "instant", block: "end" });
			setTimeout(() => {
				lastMessage.scrollIntoView({ behavior: "instant", block: "end" });
				removeCutOffMessages();
			}, 50);
		}
	}

	const observer = new MutationObserver(() => {
		autoScroll();
	});
	observer.observe(chatContainer, { childList: true, subtree: true });

	// Check for message aging and apply fading (only if showtime > 0)
	setInterval(() => {
		if (showtime <= 0) return;
		const now = Date.now();
		const messages = Array.from(chatContainer.children).filter(
			child => child.classList.contains('message-container')
		);

		messages.forEach(message => {
			const timestamp = messageTimestamps.get(message.id);
			if (timestamp) {
				const age = now - timestamp;

				// After showtime ms, start fading (showtime=0 disables auto-hiding)
				if (age > showtime && !message.classList.contains('fading')) {
					message.classList.add('fading');
				}
			}
		});
	}, 1000);

	function addEventToOverlay(data) {
		const eventDiv = document.createElement('div');
		eventDiv.classList.add('event-message');
		let eventText = '';

		if (data.type === 'follow') {
			eventText = `${data.chatname} just followed!`;
		} else if (data.type === 'subscription') {
			eventText = `${data.chatname} subscribed!`;
		} else if (data.type === 'donation') {
			eventText = `${data.chatname} donated ${data.amount || ''}!`;
		}

		eventDiv.innerHTML = `<div>${eventText}</div>`;
		chatContainer.appendChild(eventDiv);
	}

	// Cross-transport dedupe: in server mode the same feed message can arrive over both
	// the websocket relay and the VDO.Ninja bridge; render only the first copy.
	var CROSS_TRANSPORT_DEDUPE_TTL_MS = 12000;
	var recentTransportDeliveries = new Map();
	var transportDeliveryDedupe = typeof SocialStreamTransportDedupe !== "undefined" ? SocialStreamTransportDedupe.create() : null;
	function isDuplicateTransportDelivery(data, source) {
		if (!(urlParams.has("server") || urlParams.has("server2") || urlParams.has("server3"))) {
			return false;
		}
		if (transportDeliveryDedupe) return transportDeliveryDedupe(data, source);
		if (!data || typeof data !== "object") {
			return false;
		}
		if (data.id === undefined || data.id === null) {
			return false;
		}
		if ("action" in data || "get" in data || "callback" in data || "mid" in data) {
			return false;
		}
		if (!(data.chatname || data.chatmessage || data.chatimg || data.hasDonation || data.membership || data.event || data.contentimg)) {
			return false;
		}
		var key =
			String(data.id) +
			"|" + (data.type || "") +
			"|" + (data.chatname || "") +
			"|" + String(data.chatmessage || "").slice(0, 100) +
			"|" + (data.hasDonation || "") +
			"|" + (data.event || "");
		var now = Date.now();
		recentTransportDeliveries.forEach(function (seenAt, seenKey) {
			if (now - seenAt > CROSS_TRANSPORT_DEDUPE_TTL_MS) {
				recentTransportDeliveries.delete(seenKey);
			}
		});
		if (recentTransportDeliveries.has(key)) {
			return true;
		}
		recentTransportDeliveries.set(key, now);
		return false;
	}
	// Content images are separate from chat text (including GIF-only messages).
	function appendContentImage(container, data) {
		if (typeof data.contentimg !== 'string' || !data.contentimg.trim()) return;
		const img = document.createElement('img');
		img.className = 'ssn-content-image';
		img.alt = (data.meta && data.meta.gifLabel) || 'Content image';
		img.onerror = function () { this.style.display = 'none'; };
		img.src = data.contentimg;
		container.appendChild(img);
	}

	function addMessageToOverlay(data, source) {
		if (isDuplicateTransportDelivery(data, source)) {
			return;
		}
		if (hideBots && data.bot) { return; }
		if (!data || (!data.chatmessage && !data.contentimg && !data.hasDonation && !data.donation)) {
			console.error("Invalid message data", data);
			return;
		}

		// Skip meta-only messages (follower/viewer data without actual content)
		if (!data.chatname && data.meta && !data.chatmessage && !data.contentimg && !data.hasDonation && !data.donation) {
			return;
		}

		if (['follow', 'subscription', 'donation'].includes(data.type)) {
			addEventToOverlay(data);
			return;
		}

		const renderedChatMessage = data.textonly ? escapeHtml(data.chatmessage || '') : (data.chatmessage || '');
		if (lastSender === data.chatname && lastMessageDiv && lastMessageDiv.isConnected && !lastMessageDiv.classList.contains('fading')) {
			// Append new message to the existing message container
			const textDiv = document.createElement('div');
			textDiv.classList.add('text');
			textDiv.innerHTML = renderedChatMessage;
			appendContentImage(textDiv, data);
			lastMessageDiv.querySelector('.message').appendChild(textDiv);
			messageTimestamps.set(lastMessageDiv.id, Date.now());
		} else {
			// Create a new message container
			const messageContainer = document.createElement('div');
			messageContainer.classList.add('message-container');

			// Generate unique ID and track timestamp for aging
			const messageId = data.mid || 'msg-' + Date.now();
			messageContainer.id = messageId;
			messageTimestamps.set(messageId, Date.now());

			const messageDiv = document.createElement('div');
			messageDiv.classList.add('message');

			let sourceIcon = '';
			if (data.type) {
				const providerName = data.type.charAt(0).toUpperCase() + data.type.slice(1);
				const iconUrl = `https://socialstream.ninja/sources/images/${data.type}.png`;
				sourceIcon = `<img src="${iconUrl}" alt="${providerName}" class="source-icon" onerror="this.remove();">`;
			}

			let chatbadges = "";
			if (data.chatbadges) {
				data.chatbadges.slice(0, 1).forEach(badge => {
					if (typeof badge === "object" && badge.type === "img" && badge.src) {
						chatbadges += `<img class='badge' src='${badge.src}' />`;
					} else if (badge.type === "svg" && badge.html) {
						chatbadges += `<span class='badge svg'>${badge.html}</span>`;
					}
				});
			}

			messageDiv.innerHTML = `
				<div class="username-box">
					${sourceIcon}
					<span>${escapeHtml(data.chatname)}</span>
					<span class="badges">${chatbadges}</span>
				</div>
				<div class="text">${renderedChatMessage}</div>
				${(data.donation || data.hasDonation) ? `<div class="donation">${escapeHtml(data.donation || data.hasDonation)}</div>` : ''}
			`;

			appendContentImage(messageDiv, data);
			messageContainer.appendChild(messageDiv);
			chatContainer.appendChild(messageContainer);

			lastSender = data.chatname;
			lastMessageDiv = messageContainer;
		}
	}
	
	if (!useServerOnlyTransport()) {
		const iframe = document.createElement("iframe");
		iframe.src = featuredMode
			? `https://vdo.socialstream.ninja/?ln&password=${encodeURIComponent(password)}&salt=vdo.ninja&label=overlay&exclude=${roomID}&scene&novideo&noaudio&cleanoutput&room=${roomID}`
			: `https://vdo.socialstream.ninja/?ln&salt=vdo.ninja&password=${encodeURIComponent(password)}&push&label=dock&vd=0&ad=0&novideo&noaudio&autostart&cleanoutput&room=${roomID}`;

		iframe.style.cssText = "width: 0px; height: 0px; position: fixed; left: -100px; top: -100px;";
		document.body.appendChild(iframe);

		window.addEventListener("message", (event) => {
			if (event.source !== iframe.contentWindow) return;
			if (event.data && typeof event.data === "object" && event.data.dataReceived && typeof event.data.dataReceived === "object" && event.data.dataReceived.overlayNinja) {
				addMessageToOverlay(event.data.dataReceived.overlayNinja, "p2p");
			}
		});
	}

	document.addEventListener('DOMContentLoaded', () => {
		applyOverlaySize(); // Apply overlay size based on URL parameter
	});
		
			
	// The Websocket mode is an alternative to using p2p mode; useful if your OBS or system refuses to use IFrames/P2P.
	var conCon = 1;
	var socketserver = false;
	// localserver mode can be used via the stand-alone app; file-> enable local server, or use the publicly hosted one.
	var serverURL = urlParams.has("localserver") ? SocialStreamLocalServer.getWebSocketUrl() : "wss://io.socialstream.ninja";

	function setupSocket(){
		socketserver.onclose = function (){
			setTimeout(function(){
				conCon+=1;
				socketserver = new WebSocket(serverURL);
				setupSocket();
			},100*conCon);
		};
		socketserver.onopen = function (){
			conCon = 1;
			socketserver.send(JSON.stringify({"join":roomID, "out":3, "in":4}));
		};
		socketserver.addEventListener('message', function (event) {
			var resp = false
			if (event.data){
				var data = JSON.parse(event.data);
				addMessageToOverlay(data, "server");
				if (data.get){
					var ret = {};
					ret.callback = {};
					ret.callback.get = data.get
					ret.callback.result = true;
					socketserver.send(JSON.stringify(ret));
				}
			}
		});
	}
	
	if (urlParams.has("server") || urlParams.has("server2")){ // opt-in to use. Must also be enabled in the menu as well.
		serverURL = urlParams.get("server") ||  urlParams.get("server2") || serverURL;
		socketserver = new WebSocket(serverURL);
		setupSocket();
	}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" type="text/css" href="./stream.css">
<!-- <link href='https://fonts.googleapis.com/css?family=Dekko' rel='stylesheet'> -->
<link href="https://fonts.cdnfonts.com/css/minecraft-4" rel="stylesheet">
<title>Some Title Here</title>
</head>
<body>
	<div class="background">
		<img alt="backgroundImage" id="bg" src="./background.jpg">
		<div class="border"></div>
	</div>
	<span id="dateTime">Date Time</span>
	<iframe id="iframeOverlay"></iframe>
	
	<script>
	function getById(id){
		return document.getElementById(id) || document.createElement("span");
	}
	
	window.onerror = function backupErr(errorMsg, url=false, lineNumber=false) {
		console.error(errorMsg);
		console.error(lineNumber);
		console.error("Unhandeled Error occured"); //or any message
		return false;
	};
	
	(function (w) {
		w.URLSearchParams = w.URLSearchParams || function (searchString) {
			let self = this;
			self.searchString = searchString;
			self.get = function (name) {
				const results = new RegExp('[\?&]' + name + '=([^&#]*)').exec(self.searchString);
				if (results == null) {
					return null;
				} else {
					return decodeURI(results[1]) || 0;
				}
			};
		};

	})(window);
	
	const urlParams = new URLSearchParams(window.location.search);
	
	let params = "";
	params += "&transparent&hidemenu";
	params += "&scale=0.4";
	params += "&fadein&smooth&emoji&color";
	params += "&twolines";

	// Pass showtime through to dock.html if provided
	if (urlParams.has("showtime")){
		params += "&showtime=" + urlParams.get("showtime");
	}

	// --- Common overlay tweaks (shared across themes) ---
	// hidebots is handled by the embedded dock.html, so pass it through
	if (urlParams.has("hidebots")){
		params += "&hidebots";
	}
	if (urlParams.has("chroma")){
		const _c = urlParams.get("chroma") || "";
		document.body.style.backgroundColor = _c.charAt(0) === "#" ? _c : "#" + _c;
	}
	if (urlParams.has("darkmode")){
		const _bg = document.getElementById("bg");
		if (_bg){ _bg.style.filter = "brightness(0.45) saturate(1.1)"; }
	}

	if (urlParams.has("session")){
		getById("iframeOverlay").src = `../../dock.html?session=${urlParams.get("session")}${params}`;
	}

	function formatClock(date) {
		let hours = date.getHours();
		const meridiem = hours >= 12 ? "PM" : "AM";
		hours = hours % 12 || 12;
		const minutes = String(date.getMinutes()).padStart(2, "0");
		const seconds = String(date.getSeconds()).padStart(2, "0");
		return `${meridiem} ${String(hours).padStart(2, "0")}:${minutes}:${seconds}`;
	}

	setInterval(function updateTime() {
		getById("dateTime").innerText = formatClock(new Date());
	}, 333);

	</script>
</body>
</html>

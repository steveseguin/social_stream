<VirtualHost *:80>
    ServerName api.socialstream.ninja
    DocumentRoot /var/www/html
    ServerSignature Off
    <IfModule php7_module>
        php_admin_flag display_errors Off
    </IfModule>
    ProxyRequests Off
    ProxyPassMatch "^(/v1/shop(?:/.*)?)$" "http://127.0.0.1:3079$1" connectiontimeout=3 timeout=15
    ProxyPassReverse /v1/shop http://127.0.0.1:3079/v1/shop
    ProxyPass /v1/ebay-sandbox/ http://127.0.0.1:3080/v1/ebay-sandbox/ connectiontimeout=3 timeout=30
    ProxyPassReverse /v1/ebay-sandbox/ http://127.0.0.1:3080/v1/ebay-sandbox/
    ProxyPass /v1/ninjabacker/ http://127.0.0.1:3079/v1/ninjabacker/ connectiontimeout=3 timeout=15
    ProxyPassReverse /v1/ninjabacker/ http://127.0.0.1:3079/v1/ninjabacker/
    ProxyPass /v1/throne/ http://127.0.0.1:3079/v1/throne/ connectiontimeout=3 timeout=120
    ProxyPassReverse /v1/throne/ http://127.0.0.1:3079/v1/throne/
    ProxyPass /v1/ebay/ http://127.0.0.1:3079/v1/ebay/ connectiontimeout=3 timeout=30
    ProxyPassReverse /v1/ebay/ http://127.0.0.1:3079/v1/ebay/
    ProxyPass /v1/monetization/ http://127.0.0.1:3079/v1/monetization/ connectiontimeout=3 timeout=10
    ProxyPassReverse /v1/monetization/ http://127.0.0.1:3079/v1/monetization/
    SetEnvIf Request_URI "^/v1/(throne|ebay|ebay-sandbox)/" no-gzip=1
    <Directory /var/www/html>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>
    <LocationMatch "^/v1/(shop(?:/|$)|(?:throne|ebay|ebay-sandbox|ninjabacker|monetization)/)">
        Header always set Cache-Control "no-store"
    </LocationMatch>
    # Never record SSE reader keys or OAuth codes in access logs.
    ErrorLog /var/log/apache2/ssn-api-error.log
    LogLevel crit
</VirtualHost>

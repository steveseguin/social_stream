<p class="eyebrow">템플릿 02 · 추정 USD</p><h1>작은 달 기지를 만드세요.</h1><p id="rules"></p>
<section class="stage" aria-label="후원 목표"><div id="base" class="art" aria-hidden="true">🌑</div><p id="score" class="score" aria-live="polite"></p>
<progress id="progress" value="0" aria-label="달 기지의 추정 후원"></progress><p id="latest" role="status" translate="no">Waiting for support.</p></section>
<div class="host"><div id="demo-controls"><button id="superchat" type="button">샘플: $5 Super Chat</button><button id="bits" type="button">샘플: 비트 100개</button><button id="jewels" type="button">샘플: 쥬얼 200개</button><button id="zero" type="button">샘플: 명시적 0 지정</button><button id="streak" type="button">샘플: 연속 선물 1, 2, 3</button></div>
<button id="reset" type="button">게임 초기화</button><details><summary>마지막 수신 데이터</summary><pre id="payload">Use a sample button to inspect an event.</pre></details><p class="muted">추정 후원 점수이며 지급받을 잔액이 아닙니다. 새로고침하면 새 게임이 시작됩니다.</p></div></main>
<script src="../../../currency.js"></script><script src="../../../js/local-server-url.js"></script><script src="../../../games/templates/starter.js"></script><script>
'use strict';
// EDIT THIS RULE: the goal is an estimated USD value, never coins or gift count.
var GOAL_USD = 25, total = 0, R = RewardStarter;
R.text('rules', 'Chat builds the base together. Reach an estimated ${0} of support from TikTok, Twitch, Facebook, or YouTube.', [GOAL_USD]);
document.getElementById('progress').max = GOAL_USD;
function render() {
    R.text('score', '${0} / ${1} estimated USD', [total.toFixed(2), GOAL_USD.toFixed(2)]);
    R.text('base', total >= GOAL_USD ? '🌕 🏠 🚀' : total >= GOAL_USD / 2 ? '🌗 🏗️' : '🌑');
    document.getElementById('progress').value = Math.min(total, GOAL_USD);
}
function receive(data) {
    if (!R.isSupport(data)) return;
    // The existing helper honors donoValue (including 0), then estimates from
    // the original amount/unit using currency.js. Do not use `donoValue || ...`.
    var amount = getDonationValueUSD(data);
    var added = R.increment(data, amount, 'USD');
    if (!added) { R.log('No new positive USD value on this event.'); return; }
    total += added;
    R.log('{0} added ${1} estimated USD. {2}', [data.chatname || R.format('A viewer'), added.toFixed(2), total >= GOAL_USD ? R.format('Base complete!') : '']);
    render();
}
R.start(receive, function () { total = 0; render(); R.log('Waiting for support.'); }, {
    superchat: function (id) { return { id: 'super-' + id, type: 'youtube', event: 'superchat', chatname: 'Sample viewer', hasDonation: '$5.00' }; },
    bits: function (id) { return { id: 'bits-' + id, type: 'twitch', event: 'cheer', chatname: 'Sample viewer', hasDonation: '100 bits', donoValue: 1 }; },
    jewels: function (id) { return { id: 'jewels-' + id, type: 'youtube', event: 'jeweldonation', chatname: 'Sample viewer', hasDonation: '200 Jewels' }; },
    zero: function (id) { return { id: 'zero-' + id, type: 'youtube', event: 'superchat', hasDonation: '$5.00', donoValue: 0 }; },
    streak: function (id) { return [1, 2, 3].map(function (count) { return { id: 'gift-' + id + '-' + count, type: 'tiktok', event: 'gift', chatname: 'Sample viewer', hasDonation: (count * 10) + ' coins', donoValue: count * 0.1, meta: { tiktokGiftStreakId: 'demo-' + id, tiktokGiftCount: count } }; }); }
});
</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Color Symphony: an interactive stream activity for Social Stream Ninja. Connect your chat session and add the game to your OBS scene.">
    <meta name="robots" content="noindex">
<script src="../js/local-server-url.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Symphony - Social Stream Ninja</title>
    <link rel="icon" href="../icons/favicon.ico" type="image/x-icon">
    <style>
        /* Hide scrollbars */
        ::-webkit-scrollbar {
            display: none;
        }

        * {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #0f0f23 0%, #000 100%);
            overflow: hidden;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            color: white;
        }

        body.chroma {
            background: #00ff00;
        }

        body.darkmode {
            background: #000000;
        }

        body.transparent {
            background: transparent;
        }

        #game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #symphony-stage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* The one thing viewers need to know: what to type */
        #hint {
            position: absolute;
            top: 4vmin;
            left: 0;
            width: 100%;
            text-align: center;
        }

        #hint-chip {
            display: inline-block;
            padding: 0.9vmin 2.6vmin;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.22);
            font-size: 3.8vmin;
            line-height: 1.3;
            font-weight: 800;
            white-space: nowrap;
        }

        #hint-chip span {
            margin: 0 1.2vmin;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="symphony-stage"></canvas>

        <div id="hint">
            <div id="hint-chip"><span style="color: #ff6b78;">red</span><span style="color: #5cb3ff;">blue</span><span style="color: #5fd676;">green</span></div>
        </div>
    </div>

    <script>
        // URL parameters
        const urlParams = new URLSearchParams(window.location.search);
    var chatRelay = SocialStreamLocalServer.getChatRelayConfig(urlParams);
        const sessionId = urlParams.get('session') || urlParams.get('room') || 'test';
        const password = urlParams.get('password') || 'false';

        // Apply theme settings
        if (urlParams.has('chroma')) {
            document.body.classList.add('chroma');
        } else if (urlParams.has('darkmode')) {
            document.body.classList.add('darkmode');
        }
        if (urlParams.has('transparent')) {
            document.body.classList.add('transparent');
        }

        // Game state
        let gameState = {
            notesPlayed: 0,
            composers: new Set(),
            recentNotes: [],
            lastColor: null,
            notes: [],
            rings: [],
            dirty: true
        };

        const MAX_NOTES = 70; // keep OBS rendering smooth during chat floods

        // Color definitions
        const colors = {
            red: { hex: '#ff5d6c', note: 'C', frequency: 261.63 },
            orange: { hex: '#ffa94d', note: 'D', frequency: 293.66 },
            yellow: { hex: '#ffd43b', note: 'E', frequency: 329.63 },
            green: { hex: '#51cf66', note: 'F', frequency: 349.23 },
            blue: { hex: '#4dabf7', note: 'G', frequency: 392.00 },
            purple: { hex: '#b388ff', note: 'A', frequency: 440.00 },
            pink: { hex: '#ff8fab', note: 'B', frequency: 493.88 },
            white: { hex: '#f8f9fa', note: 'C2', frequency: 523.25 },
            black: { hex: '#343a40', note: 'D2', frequency: 587.33 },
            cyan: { hex: '#3bc9db', note: 'E2', frequency: 659.25 }
        };

        // Order of the bars on screen, low notes to high
        const keyOrder = ['red', 'orange', 'yellow', 'green', 'blue', 'purple', 'pink', 'white', 'black', 'cyan'];
        const noteGlyphs = ['♪', '♫', '♩', '♬'];

        // Harmony combinations
        const harmonies = [
            ['red', 'yellow', 'blue'],      // Primary colors
            ['orange', 'green', 'purple'],   // Secondary colors
            ['red', 'green'],               // Complementary
            ['blue', 'orange'],             // Complementary
            ['yellow', 'purple'],           // Complementary
            ['pink', 'cyan'],               // Complementary
            ['red', 'orange', 'yellow'],    // Warm colors
            ['blue', 'green', 'purple'],    // Cool colors
        ];

        // Extract color names from text
        function extractColors(text) {
            const foundColors = [];
            const words = text.toLowerCase().split(/\s+/);
            
            words.forEach(word => {
                // Direct color matches
                if (keyOrder.includes(word)) {
                    foundColors.push(word);
                }
                // Color variations
                else if (/^reds?$/.test(word) && !foundColors.includes('red')) foundColors.push('red');
                else if (/^blues?$/.test(word) && !foundColors.includes('blue')) foundColors.push('blue');
                else if (/^greens?$/.test(word) && !foundColors.includes('green')) foundColors.push('green');
                else if (/^yellows?$/.test(word) && !foundColors.includes('yellow')) foundColors.push('yellow');
                else if (/^purples?$/.test(word) && !foundColors.includes('purple')) foundColors.push('purple');
                else if (/^oranges?$/.test(word) && !foundColors.includes('orange')) foundColors.push('orange');
                else if (/^pinks?$/.test(word) && !foundColors.includes('pink')) foundColors.push('pink');
                else if (/^whites?$/.test(word) && !foundColors.includes('white')) foundColors.push('white');
                else if (/^blacks?$/.test(word) && !foundColors.includes('black')) foundColors.push('black');
                else if (/^cyans?$/.test(word) && !foundColors.includes('cyan')) foundColors.push('cyan');
            });
            
            return foundColors;
        }

        // Stage
        const canvas = document.getElementById('symphony-stage');
        const ctx = canvas.getContext('2d');
        const view = { width: 0, height: 0, unit: 0, keys: Object.create(null) };

        // One bar per colour along the bottom, getting shorter toward the high notes
        function layoutStage() {
            view.width = canvas.width = window.innerWidth;
            view.height = canvas.height = window.innerHeight;
            view.unit = Math.min(view.width, view.height) / 100;

            const margin = view.unit * 3;
            const step = (view.width - margin * 2) / keyOrder.length;
            const barWidth = step * 0.84;
            const tallest = Math.min(view.height * 0.22, view.unit * 24);

            keyOrder.forEach((name, index) => {
                const previous = view.keys[name];
                const barHeight = tallest * (1 - index * 0.05);
                view.keys[name] = {
                    x: margin + step * index + (step - barWidth) / 2,
                    y: view.height - margin - barHeight,
                    width: barWidth,
                    height: barHeight,
                    bounce: previous ? previous.bounce : 0
                };
            });

            gameState.dirty = true;
        }

        function roundedRect(x, y, width, height, radius) {
            radius = Math.min(radius, width / 2, height / 2);
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.arcTo(x + width, y, x + width, y + height, radius);
            ctx.arcTo(x + width, y + height, x, y + height, radius);
            ctx.arcTo(x, y + height, x, y, radius);
            ctx.arcTo(x, y, x + width, y, radius);
            ctx.closePath();
        }

        // Create color ripple
        function createColorRipple(color, x, y, size, life, delay) {
            if (gameState.rings.length >= 40) gameState.rings.shift();
            gameState.rings.push({
                color: colors[color].hex,
                x: x,
                y: y,
                size: size,
                life: life,
                age: -(delay || 0)
            });
        }

        // Create floating note
        function createFloatingNote(color) {
            const key = view.keys[color];
            if (gameState.notes.length >= MAX_NOTES) gameState.notes.shift();

            gameState.notes.push({
                color: color,
                x: key.x + key.width / 2,
                y: key.y,
                radius: view.unit * (4 + Math.random() * 3),
                sway: view.unit * (2 + Math.random() * 5),
                phase: Math.random() * Math.PI * 2,
                glyph: noteGlyphs[Math.floor(Math.random() * noteGlyphs.length)],
                life: 5 + Math.random() * 2,
                age: 0
            });
        }

        // Strike a bar: it bounces, rings and sends a note floating up
        function playNote(color) {
            const key = view.keys[color];
            key.bounce = 1;
            gameState.lastColor = color;
            createFloatingNote(color);
            createColorRipple(color, key.x + key.width / 2, key.y, view.unit * 12, 0.8);
        }

        // Check for harmony
        function checkHarmony(newColors) {
            gameState.recentNotes.push(...newColors);
            gameState.recentNotes = gameState.recentNotes.slice(-6); // Keep last 6 notes

            for (let harmony of harmonies) {
                const hasHarmony = harmony.every(color => gameState.recentNotes.includes(color));
                if (hasHarmony) {
                    gameState.recentNotes = [];
                    createHarmonyExplosion(harmony);
                    return true;
                }
            }

            return false;
        }

        // Create harmony explosion
        function createHarmonyExplosion(harmonyColors) {
            const reach = Math.max(view.width, view.height) * 0.6;
            const centerY = view.height * 0.42;

            // Big rings in the matching colours, and the whole row of bars does a wave
            harmonyColors.forEach((color, index) => {
                createColorRipple(color, view.width / 2, centerY, reach, 1.8, index * 0.22);
                for (let i = 0; i < 3; i++) {
                    setTimeout(() => createFloatingNote(color), 150 + index * 200 + i * 260);
                }
            });

            keyOrder.forEach((name, index) => {
                setTimeout(() => {
                    view.keys[name].bounce = 1;
                }, index * 60);
            });
        }

        function drawStage(elapsed) {
            const unit = view.unit;
            ctx.clearRect(0, 0, view.width, view.height);

            // Ripples
            ctx.lineCap = 'round';
            gameState.rings = gameState.rings.filter(ring => {
                ring.age += elapsed;
                if (ring.age < 0) return true;
                const progress = ring.age / ring.life;
                if (progress >= 1) return false;

                ctx.globalAlpha = (1 - progress) * 0.8;
                ctx.strokeStyle = ring.color;
                ctx.lineWidth = unit * (2.2 - progress * 1.4);
                ctx.beginPath();
                ctx.arc(ring.x, ring.y, ring.size * (1 - Math.pow(1 - progress, 2)), 0, Math.PI * 2);
                ctx.stroke();
                return true;
            });

            // Notes floating up the stage
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            gameState.notes = gameState.notes.filter(note => {
                note.age += elapsed;
                const progress = note.age / note.life;
                if (progress >= 1) return false;

                const rise = (note.y - unit * 9) * (1 - Math.pow(1 - progress, 1.25));
                const x = note.x + Math.sin(note.age * 1.3 + note.phase) * note.sway * Math.min(1, progress * 4);
                const y = note.y - rise;
                let radius = note.radius * Math.min(1, note.age / 0.25);
                if (progress > 0.8) radius *= 1 - (progress - 0.8) / 0.2 * 0.5;

                ctx.globalAlpha = progress > 0.75 ? (1 - progress) / 0.25 : 1;
                ctx.fillStyle = colors[note.color].hex;
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.lineWidth = Math.max(1, unit * 0.25);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
                ctx.stroke();

                ctx.fillStyle = note.color === 'black' ? 'rgba(255, 255, 255, 0.85)' : 'rgba(20, 20, 30, 0.7)';
                ctx.font = '700 ' + Math.round(radius * 1.15) + 'px system-ui, "Segoe UI Symbol", sans-serif';
                ctx.fillText(note.glyph, x, y + radius * 0.05);
                return true;
            });

            // Bars
            ctx.globalAlpha = 1;
            let moving = false;
            keyOrder.forEach(name => {
                const key = view.keys[name];
                if (key.bounce > 0) {
                    key.bounce = Math.max(0, key.bounce - elapsed * 2.6);
                    moving = true;
                }
                const push = Math.sin(key.bounce * Math.PI) * unit * 2.2;
                const grow = key.bounce * unit * 0.8;

                roundedRect(key.x - grow, key.y + push - grow, key.width + grow * 2, key.height + grow * 2, unit * 2.4);
                ctx.fillStyle = colors[name].hex;
                ctx.fill();
                ctx.lineWidth = 1;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.28)';
                ctx.stroke();

                // Soft highlight across the top of each bar
                roundedRect(key.x + key.width * 0.14, key.y + push + unit * 1.2, key.width * 0.72, unit * 1.6, unit * 0.8);
                ctx.fillStyle = 'rgba(255, 255, 255, ' + (0.28 + key.bounce * 0.4) + ')';
                ctx.fill();
            });

            return moving || gameState.notes.length > 0 || gameState.rings.length > 0;
        }

        let lastFrame = performance.now();
        function animate(now) {
            const elapsed = Math.min(0.1, (now - lastFrame) / 1000);
            lastFrame = now;

            // Nothing moving: leave the last frame on screen
            if (gameState.dirty) {
                gameState.dirty = drawStage(elapsed);
            } else if (gameState.notes.length > 0 || gameState.rings.length > 0 || keyOrder.some(name => view.keys[name].bounce > 0)) {
                gameState.dirty = true;
            }

            requestAnimationFrame(animate);
        }

        function stripHtml(html) {
            // Keep the existing div parsing context inside inert template content.
            const template = document.createElement('template');
            const tmp = template.content.appendChild(document.createElement('div'));
            tmp.innerHTML = html;
            return tmp.textContent || tmp.innerText || '';
        }

        // Process incoming message
        function processData(data) {
            // Captions are the host's own speech shown as text. They are not chat to take part with.
            if (data && (data.content || data).type === "captions") return;
            // Handle different data formats from Social Stream
            if (data && data.content) {
                data = data.content;
            }

            if (!data || !data.chatmessage || !data.chatname) return;

            const username = stripHtml(data.chatname);
            let message = data.chatmessage;
            // Preserve the chatmessage format: textonly=true is literal text, without HTML parsing/filtering; false/missing permits HTML checked at its ingress boundary.
            if (!data.textonly) {
                message = stripHtml(message);
            }
            const foundColors = extractColors(message);

            if (foundColors.length === 0) return;

            if (gameState.composers.size >= 500) {
                gameState.composers = new Set(Array.from(gameState.composers).slice(-250));
            }
            gameState.composers.add(username);

            foundColors.slice(0, 6).forEach((color, index) => {
                gameState.notesPlayed++;
                setTimeout(() => playNote(color), index * 140);
            });

            // Check for harmony
            if (foundColors.length > 1 || Math.random() < 0.2) {
                checkHarmony(foundColors);
            }
        }

        // Setup iframe communication
        if (!urlParams.has('demo') && !chatRelay.enabled) {
            const iframe = document.createElement("iframe");
            iframe.src = `https://vdo.socialstream.ninja/?ln&salt=vdo.ninja&notmobile&password=${encodeURIComponent(password)}&solo&view=${encodeURIComponent(sessionId)}&novideo&noaudio&label=dock&cleanoutput&room=${encodeURIComponent(sessionId)}`;
            iframe.style.width = "0px";
            iframe.style.height = "0px";
            iframe.style.position = "fixed";
            iframe.style.left = "-100px";
            iframe.style.top = "-100px";
            iframe.id = "frame1";
            document.body.appendChild(iframe);
            
            // Listen for messages
            window.addEventListener("message", function(e) {
                if (e.source !== iframe.contentWindow) return;
                
                if (e.data && typeof e.data === "object" && e.data.dataReceived && typeof e.data.dataReceived === "object") {
                    if ("overlayNinja" in e.data.dataReceived) {
                        processData(e.data.dataReceived.overlayNinja);
                    }
                }
            });
        }

        // Handle WebSocket connection
        if (!urlParams.has('demo') && chatRelay.enabled) {
            const serverUrl = chatRelay.url;
            let socketserver = null;
            let reconnectTimeout = null;

            function connectWebSocket() {
                socketserver = new WebSocket(serverUrl);

                socketserver.onopen = function() {
                    socketserver.send(JSON.stringify({
                        join: sessionId.split(",")[0],
                        out: chatRelay.out, in: chatRelay.in
                    }));
                };

                socketserver.onclose = function() {
                    clearTimeout(reconnectTimeout);
                    reconnectTimeout = setTimeout(connectWebSocket, 5000);
                };

                socketserver.onerror = function() {
                    try { socketserver.close(); } catch (e) {}
                };

                socketserver.onmessage = function(event) {
                    if (event.data) {
                        try {
                            const data = JSON.parse(event.data);
                            processData(data);
                        } catch (e) {
                            console.error('WebSocket parse error:', e);
                        }
                    }
                };
            }

            connectWebSocket();
        }

        // Demo mode
        if (urlParams.has('demo')) {
            const demoColors = Object.keys(colors);
            const demoUsers = ['Artist1', 'Painter2', 'Composer3', 'Creator4', 'Designer5'];

            function demoNote() {
                const numColors = Math.floor(Math.random() * 3) + 1;
                const selectedColors = [];

                for (let i = 0; i < numColors; i++) {
                    selectedColors.push(demoColors[Math.floor(Math.random() * demoColors.length)]);
                }

                const user = demoUsers[Math.floor(Math.random() * demoUsers.length)];

                processData({
                    chatname: user,
                    chatmessage: selectedColors.join(' ')
                });

                setTimeout(demoNote, 500 + Math.random() * 900);
            }
            setTimeout(demoNote, 400);
        }

        // Keep the stage fitted to the window
        window.addEventListener('resize', layoutStage);

        layoutStage();
        requestAnimationFrame(animate);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Chat Overlay. Part of the Social Stream Ninja toolkit for managing live chat, stream overlays and audience interactions.">
    <meta name="robots" content="noindex">
    <link rel="icon" href="icons/favicon.ico" type="image/x-icon">

	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Chat Overlay</title>
</head>
<body>
	<script>
	(function () {
		var query = location.search ? location.search.substring(1) : "";
		var hash = location.hash || "";
		var params = new URLSearchParams(query);
		if (!params.get("overlay")) params.set("overlay", "chat-overlay");
		location.replace("aioverlay.html?" + params.toString() + hash);
	}());
	</script>
</body>
</html>

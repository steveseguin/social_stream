<p class="eyebrow">模板 01 · 平臺原生單位</p><h1>助火箭一臂之力。</h1>
<p id="rules"></p><section class="stage" aria-label="火箭進度"><div class="art" aria-hidden="true">🚀</div>
<p id="score" class="score" aria-live="polite"></p><progress id="progress" max="10" value="0" aria-label="前往下一顆星球的推進次數"></progress>
<p id="latest" role="status" translate="no">Waiting for the first boost.</p></section>
<div class="host"><div id="demo-controls"><button id="coins" type="button">示例：10 枚 TikTok 金幣</button><button id="bits" type="button">示例：100 Bits</button><button id="stars" type="button">示例：100 Stars</button><button id="streak" type="button">示例：連送 1、2、3</button><button id="unknown" type="button">示例：未知禮物價格</button></div>
<button id="reset" type="button">重新開始</button><details><summary>最近收到的資料</summary><pre id="payload">Use a sample button to inspect an event.</pre></details>
<p class="muted">餘額和進度保留到重置或重新整理為止。新增 &amp;clean 可在 OBS 隱藏這些控制元件。</p></div></main>
<script src="../../../js/local-server-url.js"></script><script src="../../../games/templates/starter.js"></script><script>
'use strict';
// EDIT THESE RULES: native platform units required for one boost.
var COST = { tiktok: 10, twitch: 100, facebook: 100 };
var boosts = 0, balances = new Map(), R = RewardStarter;
R.text('rules', '{0} TikTok coins, {1} Twitch Bits, or {2} Facebook Stars = one boost. Each viewer keeps their remainder.', [COST.tiktok, COST.twitch, COST.facebook]);
function render() {
    R.text('score', 'Boosts: {0} · Planets reached: {1}', [boosts, Math.floor(boosts / 10)]);
    document.getElementById('progress').value = boosts % 10;
}
function receive(data) {
    if (!R.isSupport(data)) return;
    var type = R.platform(data);
    // Twitch's display label can be translated; prefer its native Bits count.
    var bits = type === 'twitch' ? Number((data.meta || {}).bits || data.bits) : 0;
    var amount = type === 'tiktok' ? R.coins(data) : type === 'twitch' ?
        (Number.isInteger(bits) && bits > 0 ? bits : R.labelCount(data, 'bit')) :
        type === 'facebook' ? R.labelCount(data, 'star') : 0;
    if (!amount) { R.log('No supported native-unit amount on this event.'); return; }
    var added = R.increment(data, amount, 'native-units');
    if (!added) return;
    var key = JSON.stringify([type, data.userid || (type === 'tiktok' && data.meta && data.meta.tiktokGiftSenderId) || data.chatname || 'anonymous']);
    var balance = (balances.get(key) || 0) + added;
    var awarded = Math.floor(balance / COST[type]);
    balances.set(key, balance % COST[type]);
    boosts += awarded;
    R.log('{0}: +{1} boosts; {2} units toward the next.', [data.chatname || R.format('A viewer'), awarded, balances.get(key)]);
    render();
}
function gift(id, count) { return { id: id, type: 'tiktok', event: 'gift', userid: 'demo-tiktok', chatname: 'Sample viewer', chatmessage: 'Sent Demo gift x' + count, hasDonation: (count * 10) + ' coins', donoValue: count * 0.1, meta: { giftName: 'Demo gift', coinsPerGift: 10, tiktokGiftCount: count } }; }
R.start(receive, function () { boosts = 0; balances.clear(); render(); R.log('Waiting for the first boost.'); }, {
    coins: function (id) { return gift('coins-' + id, 1); },
    bits: function (id) { return { id: 'bits-' + id, type: 'twitch', event: 'cheer', chatname: 'Sample viewer', hasDonation: '100 bits', donoValue: 1 }; },
    stars: function (id) { return { id: 'stars-' + id, type: 'facebook', chatname: 'Sample viewer', hasDonation: '100 Stars', donoValue: 1 }; },
    streak: function (id) { return [1, 2, 3].map(function (count) { var data = gift('streak-' + id + '-' + count, count); data.meta.tiktokGiftStreakId = 'demo-streak-' + id; return data; }); },
    unknown: function (id) { return { id: 'unknown-' + id, type: 'tiktok', event: 'gift', hasDonation: '1 gift', donoValue: 0.01, meta: { tiktokGiftCount: 1 } }; }
});
</script></body></html>

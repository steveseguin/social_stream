name: Deploy Main and Beta to GitHub Pages
on:
  push:
    branches:
      - main
      - beta
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-gh-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: "!contains(github.event.head_commit.message, '[skip pages]') && !contains(github.event.head_commit.message, '[auto-enhanced]') && github.actor != 'github-pages[bot]'"
    runs-on: ubuntu-latest
    steps:
      - name: Create deployment structure
        run: mkdir -p gh-pages-content/beta

      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-content

      - name: Checkout beta branch
        uses: actions/checkout@v4
        with:
          ref: beta
          path: beta-content

      - name: Prepare content
        run: |
          python3 - <<'PY'
          import shutil
          from pathlib import Path

          for checkout in ('main-content', 'beta-content'):
              skills = Path(checkout) / 'docs' / 'skills'
              source = skills / 'control-social-stream'
              if source.is_dir():
                  shutil.make_archive(str(skills / 'control-social-stream'), 'zip', skills, 'control-social-stream')
          PY
          for checkout in main-content beta-content; do
            if [ -f "$checkout/commerce-board.html" ]; then
              test -f "$checkout/shared/monetization/boards.js"
              test -f "$checkout/shared/monetization/board-overlay.js"
              test -f "$checkout/shared/monetization/board-overlay.css"
              test -f "$checkout/shared/monetization/board-controls.js"
              test -f "$checkout/shared/monetization/board-controls.css"
            fi
            # Content-image handling is shared by the dock and featured overlay.
            if grep -q 'shared/utils/contentImage.js' "$checkout/dock.html" "$checkout/featured.html"; then
              test -f "$checkout/shared/utils/contentImage.js"
            fi
            # Badge rendering and its packaged sanitizer must accompany overlays.
            if grep -q 'shared/utils/chatBadges.js' "$checkout/dock.html"; then
              test -f "$checkout/shared/utils/chatBadges.js"
              test -f "$checkout/shared/utils/chatBadges.css"
              test -f "$checkout/libs/objects.js"
            fi
            # Final chat HTML checks use the same packaged sanitizer on both overlays.
            if grep -q 'shared/utils/chatHtml.js' "$checkout/dock.html" "$checkout/featured.html"; then
              test -f "$checkout/shared/utils/chatHtml.js"
              test -f "$checkout/libs/objects.js"
            fi
            # Alert sounds and their shared picker must ship together on the site.
            if [ -f "$checkout/shared/alerts/sound-library.js" ]; then
              test -f "$checkout/shared/alerts/sound-library.css"
              test -f "$checkout/audio/alerts/voice-thank-you.wav"
              test -f "$checkout/audio/alerts/applause.wav"
              test -f "$checkout/media/alerts/celebration.svg"
            fi
            generator="$checkout/scripts/build-docs-search-index.py"
            if [ -f "$generator" ]; then
              python3 "$generator" --docs-root "$checkout/docs" --output "$checkout/docs/search-index.json"
            fi
          done
          rsync -av \
            --exclude='/.git/' \
            --exclude='/.agents/' \
            --exclude='/.claude/' \
            --exclude='/.codex/' \
            --exclude='/.codex-tmp/' \
            --exclude='/.codex-tmp-*.diff' \
            --exclude='/.playwright-mcp/' \
            --exclude='/.npm-cache/' \
            --exclude='/.github/' \
            --exclude='/.githooks/' \
            --exclude='/node_modules/' \
            --exclude='/scripts/' \
            --exclude='/tests/' \
            --exclude='/tmp/' \
            --exclude='/tmp-*' \
            --exclude='/tmp_*' \
            --exclude='/.tmp_*' \
            --exclude='/artifacts/' \
            --exclude='/playwright-report/' \
            --exclude='/test-results/' \
            --exclude='/%SystemDrive%/' \
            --exclude='/face-preview.png' \
            --exclude='*.log' \
            main-content/ gh-pages-content/
          rsync -av \
            --exclude='/.git/' \
            --exclude='/.agents/' \
            --exclude='/.claude/' \
            --exclude='/.codex/' \
            --exclude='/.codex-tmp/' \
            --exclude='/.codex-tmp-*.diff' \
            --exclude='/.playwright-mcp/' \
            --exclude='/.npm-cache/' \
            --exclude='/.github/' \
            --exclude='/.githooks/' \
            --exclude='/node_modules/' \
            --exclude='/scripts/' \
            --exclude='/tests/' \
            --exclude='/tmp/' \
            --exclude='/tmp-*' \
            --exclude='/tmp_*' \
            --exclude='/.tmp_*' \
            --exclude='/artifacts/' \
            --exclude='/playwright-report/' \
            --exclude='/test-results/' \
            --exclude='/%SystemDrive%/' \
            --exclude='/face-preview.png' \
            --exclude='*.log' \
            beta-content/ gh-pages-content/beta/
          # Public viewer URLs are stable even while creator controls ship on beta.
          # Keep the viewer's versioned dependencies separate from stable app assets.
          python3 beta-content/scripts/build-public-shop.py --source beta-content --output gh-pages-content
          seo_script="${GITHUB_REF_NAME}-content/scripts/prepare-pages-seo.py"
          python3 "$seo_script" --root gh-pages-content
          python3 "$seo_script" --root gh-pages-content --check
          # Generate only the beta Spanish pilot; stable English stays in place.
          # Run after SEO because these preview pages own their noindex metadata.
          translation_script="beta-content/scripts/build-site-translations.py"
          if [ -f "$translation_script" ]; then
            python3 "$translation_script" --root gh-pages-content/beta
            python3 "$translation_script" --root gh-pages-content/beta --check
          fi
          touch gh-pages-content/.nojekyll
          echo "Removing files larger than 25MB from deployment payload"
          find gh-pages-content -type f -size +25M -print -delete || true
          echo "Deployment content (recursive):"
          ls -laR gh-pages-content

      - name: Push to gh-pages branch
        run: |
          cd gh-pages-content
          git init
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          # /* Ensure this commit message contains '[skip pages]' */
          git commit -m "Deploy main and beta to GitHub Pages [skip pages]"
          git branch -M gh-pages
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          for attempt in 1 2 3; do
            if git push -f origin gh-pages; then
              exit 0
            fi
            echo "gh-pages push failed on attempt ${attempt}; retrying after ref-lock backoff..."
            sleep $((attempt * 10))
          done
          git push -f origin gh-pages

name: Validate HTML and documentation

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

permissions:
  contents: read

jobs:
  validate:
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]') && !contains(github.event.head_commit.message, '[skip pages]') && !contains(github.event.head_commit.message, '[auto-enhanced]') && github.actor != 'github-pages[bot]'"
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install htmlhint

    - name: Validate HTML files
      run: npx htmlhint "**/*.html" --config .htmlhintrc

    - name: Test non-browser monetization and providers
      timeout-minutes: 2
      # Exclude Node's synthetic root so it does not re-include the browser cases.
      run: node --test --test-concurrency=1 --test-name-pattern='^(?!<root>$|Wishlist HTML import|Popup retries incomplete startup).+' tests/monetization.test.cjs tests/monetization-providers.test.cjs

    - name: Validate Python scripts
      run: python3 -m compileall -q scripts docs/skills/control-social-stream/scripts

    - name: Validate documentation links
      run: python3 scripts/validate-doc-links.py

    - name: Validate documentation search index
      run: python3 scripts/build-docs-search-index.py --docs-root docs --output /tmp/social-stream-docs-search-index.json

    - name: Test Event Flow regressions
      timeout-minutes: 2
      run: |
        node --test tests/eventflow-raid.test.cjs tests/eventflow-action-traversal.test.cjs tests/eventflow-workflow.test.cjs
        node tests/eventflow-template-vars.test.js

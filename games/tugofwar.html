<!doctype html>
<html lang="en"><head>
<script src="../shared/utils/documentation.js"></script>
    <meta charset="utf-8">
    <meta name="description" content="Tug of War: an interactive stream activity for Social Stream Ninja. Connect your chat session and add the game to your OBS scene.">
    <meta name="robots" content="noindex">
<script src="../js/local-server-url.js"></script><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tug of War · Social Stream Ninja</title><link rel="icon" href="../favicon.ico"><link rel="stylesheet" href="audience.css"><link rel="stylesheet" href="tugofwar.css"></head>
<body data-game="tug"><main class="shell tug-shell" aria-label="Tug of War">
<div class="topline"><span id="round" class="game-sr-only">Match 1</span><span class="lobby-count"><b id="participants">0</b><span class="needed">/2</span> players</span><span id="join-hint" hidden><code>!join</code></span><div class="clock"><span id="clock-value" aria-label="Time remaining"></span></div></div>
<p id="result" class="result" role="status" hidden></p>
<section class="tug-board" aria-label="Team tug of war">
<div class="tug-teams"><div class="team-0"><h2>Coral</h2><b id="team-pulls-0">0</b></div><div class="team-1"><h2>Mint</h2><b id="team-pulls-1">0</b></div></div>
<div class="prompt-card" id="prompt-card"><div class="prompt-top"><span id="prompt-action">Chat</span><span id="prompt-clock"></span></div><div id="tug-prompt" aria-live="polite">!join</div></div>
<div id="arena" class="arena" style="--pull:0%">
<div class="center-line" aria-hidden="true"></div><div class="win-line left-line" aria-hidden="true"></div><div class="win-line right-line" aria-hidden="true"></div>
<div class="rope-party" aria-hidden="true"><div class="rope"></div><div class="rope-flag"></div>
<svg class="monster coral" viewBox="0 0 160 170"><path class="limb" d="M50 135 30 156M108 135 128 156"/><path class="horn" d="M35 55 22 18 58 39M105 38 138 18 124 61"/><path class="fur" d="M28 74C20 15 133 17 132 74L143 127Q145 151 113 150H46Q13 150 18 122Z"/><ellipse cx="79" cy="80" rx="34" ry="32" fill="#fff5e4"/><ellipse cx="90" cy="82" rx="13" ry="20" fill="#263041"/><circle cx="95" cy="75" r="5" fill="white"/><path d="M62 120q18 13 35-2" fill="none" stroke="#743b45" stroke-width="6" stroke-linecap="round"/><path class="limb" d="M115 109 155 105"/><path d="m72 126 8 10 6-10" fill="#fff5e4"/></svg>
<svg class="monster mint" viewBox="0 0 160 170"><path class="limb" d="M50 135 30 156M108 135 128 156"/><path class="horn" d="M35 55 22 18 58 39M105 38 138 18 124 61"/><path class="fur" d="M28 74C20 15 133 17 132 74L143 127Q145 151 113 150H46Q13 150 18 122Z"/><ellipse cx="79" cy="80" rx="34" ry="32" fill="#fff5e4"/><ellipse cx="90" cy="82" rx="13" ry="20" fill="#263041"/><circle cx="95" cy="75" r="5" fill="white"/><path d="M62 120q18 13 35-2" fill="none" stroke="#2d716b" stroke-width="6" stroke-linecap="round"/><path class="limb" d="M115 109 155 105"/><path d="m72 126 8 10 6-10" fill="#fff5e4"/></svg>
</div><div class="ground" aria-hidden="true"></div></div>
<div id="tug-progress" class="game-sr-only" role="meter" aria-label="Rope position" aria-valuemin="-20" aria-valuemax="20" aria-valuenow="0"></div>
<div class="tug-rosters"><ul id="team-roster-0" class="team-0" aria-label="Coral teammates"></ul><ul id="team-roster-1" class="team-1" aria-label="Mint teammates"></ul></div>
</section>

<div id="history" class="game-sr-only" aria-live="polite"></div>

</main><script src="tug-engine.js"></script><script src="tug-view.js"></script><script src="fit-card.js"></script><script src="audience-page.js"></script></body></html>

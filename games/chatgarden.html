<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Chat Garden: an interactive stream activity for Social Stream Ninja. Connect your chat session and add the game to your OBS scene.">
    <meta name="robots" content="noindex">
<script src="../js/local-server-url.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Garden - Social Stream Ninja</title>
    <link rel="icon" href="../icons/favicon.ico" type="image/x-icon">
    <link rel="preload" href="../thirdparty/NotoColorEmoji.ttf" as="font" type="font/ttf" crossorigin>
    <style>
        /* Hide scrollbars */
        ::-webkit-scrollbar {
            display: none;
        }

        * {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }

        @font-face {
            font-family: 'NotoColorEmoji';
            src: url('../thirdparty/NotoColorEmoji.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #87CEEB 0%, #90EE90 30%, #228B22 100%);
            overflow: hidden;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'NotoColorEmoji', sans-serif;
            color: white;
        }

        body.chroma {
            background: #00ff00;
        }

        body.darkmode {
            background: linear-gradient(to bottom, #2c3e50 0%, #34495e 30%, #1a252f 100%);
        }

        body.transparent {
            background: transparent;
        }

        #game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Rolling ground the plants grow on */
        #garden-ground {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 54%;
        }

        .hill {
            position: absolute;
            height: 100%;
            border-radius: 50% 50% 0 0 / 14vmin 14vmin 0 0;
        }

        .hill-back {
            left: -35%;
            top: 0;
            width: 120%;
            background: #8ed081;
        }

        .hill-mid {
            left: 30%;
            top: 9%;
            width: 110%;
            background: #6fc06c;
        }

        .hill-front {
            left: -10%;
            top: 24%;
            width: 120%;
            background: #57ad5d;
        }

        body.darkmode .hill-back { background: #3f6b52; }
        body.darkmode .hill-mid { background: #34594a; }
        body.darkmode .hill-front { background: #2a4a3f; }

        #plants {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
        }

        .plant {
            position: absolute;
            width: 1em;
            margin-left: -0.5em;
            line-height: 1;
            text-align: center;
        }

        .plant::before {
            content: '';
            position: absolute;
            left: 12%;
            bottom: -0.04em;
            width: 76%;
            height: 0.16em;
            border-radius: 50%;
            background: rgba(20, 60, 25, 0.28);
        }

        .plant-body {
            position: relative;
            transform-origin: 50% 100%;
            animation: plant-grow 0.9s cubic-bezier(0.2, 1.5, 0.4, 1) both, plant-sway 3.2s ease-in-out 0.9s infinite alternate;
        }

        .plant.wilt .plant-body {
            animation: plant-wilt 0.8s ease-in both;
        }

        @keyframes plant-grow {
            0% { transform: scale(0.05, 0); }
            100% { transform: scale(1, 1); }
        }

        @keyframes plant-sway {
            0% { transform: rotate(-3deg); }
            100% { transform: rotate(3deg); }
        }

        @keyframes plant-wilt {
            0% { transform: scale(1, 1); opacity: 1; }
            100% { transform: scale(0.6, 0); opacity: 0; }
        }

        /* Name of whoever planted it, shown for a moment */
        .plant-tag {
            position: absolute;
            left: 50%;
            bottom: 104%;
            max-width: 34vmin;
            padding: 0.5vmin 1.8vmin;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid rgba(0, 0, 0, 0.12);
            box-sizing: border-box;
            color: #24452b;
            font-size: 2.6vmin;
            line-height: 1.3;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            animation: tag-show 3.2s ease both;
        }

        @keyframes tag-show {
            0% { transform: translate(-50%, 1vmin) scale(0.6); opacity: 0; }
            8% { transform: translate(-50%, 0) scale(1); opacity: 1; }
            80% { transform: translate(-50%, 0) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -1vmin) scale(0.9); opacity: 0; }
        }

        .sparkle {
            position: absolute;
            left: 0;
            top: 0;
            font-size: 3.6vmin;
            line-height: 1;
            pointer-events: none;
            animation: sparkle-float 1.6s ease-out both;
        }

        @keyframes sparkle-float {
            0% { transform: translate(var(--x), var(--y)) scale(0.3); opacity: 0; }
            20% { transform: translate(var(--x), var(--y)) scale(1); opacity: 1; }
            100% { transform: translate(var(--x), calc(var(--y) - 12vmin)) scale(0.5) rotate(120deg); opacity: 0; }
        }

        .butterfly {
            position: absolute;
            left: 0;
            top: 0;
            font-size: 6.5vmin;
            line-height: 1;
            animation: butterfly-flight 9s linear both;
        }

        .butterfly span {
            display: block;
            animation: butterfly-flap 0.35s ease-in-out infinite alternate;
        }

        @keyframes butterfly-flight {
            0% { transform: translate(-12vmin, var(--y)) rotate(10deg); }
            25% { transform: translate(25vw, calc(var(--y) + 7vh)) rotate(-8deg); }
            50% { transform: translate(50vw, calc(var(--y) - 6vh)) rotate(12deg); }
            75% { transform: translate(75vw, calc(var(--y) + 8vh)) rotate(-10deg); }
            100% { transform: translate(calc(100vw + 12vmin), var(--y)) rotate(8deg); }
        }

        @keyframes butterfly-flap {
            0% { transform: scaleX(1); }
            100% { transform: scaleX(0.55); }
        }

        #weather-system {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #sun {
            position: absolute;
            top: 4vmin;
            right: 5vmin;
            font-size: 15vmin;
            line-height: 1;
            animation: sun-shine 5s ease-in-out infinite alternate;
        }

        @keyframes sun-shine {
            0% { transform: scale(1) rotate(-6deg); }
            100% { transform: scale(1.08) rotate(6deg); }
        }

        .cloud {
            position: absolute;
            left: 0;
            font-size: 14vmin;
            line-height: 1;
            opacity: 0.92;
            animation: cloud-drift 90s linear infinite;
        }

        @keyframes cloud-drift {
            0% { transform: translateX(-20vmin); }
            100% { transform: translateX(calc(100vw + 6vmin)); }
        }

        .rain-drop {
            position: absolute;
            left: 0;
            top: 0;
            width: 0.7vmin;
            height: 4vmin;
            border-radius: 999px;
            background: rgba(190, 228, 255, 0.85);
            animation: rain-fall 0.9s linear both;
        }

        @keyframes rain-fall {
            0% { transform: translate(var(--x), -6vh); }
            100% { transform: translate(calc(var(--x) - 4vw), 104vh); }
        }

        /* The one thing viewers need to know: what to type */
        #hint {
            position: absolute;
            top: 5vmin;
            left: 5vmin;
            padding: 1vmin 2.8vmin 1vmin 2vmin;
            border-radius: 999px;
            background: rgba(20, 40, 30, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.28);
            font-size: 4vmin;
            line-height: 1.3;
            font-weight: 800;
            white-space: nowrap;
            transition: opacity 0.3s ease;
        }

        #hint.swap {
            opacity: 0;
        }

        #hint-emoji {
            display: inline-block;
            margin-right: 1.4vmin;
        }

        @media (orientation: portrait) {
            #garden-ground {
                height: 60%;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="weather-system">
            <div class="cloud" style="top: 3%; animation-delay: -20s;">☁️</div>
            <div class="cloud" style="top: 17%; animation-delay: -62s; font-size: 10vmin;">☁️</div>
            <div class="cloud" style="top: 8%; animation-delay: -84s; font-size: 8vmin;">☁️</div>
            <div id="sun">☀️</div>
        </div>

        <div id="garden-ground">
            <div class="hill hill-back"></div>
            <div class="hill hill-mid"></div>
            <div class="hill hill-front"></div>
            <div id="plants"></div>
        </div>

        <div id="effects"></div>

        <div id="hint"><span id="hint-emoji">🌸</span><span id="hint-word">flower</span></div>
    </div>

    <script>
        // URL parameters
        const urlParams = new URLSearchParams(window.location.search);
    var chatRelay = SocialStreamLocalServer.getChatRelayConfig(urlParams);
        const sessionId = urlParams.get('session') || urlParams.get('room') || 'test';
        const password = urlParams.get('password') || 'false';

        // Apply theme settings
        if (urlParams.has('chroma')) {
            document.body.classList.add('chroma');
        } else if (urlParams.has('darkmode')) {
            document.body.classList.add('darkmode');
        }
        if (urlParams.has('transparent')) {
            document.body.classList.add('transparent');
        }

        // Game state
        let gameState = {
            plants: [],
            totalPlants: 0,
            gardeners: new Set(),
            weatherState: 'sunny'
        };

        const MAX_PLANTS = 60; // keep OBS rendering smooth during chat floods
        const PLANT_LIFETIME = 150000;

        // Plant definitions
        const plantTypes = {
            // Flowers
            flower: { emoji: '🌸', type: 'flower', size: 'medium', growthTime: 1500 },
            rose: { emoji: '🌹', type: 'flower', size: 'medium', growthTime: 2000 },
            tulip: { emoji: '🌷', type: 'flower', size: 'medium', growthTime: 1800 },
            sunflower: { emoji: '🌻', type: 'flower', size: 'large', growthTime: 2500 },
            daisy: { emoji: '🌼', type: 'flower', size: 'small', growthTime: 1200 },
            hibiscus: { emoji: '🌺', type: 'flower', size: 'medium', growthTime: 2200 },
            
            // Trees
            tree: { emoji: '🌳', type: 'tree', size: 'large', growthTime: 3000 },
            palm: { emoji: '🌴', type: 'tree', size: 'large', growthTime: 3500 },
            pine: { emoji: '🌲', type: 'tree', size: 'large', growthTime: 3200 },
            cherry: { emoji: '🌸', type: 'tree', size: 'large', growthTime: 2800 },
            
            // Bushes and others
            bush: { emoji: '🌿', type: 'bush', size: 'medium', growthTime: 1800 },
            grass: { emoji: '🌱', type: 'grass', size: 'small', growthTime: 800 },
            herb: { emoji: '🌾', type: 'grass', size: 'small', growthTime: 1000 },
            fern: { emoji: '🌿', type: 'bush', size: 'medium', growthTime: 1600 },
            
            // Special plants
            cactus: { emoji: '🌵', type: 'special', size: 'medium', growthTime: 4000 },
            mushroom: { emoji: '🍄', type: 'special', size: 'small', growthTime: 1500 },
            bamboo: { emoji: '🎋', type: 'special', size: 'large', growthTime: 2000 }
        };

        // Weather patterns
        const weatherTypes = {
            sunny: { icon: '☀️', effect: 'growth', multiplier: 1.2 },
            rainy: { icon: '🌧️', effect: 'water', multiplier: 1.5 },
            cloudy: { icon: '☁️', effect: 'neutral', multiplier: 1.0 },
            stormy: { icon: '⛈️', effect: 'dramatic', multiplier: 0.8 }
        };

        // Extract plant names from text
        function extractPlants(text) {
            const foundPlants = [];
            const words = text.toLowerCase().split(/\s+/);
            
            words.forEach(word => {
                // Direct plant matches
                if (plantTypes[word]) {
                    foundPlants.push(word);
                }
                // Plant variations
                else if (/^flowers?$/.test(word) && !foundPlants.includes('flower')) foundPlants.push('flower');
                else if (/^trees?$/.test(word) && !foundPlants.includes('tree')) foundPlants.push('tree');
                else if (/^roses?$/.test(word) && !foundPlants.includes('rose')) foundPlants.push('rose');
                else if (/^grass(es)?$/.test(word) && !foundPlants.includes('grass')) foundPlants.push('grass');
                else if (/^plants?$/.test(word)) foundPlants.push('flower'); // Generic plant becomes flower
            });
            
            return foundPlants;
        }

        // Find a spot on the ground that is not already crowded
        function getPlantPosition() {
            let best = null;
            let bestGap = -1;

            for (let attempt = 0; attempt < 8; attempt++) {
                const candidate = {
                    left: Math.random() * 90 + 5,
                    depth: Math.random()
                };

                let gap = Infinity;
                gameState.plants.forEach(plant => {
                    const dx = candidate.left - plant.left;
                    const dy = (candidate.depth - plant.depth) * 60;
                    gap = Math.min(gap, Math.sqrt(dx * dx + dy * dy));
                });

                if (gap > bestGap) {
                    bestGap = gap;
                    best = candidate;
                }
            }

            return best;
        }

        function removePlant(entry) {
            if (entry.removed) return;
            entry.removed = true;
            gameState.plants = gameState.plants.filter(p => p !== entry);
            entry.element.classList.add('wilt');
            setTimeout(() => {
                if (entry.element.parentNode) {
                    entry.element.parentNode.removeChild(entry.element);
                }
            }, 800);
        }

        // Create plant element
        function createPlant(plantName, username, messageLength) {
            const plantConfig = plantTypes[plantName];
            const position = getPlantPosition();

            // depth 0 is the far side of the garden, 1 is right at the front
            const depthScale = 0.6 + position.depth * 0.45;
            const sizeMultiplier = Math.min(1 + (messageLength / 120), 1.4);
            let fontSize = 10;
            if (plantConfig.size === 'small') fontSize = 7;
            else if (plantConfig.size === 'large') fontSize = 14;

            const plant = document.createElement('div');
            plant.className = `plant plant-${plantConfig.type}`;
            plant.style.left = position.left + '%';
            plant.style.bottom = (4 + (1 - position.depth) * 70) + '%';
            plant.style.fontSize = (fontSize * sizeMultiplier * depthScale) + 'vmin';
            plant.style.zIndex = String(10 + Math.round(position.depth * 100));

            const body = document.createElement('div');
            body.className = 'plant-body';
            body.textContent = plantConfig.emoji;
            body.style.animationDelay = '0s, ' + (0.9 + Math.random() * 1.5) + 's';
            plant.appendChild(body);

            const tag = document.createElement('div');
            tag.className = 'plant-tag';
            tag.textContent = username;
            plant.appendChild(tag);
            setTimeout(() => {
                if (tag.parentNode) tag.parentNode.removeChild(tag);
            }, 3200);

            document.getElementById('plants').appendChild(plant);

            // Cap simultaneous plants so the garden never turns into a hedge
            while (gameState.plants.length >= MAX_PLANTS) {
                removePlant(gameState.plants[0]);
            }

            const entry = {
                element: plant,
                name: plantName,
                left: position.left,
                depth: position.depth,
                removed: false
            };
            gameState.plants.push(entry);
            gameState.totalPlants++;

            createSparkles(plant);

            // Old plants make room for new ones
            setTimeout(() => removePlant(entry), PLANT_LIFETIME);
        }

        // A few sparkles rise from a freshly planted spot
        function createSparkles(plantElement) {
            const rect = plantElement.getBoundingClientRect();
            for (let i = 0; i < 3; i++) {
                setTimeout(() => {
                    const sparkle = document.createElement('div');
                    sparkle.className = 'sparkle';
                    sparkle.textContent = '✨';
                    sparkle.style.setProperty('--x', (rect.left + Math.random() * rect.width) + 'px');
                    sparkle.style.setProperty('--y', (rect.top + Math.random() * rect.height * 0.5) + 'px');

                    document.getElementById('effects').appendChild(sparkle);

                    setTimeout(() => sparkle.remove(), 1600);
                }, 300 + i * 180);
            }
        }

        // Create butterfly
        function createButterfly() {
            if (document.querySelectorAll('.butterfly').length >= 3) return;

            const butterfly = document.createElement('div');
            butterfly.className = 'butterfly';
            butterfly.style.setProperty('--y', (window.innerHeight * (0.3 + Math.random() * 0.3)) + 'px');
            const wings = document.createElement('span');
            wings.textContent = '🦋';
            butterfly.appendChild(wings);

            document.getElementById('effects').appendChild(butterfly);

            setTimeout(() => butterfly.remove(), 9000);
        }

        // Create rain effect
        function createRain() {
            for (let i = 0; i < 40; i++) {
                setTimeout(() => {
                    const drop = document.createElement('div');
                    drop.className = 'rain-drop';
                    drop.style.setProperty('--x', (Math.random() * (window.innerWidth * 1.05)) + 'px');

                    document.getElementById('weather-system').appendChild(drop);

                    setTimeout(() => drop.remove(), 900);
                }, i * 90);
            }
        }

        // Update weather
        function updateWeather() {
            const weatherKeys = Object.keys(weatherTypes);
            const newWeather = weatherKeys[Math.floor(Math.random() * weatherKeys.length)];

            if (newWeather !== gameState.weatherState) {
                gameState.weatherState = newWeather;
                const weather = weatherTypes[newWeather];

                document.getElementById('sun').textContent = weather.icon;

                if (newWeather === 'rainy' || newWeather === 'stormy') {
                    createRain();
                }
            }
        }

        // Cycle the hint through the plants chat can grow
        const hintPlants = ['flower', 'tree', 'rose', 'sunflower', 'cactus', 'tulip', 'palm', 'mushroom', 'daisy', 'pine', 'bamboo', 'grass'];
        let hintIndex = 0;
        function updateHint() {
            const hint = document.getElementById('hint');
            hint.classList.add('swap');
            setTimeout(() => {
                hintIndex = (hintIndex + 1) % hintPlants.length;
                const name = hintPlants[hintIndex];
                document.getElementById('hint-emoji').textContent = plantTypes[name].emoji;
                document.getElementById('hint-word').textContent = name;
                hint.classList.remove('swap');
            }, 300);
        }

        function stripHtml(html) {
            // Keep the existing div parsing context inside inert template content.
            const template = document.createElement('template');
            const tmp = template.content.appendChild(document.createElement('div'));
            tmp.innerHTML = html;
            return tmp.textContent || tmp.innerText || '';
        }

        // Process incoming message
        function processData(data) {
            // Handle different data formats from Social Stream
            if (data && data.content) {
                data = data.content;
            }

            if (!data || !data.chatmessage || !data.chatname) return;

            const username = stripHtml(data.chatname);
            let message = data.chatmessage;
            // Preserve the chatmessage format: textonly=true is literal text, without HTML parsing/filtering; false/missing permits HTML checked at its ingress boundary.
            if (!data.textonly) {
                message = stripHtml(message);
            }
            const foundPlants = extractPlants(message);

            if (foundPlants.length === 0) return;

            if (gameState.gardeners.size >= 500) {
                gameState.gardeners = new Set(Array.from(gameState.gardeners).slice(-250));
            }
            gameState.gardeners.add(username);

            foundPlants.slice(0, 5).forEach(plantName => {
                createPlant(plantName, username, message.length);
            });

            // Random butterfly spawn
            if (Math.random() < 0.12) {
                createButterfly();
            }
        }

        // Setup iframe communication
        if (!urlParams.has('demo') && !chatRelay.enabled) {
            const iframe = document.createElement("iframe");
            iframe.src = `https://vdo.socialstream.ninja/?ln&salt=vdo.ninja&notmobile&password=${encodeURIComponent(password)}&solo&view=${encodeURIComponent(sessionId)}&novideo&noaudio&label=dock&cleanoutput&room=${encodeURIComponent(sessionId)}`;
            iframe.style.width = "0px";
            iframe.style.height = "0px";
            iframe.style.position = "fixed";
            iframe.style.left = "-100px";
            iframe.style.top = "-100px";
            iframe.id = "frame1";
            document.body.appendChild(iframe);
            
            // Listen for messages
            window.addEventListener("message", function(e) {
                if (e.source !== iframe.contentWindow) return;
                
                if (e.data && typeof e.data === "object" && e.data.dataReceived && typeof e.data.dataReceived === "object") {
                    if ("overlayNinja" in e.data.dataReceived) {
                        processData(e.data.dataReceived.overlayNinja);
                    }
                }
            });
        }

        // Handle WebSocket connection
        if (!urlParams.has('demo') && chatRelay.enabled) {
            const serverUrl = chatRelay.url;
            let socketserver = null;
            let reconnectTimeout = null;

            function connectWebSocket() {
                socketserver = new WebSocket(serverUrl);

                socketserver.onopen = function() {
                    socketserver.send(JSON.stringify({
                        join: sessionId.split(",")[0],
                        out: chatRelay.out, in: chatRelay.in
                    }));
                };

                socketserver.onclose = function() {
                    clearTimeout(reconnectTimeout);
                    reconnectTimeout = setTimeout(connectWebSocket, 5000);
                };

                socketserver.onerror = function() {
                    try { socketserver.close(); } catch (e) {}
                };

                socketserver.onmessage = function(event) {
                    if (event.data) {
                        try {
                            const data = JSON.parse(event.data);
                            processData(data);
                        } catch (e) {
                            console.error('WebSocket parse error:', e);
                        }
                    }
                };
            }

            connectWebSocket();
        }

        // Demo mode
        if (urlParams.has('demo')) {
            const demoPlants = Object.keys(plantTypes);
            const demoGardeners = ['GreenThumb', 'PlantLover', 'GardenMaster', 'FloralQueen', 'TreeHugger'];

            function demoPlant() {
                const plant = demoPlants[Math.floor(Math.random() * demoPlants.length)];
                const gardener = demoGardeners[Math.floor(Math.random() * demoGardeners.length)];
                const messages = [
                    `Beautiful ${plant}!`,
                    `Growing ${plant} here`,
                    `${plant} garden time`,
                    `Let's plant ${plant}`,
                    `${plant} power!`
                ];

                processData({
                    chatname: gardener,
                    chatmessage: messages[Math.floor(Math.random() * messages.length)]
                });
            }

            // Start with a few plants so the garden is not bare, then keep planting
            for (let i = 0; i < 9; i++) {
                setTimeout(demoPlant, 200 + i * 350);
            }
            setInterval(demoPlant, 1800);
        }

        // Update weather periodically
        setInterval(updateWeather, 30000); // Every 30 seconds

        // Rotate the hint
        setInterval(updateHint, 3500);

        // Spawn random butterflies
        setInterval(() => {
            if (Math.random() < 0.3) createButterfly();
        }, 15000);
    </script>
</body>
</html>

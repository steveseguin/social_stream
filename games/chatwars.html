<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Chat Wars: an interactive stream activity for Social Stream Ninja. Connect your chat session and add the game to your OBS scene.">
    <meta name="robots" content="noindex">
<script src="../js/local-server-url.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Wars - Social Stream Ninja</title>
    <link rel="icon" href="../icons/favicon.ico" type="image/x-icon">
    <style>
        /* Hide scrollbars */
        ::-webkit-scrollbar {
            display: none;
        }

        * {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            padding: 0;
            background: #1a1a2e;
            overflow: hidden;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            color: white;
        }

        body.chroma {
            background: #00ff00;
        }

        body.darkmode {
            background: #000000;
        }

        body.transparent {
            background: transparent;
        }

        #game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Team scores */
        #scoreboard {
            position: absolute;
            top: 3vmin;
            left: 0;
            width: 100%;
            text-align: center;
            white-space: nowrap;
        }

        .team-pill {
            position: relative;
            display: inline-block;
            min-width: 17vmin;
            height: 8.4vmin;
            margin: 0 1.2vmin;
            border-radius: 999px;
            border: 1px solid rgba(0, 0, 0, 0.2);
            box-sizing: border-box;
            font-size: 5.4vmin;
            line-height: 8.2vmin;
            font-weight: 900;
            color: #16161d;
            transition: transform 0.3s ease;
        }

        .team-pill.lead {
            transform: scale(1.12);
        }

        .team-pill.lead::after {
            content: '👑';
            position: absolute;
            top: -2.6vmin;
            right: -1.4vmin;
            font-size: 4.4vmin;
            line-height: 1;
            transform: rotate(18deg);
        }

        .team-pill.bump {
            animation: pill-bump 0.4s ease-out;
        }

        @keyframes pill-bump {
            0% { transform: scale(1); }
            40% { transform: scale(1.25); }
            100% { transform: scale(1); }
        }

        /* New recruits float out of their team's score */
        .recruit {
            position: absolute;
            left: 50%;
            top: 100%;
            max-width: 26vmin;
            padding: 0.3vmin 1.8vmin;
            border-radius: 999px;
            border: 1px solid rgba(0, 0, 0, 0.2);
            box-sizing: border-box;
            font-size: 2.8vmin;
            line-height: 1.4;
            font-weight: 800;
            color: #16161d;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            z-index: 30;
            animation: recruit 2.4s ease-out both;
        }

        @keyframes recruit {
            0% { transform: translate(-50%, 0) scale(0.5); opacity: 0; }
            15% { transform: translate(-50%, 1vmin) scale(1); opacity: 1; }
            75% { transform: translate(-50%, 2.4vmin) scale(1); opacity: 1; }
            100% { transform: translate(-50%, 4vmin) scale(0.9); opacity: 0; }
        }

        /* The map */
        #battlefield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .territory {
            position: absolute;
            border-radius: 22%;
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.16);
            box-sizing: border-box;
            transition: background-color 0.3s ease;
        }

        .team-red, .territory.team-red { background-color: #ff5d6c; }
        .team-blue, .territory.team-blue { background-color: #4d8dff; }
        .team-green, .territory.team-green { background-color: #3ddc84; }
        .team-yellow, .territory.team-yellow { background-color: #ffd23f; }

        .territory.team-red,
        .territory.team-blue,
        .territory.team-green,
        .territory.team-yellow {
            border-color: rgba(0, 0, 0, 0.2);
            background-image: linear-gradient(160deg, rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0) 55%);
        }

        .capture-animation {
            animation: capture-pulse 0.5s ease-out;
            z-index: 10;
        }

        @keyframes capture-pulse {
            0% { transform: scale(0.5); }
            55% { transform: scale(1.16); }
            100% { transform: scale(1); }
        }

        .blocked-animation {
            animation: blocked-shake 0.4s ease-in-out;
        }

        @keyframes blocked-shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8%); }
            75% { transform: translateX(8%); }
        }

        .battle-effect {
            position: absolute;
            line-height: 1;
            pointer-events: none;
            z-index: 20;
            animation: battle-explosion 0.8s ease-out both;
        }

        @keyframes battle-explosion {
            0% { transform: translate(-50%, -50%) scale(0.3); opacity: 1; }
            60% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.6); opacity: 0; }
        }

        /* The one thing viewers need to know: what to type */
        #hint {
            position: absolute;
            bottom: 3vmin;
            left: 0;
            width: 100%;
            text-align: center;
        }

        #hint-chip {
            display: inline-block;
            padding: 0.9vmin 2.6vmin;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.22);
            font-size: 3.8vmin;
            line-height: 1.3;
            font-weight: 800;
            white-space: nowrap;
        }

        #hint-chip span {
            margin: 0 1.2vmin;
        }

        .cmd-red { color: #ff7a86; }
        .cmd-blue { color: #74a7ff; }
        .cmd-green { color: #56e59a; }
        .cmd-yellow { color: #ffd95e; }

        /* Winner */
        #victory-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 44vmin;
            height: 44vmin;
            margin: -22vmin 0 0 -22vmin;
            border-radius: 50%;
            border: 1px solid rgba(0, 0, 0, 0.25);
            box-sizing: border-box;
            text-align: center;
            display: none;
            z-index: 200;
            animation: victory-pop 0.6s cubic-bezier(0.2, 1.5, 0.4, 1) both;
        }

        #victory-badge {
            margin-top: 6vmin;
            font-size: 20vmin;
            line-height: 1.1;
        }

        #countdown {
            font-size: 7vmin;
            line-height: 1;
            font-weight: 900;
            color: #16161d;
        }

        @keyframes victory-pop {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="battlefield"></div>

        <div id="scoreboard">
            <div class="team-pill team-red" id="red-pill"><span id="red-count">0</span></div>
            <div class="team-pill team-blue" id="blue-pill"><span id="blue-count">0</span></div>
            <div class="team-pill team-green" id="green-pill"><span id="green-count">0</span></div>
            <div class="team-pill team-yellow" id="yellow-pill"><span id="yellow-count">0</span></div>
        </div>

        <div id="hint">
            <div id="hint-chip"><span class="cmd-red">!red</span><span class="cmd-blue">!blue</span><span class="cmd-green">!green</span><span class="cmd-yellow">!yellow</span></div>
        </div>

        <div id="victory-screen">
            <div id="victory-badge">🏆</div>
            <div id="countdown">10</div>
        </div>
    </div>

    <script>
        // URL parameters
        const urlParams = new URLSearchParams(window.location.search);
    var chatRelay = SocialStreamLocalServer.getChatRelayConfig(urlParams);
        const sessionId = urlParams.get('session') || urlParams.get('room') || 'test';
        const password = urlParams.get('password') || 'false';

        // Apply theme settings
        if (urlParams.has('chroma')) {
            document.body.classList.add('chroma');
        } else if (urlParams.has('darkmode')) {
            document.body.classList.add('darkmode');
        }
        if (urlParams.has('transparent')) {
            document.body.classList.add('transparent');
        }

        // Map size (drawn 11 wide in landscape, 11 tall in portrait)
        const MAP_LONG = 11;
        const MAP_SHORT = 6;
        const CAPTURE_COOLDOWN = 500; // ms between captures per team, so a chat flood cannot end a battle instantly

        // Game state
        let gameState = {
            territories: [],
            teams: {
                red: { players: new Set(), territories: 0, power: 0, lastCapture: 0, home: [0, 0] },
                blue: { players: new Set(), territories: 0, power: 0, lastCapture: 0, home: [MAP_LONG - 1, 0] },
                green: { players: new Set(), territories: 0, power: 0, lastCapture: 0, home: [0, MAP_SHORT - 1] },
                yellow: { players: new Set(), territories: 0, power: 0, lastCapture: 0, home: [MAP_LONG - 1, MAP_SHORT - 1] }
            },
            totalTerritories: MAP_LONG * MAP_SHORT,
            battleActive: true,
            lastCaptureTime: Date.now()
        };

        const teamColors = ['red', 'blue', 'green', 'yellow'];

        function stripHtml(html) {
            const tmp = document.createElement('template').content.appendChild(document.createElement('div'));
            tmp.innerHTML = html;
            return tmp.textContent || tmp.innerText || '';
        }

        // Fit the map into the space between the scores and the hint
        function layoutBattlefield() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            const unit = Math.min(width, height) / 100;
            const portrait = height > width;
            const cols = portrait ? MAP_SHORT : MAP_LONG;
            const rows = portrait ? MAP_LONG : MAP_SHORT;

            const areaLeft = unit * 3;
            const areaTop = unit * 16;
            const areaWidth = width - unit * 6;
            const areaHeight = height - areaTop - unit * 12.5;
            const cell = Math.max(4, Math.min(areaWidth / cols, areaHeight / rows));
            const gap = cell * 0.08;
            const offsetX = areaLeft + (areaWidth - cell * cols) / 2;
            const offsetY = areaTop + (areaHeight - cell * rows) / 2;

            gameState.territories.forEach(territory => {
                const col = portrait ? territory.y : territory.x;
                const row = portrait ? territory.x : territory.y;
                const style = territory.element.style;
                style.left = (offsetX + col * cell + gap / 2) + 'px';
                style.top = (offsetY + row * cell + gap / 2) + 'px';
                style.width = (cell - gap) + 'px';
                style.height = (cell - gap) + 'px';
            });

            gameState.cellSize = cell;
        }

        // Initialize battlefield
        function initBattlefield() {
            const battlefield = document.getElementById('battlefield');
            while (battlefield.firstChild) {
                battlefield.removeChild(battlefield.firstChild);
            }
            gameState.territories = [];

            for (let i = 0; i < gameState.totalTerritories; i++) {
                const territory = document.createElement('div');
                territory.className = 'territory';
                battlefield.appendChild(territory);

                gameState.territories.push({
                    id: i,
                    x: i % MAP_LONG,
                    y: Math.floor(i / MAP_LONG),
                    team: null,
                    element: territory
                });
            }

            // Reset teams
            Object.values(gameState.teams).forEach(team => {
                team.territories = 0;
                team.power = 0;
                team.lastCapture = 0;
            });

            layoutBattlefield();
            updateDisplay();
        }

        // Calculate team power based on recent activity
        function updateTeamPower() {
            Object.values(gameState.teams).forEach(team => {
                // Decay power over time
                team.power *= 0.99;
            });
        }

        function getTerritory(x, y) {
            if (x < 0 || y < 0 || x >= MAP_LONG || y >= MAP_SHORT) return null;
            return gameState.territories[y * MAP_LONG + x];
        }

        function pickRandom(list) {
            return list[Math.floor(Math.random() * list.length)];
        }

        // Work out where a team can push next: empty land beside its own first, then its neighbours
        function findTarget(teamName) {
            const team = gameState.teams[teamName];
            const open = [];
            const enemy = [];

            gameState.territories.forEach(territory => {
                if (territory.team !== teamName) return;
                [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(step => {
                    const next = getTerritory(territory.x + step[0], territory.y + step[1]);
                    if (!next || next.team === teamName) return;
                    if (next.team === null) {
                        if (open.indexOf(next) === -1) open.push(next);
                    } else if (enemy.indexOf(next) === -1) {
                        enemy.push(next);
                    }
                });
            });

            if (open.length > 0) return pickRandom(open);
            if (enemy.length > 0) return pickRandom(enemy);

            // No land yet (or wiped out): start from the tile nearest the team's corner
            if (team.territories === 0) {
                const distance = t => Math.abs(t.x - team.home[0]) + Math.abs(t.y - team.home[1]);
                const free = gameState.territories.filter(t => t.team === null);
                const pool = free.length > 0 ? free : gameState.territories.filter(t => t.team !== teamName);
                pool.sort((a, b) => distance(a) - distance(b));
                return pool[0] || null;
            }

            return null;
        }

        // Capture territory
        function captureTerritory(teamName, guaranteed) {
            if (!gameState.battleActive) return;

            const team = gameState.teams[teamName];
            if (!team || team.players.size === 0) return;

            const now = Date.now();
            if (now - team.lastCapture < CAPTURE_COOLDOWN) return;

            const targetTerritory = findTarget(teamName);
            if (!targetTerritory) return;

            const oldTeam = targetTerritory.team;
            let chance;
            if (oldTeam) {
                // Taking land from a rival depends on which team is more active
                const rival = gameState.teams[oldTeam];
                chance = Math.max(0.2, Math.min(0.85, team.power / (team.power + rival.power + 0.01)));
            } else {
                chance = Math.min(0.9, 0.35 + team.power / 20);
            }

            if (!guaranteed && Math.random() >= chance) {
                if (oldTeam) {
                    team.lastCapture = now;
                    targetTerritory.element.classList.add('blocked-animation');
                    setTimeout(() => {
                        targetTerritory.element.classList.remove('blocked-animation');
                    }, 400);
                }
                return;
            }

            team.lastCapture = now;
            gameState.lastCaptureTime = now;

            // Update territory ownership
            if (oldTeam) {
                gameState.teams[oldTeam].territories--;
                targetTerritory.element.classList.remove(`team-${oldTeam}`);
                createBattleEffect(targetTerritory.element);
            }

            targetTerritory.team = teamName;
            targetTerritory.element.classList.add(`team-${teamName}`);
            targetTerritory.element.classList.add('capture-animation');
            team.territories++;

            // Remove animation class
            setTimeout(() => {
                targetTerritory.element.classList.remove('capture-animation');
            }, 500);

            updateDisplay();
            checkVictory();
        }

        // Create battle effect
        function createBattleEffect(element) {
            const effect = document.createElement('div');
            effect.className = 'battle-effect';
            effect.textContent = '💥';
            effect.style.left = (element.offsetLeft + element.offsetWidth / 2) + 'px';
            effect.style.top = (element.offsetTop + element.offsetHeight / 2) + 'px';
            effect.style.fontSize = (element.offsetWidth * 0.8) + 'px';

            document.getElementById('battlefield').appendChild(effect);

            setTimeout(() => {
                if (effect.parentNode) {
                    effect.parentNode.removeChild(effect);
                }
            }, 800);
        }

        function bumpPill(teamName) {
            const pill = document.getElementById(`${teamName}-pill`);
            pill.classList.remove('bump');
            void pill.offsetWidth;
            pill.classList.add('bump');
        }

        // Show who just joined a team
        function showRecruit(teamName, username) {
            const pill = document.getElementById(`${teamName}-pill`);
            if (pill.querySelectorAll('.recruit').length >= 2) return;

            const tag = document.createElement('div');
            tag.className = `recruit team-${teamName}`;
            tag.textContent = username;
            pill.appendChild(tag);
            bumpPill(teamName);

            setTimeout(() => {
                if (tag.parentNode) tag.parentNode.removeChild(tag);
            }, 2400);
        }

        // Update display
        function updateDisplay() {
            let best = 0;
            Object.values(gameState.teams).forEach(team => {
                best = Math.max(best, team.territories);
            });

            Object.entries(gameState.teams).forEach(([teamName, team]) => {
                document.getElementById(`${teamName}-count`).textContent = team.territories;
                const pill = document.getElementById(`${teamName}-pill`);
                if (best > 0 && team.territories === best) {
                    pill.classList.add('lead');
                } else {
                    pill.classList.remove('lead');
                }
            });
        }

        // Check victory condition
        function checkVictory() {
            if (!gameState.battleActive) return;

            const winThreshold = Math.floor(gameState.totalTerritories * 0.5); // 50% to win

            for (const [teamName, team] of Object.entries(gameState.teams)) {
                if (team.territories >= winThreshold) {
                    gameState.battleActive = false;
                    showVictory(teamName);
                    break;
                }
            }
        }

        // Show victory screen
        function showVictory(winningTeam) {
            const victoryScreen = document.getElementById('victory-screen');

            // The winner sweeps the rest of the map
            gameState.territories.forEach((territory, index) => {
                setTimeout(() => {
                    if (gameState.battleActive) return;
                    teamColors.forEach(name => territory.element.classList.remove(`team-${name}`));
                    territory.element.classList.add(`team-${winningTeam}`);
                }, 300 + index * 18);
            });

            victoryScreen.style.backgroundColor = getTeamColor(winningTeam);
            victoryScreen.style.display = 'block';

            // Countdown to next battle
            let countdown = 10;
            const countdownElement = document.getElementById('countdown');
            countdownElement.textContent = countdown;

            const countdownInterval = setInterval(() => {
                countdown--;
                countdownElement.textContent = countdown;

                if (countdown <= 0) {
                    clearInterval(countdownInterval);
                    victoryScreen.style.display = 'none';
                    startNewBattle();
                }
            }, 1000);
        }

        // Get team color
        function getTeamColor(teamName) {
            const colors = {
                red: '#ff5d6c',
                blue: '#4d8dff',
                green: '#3ddc84',
                yellow: '#ffd23f'
            };
            return colors[teamName] || '#ffffff';
        }

        // Start new battle
        function startNewBattle() {
            gameState.battleActive = true;
            gameState.lastCaptureTime = Date.now();

            // Clear players but keep some for continuity
            Object.values(gameState.teams).forEach(team => {
                const players = Array.from(team.players);
                team.players.clear();
                // Keep 30% of most recent players (max 200) for next battle
                const keep = Math.min(200, Math.ceil(players.length * 0.3));
                players.slice(-keep).forEach(player => {
                    team.players.add(player);
                });
            });

            initBattlefield();
        }

        // Process incoming message
        function processData(data) {
            // Captions are the host's own speech shown as text. They are not chat to take part with.
            if (data && (data.content || data).type === "captions") return;
            if (!gameState.battleActive) return;

            // Handle different data formats from Social Stream
            if (data && data.content) {
                data = data.content;
            }
            
            if (!data || !data.chatmessage || !data.chatname) return;

            let rawMessage = data.chatmessage;
            // Preserve the chatmessage format: textonly=true is literal text, without HTML parsing/filtering; false/missing permits HTML checked at its ingress boundary.
            if (!data.textonly) {
                rawMessage = stripHtml(rawMessage);
            }
            const message = rawMessage.toLowerCase().trim();
            const username = String(data.chatname);
            const playerKey = JSON.stringify([data.type || '', String(data.userid || data.username || data.chatname)]);

            // Check for team join commands
            const teamMatch = message.match(/^!(red|blue|green|yellow)$/);
            if (teamMatch) {
                const newTeam = teamMatch[1];
                const alreadyThere = gameState.teams[newTeam].players.has(playerKey);

                // Remove player from all teams
                Object.values(gameState.teams).forEach(team => {
                    team.players.delete(playerKey);
                });

                // Add to new team (cap roster at 200, keeping most recent)
                if (gameState.teams[newTeam].players.size >= 200) {
                    gameState.teams[newTeam].players = new Set(Array.from(gameState.teams[newTeam].players).slice(-100));
                }
                gameState.teams[newTeam].players.add(playerKey);

                if (!alreadyThere) {
                    showRecruit(newTeam, stripHtml(username));
                }

                // A team's first recruit plants its flag straight away
                gameState.teams[newTeam].power += 1;
                captureTerritory(newTeam, gameState.teams[newTeam].territories === 0);

                return;
            }

            // Find player's team and push for more territory
            for (const [teamName, team] of Object.entries(gameState.teams)) {
                if (team.players.has(playerKey)) {
                    team.power += 1;
                    captureTerritory(teamName);
                    break;
                }
            }
        }

        // Setup iframe communication
        if (!urlParams.has('demo') && !chatRelay.enabled) {
            const iframe = document.createElement("iframe");
            iframe.src = `https://vdo.socialstream.ninja/?ln&salt=vdo.ninja&notmobile&password=${encodeURIComponent(password)}&solo&view=${encodeURIComponent(sessionId)}&novideo&noaudio&label=dock&cleanoutput&room=${encodeURIComponent(sessionId)}`;
            iframe.style.width = "0px";
            iframe.style.height = "0px";
            iframe.style.position = "fixed";
            iframe.style.left = "-100px";
            iframe.style.top = "-100px";
            iframe.id = "frame1";
            document.body.appendChild(iframe);
            
            // Listen for messages
            window.addEventListener("message", function(e) {
                if (e.source !== iframe.contentWindow) return;
                
                if (e.data && typeof e.data === "object" && e.data.dataReceived && typeof e.data.dataReceived === "object") {
                    if ("overlayNinja" in e.data.dataReceived) {
                        processData(e.data.dataReceived.overlayNinja);
                    }
                }
            });
        }

        // Handle WebSocket connection
        if (!urlParams.has('demo') && chatRelay.enabled) {
            const serverUrl = chatRelay.url;
            let socketserver = null;
            let reconnectTimeout = null;

            function connectWebSocket() {
                socketserver = new WebSocket(serverUrl);

                socketserver.onopen = function() {
                    socketserver.send(JSON.stringify({
                        join: sessionId.split(",")[0],
                        out: chatRelay.out, in: chatRelay.in
                    }));
                };

                socketserver.onclose = function() {
                    clearTimeout(reconnectTimeout);
                    reconnectTimeout = setTimeout(connectWebSocket, 5000);
                };

                socketserver.onerror = function() {
                    try { socketserver.close(); } catch (e) {}
                };

                socketserver.onmessage = function(event) {
                    if (event.data) {
                        try {
                            const data = JSON.parse(event.data);
                            processData(data);
                        } catch (e) {
                            console.error('WebSocket parse error:', e);
                        }
                    }
                };
            }

            connectWebSocket();
        }

        // Demo mode
        if (urlParams.has('demo')) {
            const demoPlayers = ['Alice', 'Bob', 'Charlie', 'Diana', 'Eve', 'Frank', 'Grace', 'Henry'];

            // Demo players pick a team the same way real chatters do
            function demoJoin() {
                demoPlayers.forEach((player, index) => {
                    setTimeout(() => {
                        processData({
                            chatname: player,
                            chatmessage: '!' + (index < 4 ? teamColors[index] : pickRandom(teamColors))
                        });
                    }, 150 + index * 250);
                });
            }
            demoJoin();

            let demoWasActive = true;
            setInterval(() => {
                if (!gameState.battleActive) {
                    demoWasActive = false;
                    return;
                }
                if (!demoWasActive) {
                    demoWasActive = true;
                    demoJoin();
                    return;
                }

                const messages = ['attack!', 'charge!', 'defend!', 'victory!', 'go team!'];

                processData({
                    chatname: pickRandom(demoPlayers),
                    chatmessage: pickRandom(messages)
                });
            }, 260);
        }

        // Update team power periodically
        setInterval(updateTeamPower, 100);

        // Keep the map fitted to the window
        window.addEventListener('resize', layoutBattlefield);

        // Initialize game
        initBattlefield();
    </script>
</body>
</html>

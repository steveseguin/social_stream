<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Treasure Hunt: an interactive stream activity for Social Stream Ninja. Connect your chat session and add the game to your OBS scene.">
    <meta name="robots" content="noindex">
<script src="../js/local-server-url.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treasure Hunt - Social Stream Ninja</title>
    <link rel="icon" href="../favicon.ico" />
    <link rel="preload" href="../thirdparty/NotoColorEmoji.ttf" as="font" type="font/ttf" crossorigin>
    <style>
        /* Hide scrollbars */
        ::-webkit-scrollbar {
            display: none;
        }

        * {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
            box-sizing: border-box;
        }

        @font-face {
            font-family: 'NotoColorEmoji';
            src: url('../thirdparty/NotoColorEmoji.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a5490 0%, #2e86ab 100%);
            overflow: hidden;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'NotoColorEmoji', sans-serif;
            color: white;
        }

        body.transparent {
            background: transparent;
        }

        #game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .portrait #game-container {
            flex-direction: column;
        }

        /* The map is sized from script; 1em inside it is one grid square */
        #map {
            position: relative;
            flex: none;
            display: grid;
            grid-template-columns: 0.7fr repeat(10, 1fr);
            grid-template-rows: 0.7fr repeat(10, 1fr);
            grid-gap: 0.07em;
            padding: 0.22em;
            background: #f0d9ac;
            border: 1px solid rgba(0, 0, 0, 0.2);
            border-radius: 0.5em;
            box-shadow: 0 0.12em 0.4em rgba(0, 0, 0, 0.25);
            color: #5b3d17;
        }

        .map-head {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.5em;
            font-weight: 800;
            line-height: 1;
        }

        .grid-cell {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #dcb373;
            border-radius: 0.16em;
            line-height: 1;
        }

        .grid-cell .mark {
            font-size: 0.58em;
        }

        .revealed {
            background: #b98d52;
            animation: reveal 0.4s ease-out;
        }

        .revealed.t-hot { background: #f0604d; }
        .revealed.t-warm { background: #f59a3c; }
        .revealed.t-mild { background: #f2cd55; }
        .revealed.t-cold { background: #7fc3ea; }

        @keyframes reveal {
            0% { transform: scale(0.4); }
            60% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        .revealed.treasure {
            background: #fff3c4;
        }

        .treasure .mark {
            font-size: 0.72em;
            animation: shimmer 1.4s ease-in-out infinite alternate;
        }

        @keyframes shimmer {
            0% { transform: scale(0.9); }
            100% { transform: scale(1.08); }
        }

        .last-dig:after {
            content: '';
            position: absolute;
            top: -0.05em;
            left: -0.05em;
            right: -0.05em;
            bottom: -0.05em;
            border: 0.07em solid #fff;
            border-radius: 0.2em;
        }

        /* The clue: the highlighted squares hold the treasure shown on the badge */
        #hint-zone {
            position: absolute;
            display: none;
            border: 0.07em dashed #fff;
            border-radius: 0.24em;
            background: rgba(255, 255, 255, 0.22);
            pointer-events: none;
        }

        #hint-zone .zone-badge {
            position: absolute;
            top: -0.3em;
            left: -0.3em;
            width: 0.86em;
            height: 0.86em;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #fff;
            border: 1px solid rgba(0, 0, 0, 0.2);
            line-height: 1;
        }

        #hint-zone .zone-badge span {
            font-size: 0.5em;
        }

        .treasure-found {
            position: absolute;
            top: 50%;
            left: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            animation: treasureFound 2.2s ease-out forwards;
        }

        .treasure-found .found-emoji {
            font-size: 3.4em;
            line-height: 1.1;
        }

        .treasure-found .found-name {
            max-width: 8em;
            padding: 0.1em 0.5em;
            border-radius: 1em;
            background: rgba(20, 24, 40, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #fff;
            font-size: 0.56em;
            font-weight: 800;
            line-height: 1.35;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        @keyframes treasureFound {
            0% {
                transform: translate(-50%, -50%) scale(0.2);
                opacity: 0;
            }
            20% {
                transform: translate(-50%, -50%) scale(1.1);
                opacity: 1;
            }
            80% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(1.15);
                opacity: 0;
            }
        }

        #info, #side {
            flex: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 38vmin;
        }

        #info {
            margin-right: 3vmin;
        }

        #side {
            margin-left: 3vmin;
        }

        .portrait #info, .portrait #side {
            width: 94vmin;
            margin: 0;
        }

        .portrait #info {
            flex-direction: row;
            justify-content: space-between;
            margin-bottom: 4vmin;
            padding: 0 2vmin;
        }

        .portrait #side {
            margin-top: 4vmin;
        }

        #treasures-left {
            display: flex;
        }

        .slot {
            width: 11vmin;
            height: 11vmin;
            margin: 0 0.7vmin;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(20, 24, 40, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 6vmin;
            line-height: 1;
        }

        .slot span {
            opacity: 0.4;
            filter: grayscale(1);
        }

        .slot.found {
            background: #fff3c4;
            animation: reveal 0.5s ease-out;
        }

        .slot.found span {
            opacity: 1;
            filter: none;
        }

        .compass {
            position: relative;
            width: 24vmin;
            height: 24vmin;
            margin-top: 5vmin;
            border-radius: 50%;
            background: #f7f3e8;
            border: 1.6vmin solid #8a6a3a;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .portrait .compass {
            width: 26vmin;
            height: 26vmin;
            margin-top: 0;
        }

        .portrait .slot {
            width: 14vmin;
            height: 14vmin;
            font-size: 7.6vmin;
        }

        .compass:before {
            content: '';
            position: absolute;
            width: 12%;
            height: 12%;
            border-radius: 50%;
            background: #8a6a3a;
            z-index: 2;
        }

        .compass-needle {
            position: absolute;
            width: 74%;
            height: 12%;
            border-radius: 1vmin;
            background: linear-gradient(to right, #c7ccd4 0%, #c7ccd4 50%, #f03e3e 50%, #f03e3e 100%);
            transition: transform 0.5s ease;
            transform-origin: center;
            opacity: 0.25;
        }

        .compass-needle.live {
            opacity: 1;
        }

        .compass-needle:after {
            content: '';
            position: absolute;
            right: -12%;
            top: 50%;
            margin-top: -1.7vmin;
            border-left: 2.6vmin solid #f03e3e;
            border-top: 1.7vmin solid transparent;
            border-bottom: 1.7vmin solid transparent;
        }

        #score-list {
            width: 100%;
        }

        .score-entry {
            display: flex;
            align-items: center;
            margin-bottom: 1.2vmin;
            padding: 1vmin 2vmin 1vmin 1.4vmin;
            border-radius: 2.2vmin;
            background: rgba(20, 24, 40, 0.82);
            border: 1px solid rgba(255, 255, 255, 0.16);
            font-size: 3.1vmin;
            font-weight: 700;
            line-height: 1.3;
        }

        .score-entry .score-rank {
            flex: none;
            margin-right: 1vmin;
        }

        .score-entry .score-name {
            flex: 1 1 auto;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .score-entry .score-value {
            flex: none;
            margin-left: 1.4vmin;
            color: #ffd866;
            font-variant-numeric: tabular-nums;
        }

        #hint {
            margin-top: 2.4vmin;
            padding: 0.9vmin 3.2vmin;
            border-radius: 5vmin;
            background: rgba(20, 24, 40, 0.86);
            border: 1px solid rgba(255, 255, 255, 0.18);
            font-size: 4vmin;
            font-weight: 800;
            line-height: 1.25;
            white-space: nowrap;
        }

        .portrait #score-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-gap: 1.2vmin;
        }

        .portrait .score-entry {
            margin-bottom: 0;
            font-size: 2.7vmin;
            padding: 1.4vmin 1.4vmin 1.4vmin 1.1vmin;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="info">
            <div id="treasures-left"></div>
            <div class="compass">
                <div class="compass-needle" id="compass-needle"></div>
            </div>
        </div>

        <div id="map"></div>

        <div id="side">
            <div id="score-list"></div>
            <div id="hint">!dig B5</div>
        </div>
    </div>

    <script>
    // Game state
    const GRID_SIZE = 10;
    const TREASURES_PER_ROUND = 3;
    let grid = [];
    let treasures = [];
    let foundTreasures = 0;
    let round = 1;
    let scores = new Map();
    let revealedCells = new Set();
    let currentHint = '';
    let lastDig = null;
    
    // Treasure types with different values
    const treasureTypes = [
        { emoji: '💎', name: 'Diamond', value: 100 },
        { emoji: '👑', name: 'Crown', value: 75 },
        { emoji: '💰', name: 'Gold', value: 50 },
        { emoji: '🏺', name: 'Artifact', value: 40 },
        { emoji: '📿', name: 'Jewels', value: 30 }
    ];
    
    // URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    var chatRelay = SocialStreamLocalServer.getChatRelayConfig(urlParams);
    const sessionId = urlParams.get('session') || 'test';
    const password = urlParams.get('password') || 'false';

    if (urlParams.has('transparent')) {
        document.body.classList.add('transparent');
    }

    function stripHtml(html) {
        const tmp = document.createElement('template').content.appendChild(document.createElement('div'));
        tmp.innerHTML = html;
        return tmp.textContent || tmp.innerText || '';
    }

    let foundEmojis = [];
    let lastDigCell = null;

    // Fit the map to the window; side panels sit beside it in landscape, above and below in portrait
    function layout() {
        const W = window.innerWidth, H = window.innerHeight;
        const portrait = H > W;
        document.body.classList.toggle('portrait', portrait);
        const size = Math.max(110, portrait ? Math.min(W * 0.94, H * 0.56) : Math.min(H * 0.94, W * 0.52));
        const map = document.getElementById('map');
        map.style.width = size + 'px';
        map.style.height = size + 'px';
        map.style.fontSize = (size / 11.2) + 'px';
        showHintZone();
    }

    // Initialize grid
    function initGrid() {
        const mapElement = document.getElementById('map');
        mapElement.textContent = '';
        grid = [];
        revealedCells.clear();
        foundEmojis = [];
        lastDigCell = null;

        // Column letters across the top, row numbers down the side
        mapElement.appendChild(document.createElement('div'));
        for (let col = 0; col < GRID_SIZE; col++) {
            const head = document.createElement('div');
            head.className = 'map-head';
            head.textContent = String.fromCharCode(65 + col);
            mapElement.appendChild(head);
        }

        for (let row = 0; row < GRID_SIZE; row++) {
            const head = document.createElement('div');
            head.className = 'map-head';
            head.textContent = row + 1;
            mapElement.appendChild(head);

            grid[row] = [];
            for (let col = 0; col < GRID_SIZE; col++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                cell.dataset.row = row;
                cell.dataset.col = col;

                const mark = document.createElement('span');
                mark.className = 'mark';
                cell.appendChild(mark);

                mapElement.appendChild(cell);
                grid[row][col] = null;
            }
        }

        const zone = document.createElement('div');
        zone.id = 'hint-zone';
        const badge = document.createElement('div');
        badge.className = 'zone-badge';
        badge.appendChild(document.createElement('span'));
        zone.appendChild(badge);
        mapElement.appendChild(zone);
    }

    function placeTreasures() {
        treasures = [];
        foundTreasures = 0;

        for (let i = 0; i < TREASURES_PER_ROUND; i++) {
            let placed = false;
            while (!placed) {
                const row = Math.floor(Math.random() * GRID_SIZE);
                const col = Math.floor(Math.random() * GRID_SIZE);

                // Check if cell is empty
                if (!grid[row][col]) {
                    const treasure = treasureTypes[Math.floor(Math.random() * treasureTypes.length)];
                    grid[row][col] = { ...treasure, row, col };
                    treasures.push({ ...treasure, row, col });
                    placed = true;
                }
            }
        }

        updateHint();
        updateRoundInfo();
    }

    // Pick a clue for one treasure that is still buried: its column, its row, its quarter of
    // the map, or its band (top three rows, middle four, bottom three).
    function updateHint() {
        if (treasures.length === 0) return;

        const unfoundTreasures = treasures.filter(t => !revealedCells.has(`${t.row},${t.col}`));

        if (unfoundTreasures.length === 0) {
            currentHint = '';
            showHintZone();
            return;
        }

        const target = unfoundTreasures[Math.floor(Math.random() * unfoundTreasures.length)];
        const last = GRID_SIZE - 1;

        const hintTypes = [
            () => ({ rows: [0, last], cols: [target.col, target.col] }),
            () => ({ rows: [target.row, target.row], cols: [0, last] }),
            () => ({
                rows: target.row < 5 ? [0, 4] : [5, last],
                cols: target.col < 5 ? [0, 4] : [5, last]
            }),
            () => ({
                rows: target.row < 3 ? [0, 2] : target.row > 6 ? [7, last] : [3, 6],
                cols: [0, last]
            })
        ];

        currentHint = hintTypes[Math.floor(Math.random() * hintTypes.length)]();
        currentHint.emoji = target.emoji;
        showHintZone();
    }

    function getCell(row, col) {
        return document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
    }

    // Draw the clue as a highlighted block of squares with the treasure on its corner
    function showHintZone() {
        const zone = document.getElementById('hint-zone');
        if (!zone) return;
        const first = currentHint && getCell(currentHint.rows[0], currentHint.cols[0]);
        const last = currentHint && getCell(currentHint.rows[1], currentHint.cols[1]);
        if (!first || !last) {
            zone.style.display = 'none';
            return;
        }
        zone.style.display = 'block';
        zone.style.left = first.offsetLeft + 'px';
        zone.style.top = first.offsetTop + 'px';
        zone.style.width = (last.offsetLeft + last.offsetWidth - first.offsetLeft) + 'px';
        zone.style.height = (last.offsetTop + last.offsetHeight - first.offsetTop) + 'px';
        zone.querySelector('.zone-badge span').textContent = currentHint.emoji;
    }

    function dig(username, coordinate, playerKey = username) {
        // Parse coordinate (e.g., "B5" -> row 4, col 1)
        const match = coordinate.match(/^([A-J])(10|\d)$/i);
        if (!match) {
            sendResponse(`@${username}, invalid coordinate! Use format like B5`);
            return;
        }

        const col = match[1].toUpperCase().charCodeAt(0) - 65;
        const row = parseInt(match[2]) - 1;

        if (col < 0 || col >= GRID_SIZE || row < 0 || row >= GRID_SIZE) {
            sendResponse(`@${username}, that coordinate is off the map!`);
            return;
        }

        const cellKey = `${row},${col}`;
        if (revealedCells.has(cellKey)) {
            sendResponse(`@${username}, that spot was already dug!`);
            return;
        }

        // Mark as revealed
        revealedCells.add(cellKey);
        const cell = getCell(row, col);
        const mark = cell.querySelector('.mark');
        cell.classList.add('revealed');
        if (lastDigCell) lastDigCell.classList.remove('last-dig');
        cell.classList.add('last-dig');
        lastDigCell = cell;

        // Update last dig for compass
        lastDig = { row, col, time: Date.now() };

        // Check if treasure found
        const treasure = grid[row][col];
        if (treasure) {
            foundTreasure(username, treasure, cell, playerKey);
        } else {
            // Give proximity hint
            const distance = getNearestTreasureDistance(row, col);
            let message = `@${username} dug at ${coordinate}... `;

            if (distance <= 1) {
                message += '🔥 Very hot! Treasure is adjacent!';
                mark.textContent = '🔥';
                cell.classList.add('t-hot');
            } else if (distance <= 2) {
                message += '♨️ Hot! Getting close!';
                mark.textContent = '♨️';
                cell.classList.add('t-warm');
            } else if (distance <= 3) {
                message += '🌡️ Warm... keep searching!';
                mark.textContent = '🌡️';
                cell.classList.add('t-mild');
            } else {
                message += '❄️ Cold... try elsewhere!';
                mark.textContent = '❄️';
                cell.classList.add('t-cold');
            }

            sendResponse(message);
        }

        updateCompass();
    }

    function getNearestTreasureDistance(row, col) {
        let minDistance = Infinity;

        treasures.forEach(treasure => {
            const cellKey = `${treasure.row},${treasure.col}`;
            if (!revealedCells.has(cellKey)) {
                const distance = Math.max(Math.abs(treasure.row - row), Math.abs(treasure.col - col));
                minDistance = Math.min(minDistance, distance);
            }
        });

        return minDistance;
    }

    function foundTreasure(username, treasure, cell, playerKey = username) {
        // Show treasure
        cell.querySelector('.mark').textContent = treasure.emoji;
        cell.classList.add('treasure');

        // Update score
        const currentScore = (scores.get(playerKey) || {score: 0}).score;
        scores.set(playerKey, {name: username, score: currentScore + treasure.value});
        updateScoreboard();

        // Show the treasure and who found it over the map
        const foundEffect = document.createElement('div');
        foundEffect.className = 'treasure-found';
        const foundEmoji = document.createElement('div');
        foundEmoji.className = 'found-emoji';
        foundEmoji.textContent = treasure.emoji;
        const foundName = document.createElement('div');
        foundName.className = 'found-name';
        foundName.textContent = username;
        foundEffect.appendChild(foundEmoji);
        foundEffect.appendChild(foundName);
        document.getElementById('map').appendChild(foundEffect);
        setTimeout(() => foundEffect.remove(), 2200);

        // Send message
        sendResponse(`🎉 ${username} found the ${treasure.name} ${treasure.emoji} worth ${treasure.value} points!`);

        foundTreasures++;
        foundEmojis.push(treasure.emoji);
        updateRoundInfo();

        // Check if round complete
        if (foundTreasures >= TREASURES_PER_ROUND) {
            currentHint = '';
            showHintZone();
            setTimeout(startNewRound, 3000);
        } else {
            // Update hint for remaining treasures
            setTimeout(updateHint, 1000);
        }
    }

    // The needle points from the last square dug toward the nearest buried treasure
    function updateCompass() {
        const needle = document.getElementById('compass-needle');
        if (!lastDig) {
            needle.classList.remove('live');
            return;
        }

        let nearestTreasure = null;
        let minDistance = Infinity;

        treasures.forEach(treasure => {
            const cellKey = `${treasure.row},${treasure.col}`;
            if (!revealedCells.has(cellKey)) {
                const distance = Math.sqrt(
                    Math.pow(treasure.row - lastDig.row, 2) +
                    Math.pow(treasure.col - lastDig.col, 2)
                );
                if (distance < minDistance) {
                    minDistance = distance;
                    nearestTreasure = treasure;
                }
            }
        });

        if (nearestTreasure) {
            const angle = Math.atan2(
                nearestTreasure.row - lastDig.row,
                nearestTreasure.col - lastDig.col
            ) * 180 / Math.PI;

            needle.style.transform = `rotate(${angle}deg)`;
        }
        needle.classList.toggle('live', !!nearestTreasure);
    }

    function updateScoreboard() {
        const scoreList = document.getElementById('score-list');
        scoreList.textContent = '';

        const sortedScores = Array.from(scores.entries())
            .sort((a, b) => b[1].score - a[1].score)
            .slice(0, 3);

        const medals = ['🥇', '🥈', '🥉'];
        sortedScores.forEach(([, player], index) => {
            const entry = document.createElement('div');
            entry.className = 'score-entry';

            const rank = document.createElement('span');
            rank.className = 'score-rank';
            rank.textContent = medals[index];
            const name = document.createElement('span');
            name.className = 'score-name';
            name.textContent = player.name;
            const value = document.createElement('span');
            value.className = 'score-value';
            value.textContent = player.score;

            entry.appendChild(rank);
            entry.appendChild(name);
            entry.appendChild(value);
            scoreList.appendChild(entry);
        });
    }

    // One slot per treasure in the round; a slot fills in when its treasure is dug up
    function updateRoundInfo() {
        const slots = document.getElementById('treasures-left');
        slots.textContent = '';
        for (let i = 0; i < TREASURES_PER_ROUND; i++) {
            const slot = document.createElement('div');
            slot.className = 'slot' + (i < foundEmojis.length ? ' found' : '');
            const icon = document.createElement('span');
            icon.textContent = i < foundEmojis.length ? foundEmojis[i] : '💰';
            slot.appendChild(icon);
            slots.appendChild(slot);
        }
    }

    function startNewRound() {
        round++;
        initGrid();
        placeTreasures();
        lastDig = null;
        updateCompass();
        sendResponse(`🗺️ Round ${round} begins! New treasures have been hidden!`);
    }

    function sendResponse(message) {
        if (urlParams.has('demo')) return;
        const response = {
            chatname: 'TreasureBot',
            chatmessage: message,
            type: 'bot',
            timestamp: Date.now()
        };
        
        if (window.parent !== window) {
            window.parent.postMessage({
                overlay: 'treasurehunt',
                response: response
            }, '*');
        }
        
        console.log('Bot response:', message);
    }
    
    function processData(data) {
        // Captions are the host's own speech shown as text. They are not chat to take part with.
        if (data && (data.content || data).type === "captions") return;
        if (data && data.content) {
            data = data.content;
        }
        
        if (!data || !data.chatmessage || !data.chatname) return;

        let rawMessage = data.chatmessage;
        // Preserve the chatmessage format: textonly=true is literal text, without HTML parsing/filtering; false/missing permits HTML checked at its ingress boundary.
        if (!data.textonly) {
            rawMessage = stripHtml(rawMessage);
        }
        const message = rawMessage.trim();

        if (message.toLowerCase().startsWith('!dig ')) {
            const coordinate = message.substring(5).trim().toUpperCase();
            dig(String(data.chatname), coordinate, JSON.stringify([data.type || '', String(data.userid || data.username || data.chatname)]));
        }
    }

    // Initialize game
    layout();
    initGrid();
    placeTreasures();
    updateCompass();
    window.addEventListener('resize', layout);
    
    // Setup iframe communication
    if (!urlParams.has('demo') && !chatRelay.enabled) {
    const iframe = document.createElement("iframe");
    iframe.src = `https://vdo.socialstream.ninja/?ln&salt=vdo.ninja&notmobile&password=${encodeURIComponent(password)}&solo&view=${encodeURIComponent(sessionId)}&novideo&noaudio&label=dock&cleanoutput&room=${encodeURIComponent(sessionId)}`;
    iframe.style.width = "0px";
    iframe.style.height = "0px";
    iframe.style.position = "fixed";
    iframe.style.left = "-100px";
    iframe.style.top = "-100px";
    iframe.id = "frame1";
    document.body.appendChild(iframe);
    
    window.addEventListener("message", function(e) {
        if (e.source !== iframe.contentWindow) return;
        
        if (e.data && typeof e.data === "object" && e.data.dataReceived && typeof e.data.dataReceived === "object") {
            if ("overlayNinja" in e.data.dataReceived) {
                processData(e.data.dataReceived.overlayNinja);
            }
        }
    });
    
    }

    // Handle WebSocket if server parameter provided
    if (!urlParams.has('demo') && chatRelay.enabled) {
        const serverUrl = chatRelay.url;
        let socketserver = null;
        let reconnectTimeout = null;

        function connectWebSocket() {
            socketserver = new WebSocket(serverUrl);

            socketserver.onopen = function() {
                socketserver.send(JSON.stringify({
                    join: sessionId.split(",")[0],
                    out: chatRelay.out, in: chatRelay.in
                }));
            };

            socketserver.onclose = function() {
                clearTimeout(reconnectTimeout);
                reconnectTimeout = setTimeout(connectWebSocket, 5000);
            };

            socketserver.onerror = function() {
                try { socketserver.close(); } catch (e) {}
            };

            socketserver.onmessage = function(event) {
                if (event.data) {
                    try {
                        const data = JSON.parse(event.data);
                        processData(data);
                    } catch (e) {
                        console.error('WebSocket parse error:', e);
                    }
                }
            };
        }

        connectWebSocket();
    }

    // Demo mode: three hunters dig every second or so and tend to pick the warmer squares
    if (urlParams.has('demo')) {
        const demoHunters = ['Marlowe', 'Pip', 'Juniper'];
        setInterval(() => {
            if (foundTreasures >= TREASURES_PER_ROUND) return;
            const open = [];
            for (let row = 0; row < GRID_SIZE; row++) {
                for (let col = 0; col < GRID_SIZE; col++) {
                    if (!revealedCells.has(row + ',' + col)) open.push([row, col]);
                }
            }
            if (!open.length) return;
            let choice = open[Math.floor(Math.random() * open.length)];
            for (let attempt = 0; attempt < 7; attempt++) {
                const other = open[Math.floor(Math.random() * open.length)];
                if (getNearestTreasureDistance(other[0], other[1]) < getNearestTreasureDistance(choice[0], choice[1])) choice = other;
            }
            const user = demoHunters[Math.floor(Math.random() * demoHunters.length)];
            dig(user, String.fromCharCode(65 + choice[1]) + (choice[0] + 1));
        }, 1100);
    }
    </script>

<!doctype html>
<html lang="en"><head>
    <meta charset="utf-8">
    <meta name="description" content="Chat Seismograph: an interactive stream activity for Social Stream Ninja. Connect your chat session and add the game to your OBS scene.">
    <meta name="robots" content="noindex">
<script src="../js/local-server-url.js"></script><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chat Seismograph | Social Stream Ninja</title><link rel="icon" href="../favicon.ico"><link rel="stylesheet" href="hype.css"></head>
<body data-game="seismo" class="seismo">
<canvas id="playfield" aria-label="Chat Seismograph game view"></canvas>
<section id="paper-panel" hidden aria-label="Chat seismograph">
    <header><strong>CHAT <span>SEISMOGRAPH</span></strong><small id="paper-demo" hidden>DEMO</small></header>
    <div class="readings">
        <div><small>CHAT MAGNITUDE</small><div class="magnitude">M<b id="paper-magnitude">0.0</b></div></div>
        <div class="rates"><div id="paper-rate"></div><div id="paper-relative"></div></div>
    </div>
    <div id="paper-graph"></div>
    <div class="axis"><small id="paper-span"></small><small>LIVE CHAT</small></div>
    <div id="paper-quake" hidden>
        <div class="event"><strong>QUAKE</strong><span id="paper-epicenter"></span></div>
        <p id="paper-count"></p>
    </div>
    <div id="paper-recent" hidden><small>RECENT QUAKES</small><pre id="paper-history"></pre></div>
</section>
<p id="summary" class="sr-only" role="status"></p>
<script src="hype-engine.js"></script><script src="hype-page.js"></script></body></html>

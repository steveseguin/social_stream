<html lang="en"><head>
<script src="../shared/utils/documentation.js"></script>
    <meta charset="utf-8">

<body data-game="signal"><main class="shell">
<div class="topline"><h1>Signal Lock</h1><div class="clock"><span id="clock-value" aria-label="Time remaining"></span></div></div>

<div class="content"><div class="metrics"><span>Latest attempts</span><span><strong id="participants">0</strong> codebreakers</span></div><div id="history" class="history"></div></div></section>

</main><script src="audience-engine.js"></script><script src="audience-page.js"></script></body></html>

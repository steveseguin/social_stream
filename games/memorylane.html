<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Memory Lane: an interactive stream activity for Social Stream Ninja. Connect your chat session and add the game to your OBS scene.">
    <meta name="robots" content="noindex">
<script src="../js/local-server-url.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Lane - Social Stream Ninja</title>
    <link rel="icon" href="../favicon.ico" />
    <style>
        /* Hide scrollbars */
        ::-webkit-scrollbar {
            display: none;
        }

        * {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            overflow: hidden;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            color: white;
        }

        body.chroma {
            background: #00ff00;
        }

        body.darkmode {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 50%, #2c3e50 100%);
        }

        body.transparent {
            background: transparent;
        }

        #game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* The wall of photos; --c is the width of one photo */
        #memory-timeline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            --c: 300px;
        }

        .memory-photo {
            position: absolute;
            width: var(--c);
            height: calc(var(--c) * 1.2);
            margin: calc(var(--c) * -0.6) 0 0 calc(var(--c) * -0.5);
            animation: photo-in 0.7s cubic-bezier(0.2, 1.3, 0.4, 1) both;
        }

        .memory-photo.leaving {
            animation: photo-out 0.6s ease-in both;
        }

        @keyframes photo-in {
            0% {
                transform: translateY(-8vmin) rotate(calc(var(--tilt) * -2)) scale(1.25);
                opacity: 0;
            }
            100% {
                transform: translateY(0) rotate(var(--tilt)) scale(1);
                opacity: 1;
            }
        }

        @keyframes photo-out {
            0% {
                transform: translateY(0) rotate(var(--tilt)) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(5vmin) rotate(var(--tilt)) scale(0.85);
                opacity: 0;
            }
        }

        .photo-polaroid {
            position: relative;
            width: 100%;
            height: 100%;
            padding: calc(var(--c) * 0.05);
            box-sizing: border-box;
            background: #fffdf8;
            border: 1px solid rgba(0, 0, 0, 0.14);
            border-radius: calc(var(--c) * 0.055);
            box-shadow: 0 0.8vmin 2vmin rgba(30, 20, 60, 0.25);
            animation: photo-float 6s ease-in-out infinite alternate;
        }

        @keyframes photo-float {
            0% { transform: translateY(-0.6vmin); }
            100% { transform: translateY(0.6vmin); }
        }

        .photo-image {
            position: relative;
            height: calc(var(--c) * 0.62);
            border-radius: calc(var(--c) * 0.035);
            overflow: hidden;
            text-align: center;
        }

        .photo-emoji {
            font-size: calc(var(--c) * 0.36);
            line-height: calc(var(--c) * 0.62);
        }

        .photo-extra {
            position: absolute;
            font-size: calc(var(--c) * 0.14);
            line-height: 1;
        }

        .photo-extra.first {
            left: 6%;
            bottom: 8%;
            transform: rotate(-14deg);
        }

        .photo-extra.second {
            right: 6%;
            top: 8%;
            transform: rotate(12deg);
        }

        /* A fresh photo starts blank and develops */
        .photo-developer {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: #f4efe6;
            animation: develop-photo 2.2s ease-out 0.3s both;
        }

        @keyframes develop-photo {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        .photo-text {
            margin-top: calc(var(--c) * 0.035);
            max-height: 3.75em;
            overflow: hidden;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 3;
            font-size: calc(var(--c) * 0.072);
            line-height: 1.25;
            font-weight: 600;
            color: #3b3550;
            text-align: center;
            word-break: break-word;
        }

        .photo-caption {
            position: absolute;
            left: 6%;
            bottom: calc(var(--c) * 0.04);
            width: 88%;
            font-size: calc(var(--c) * 0.058);
            line-height: 1.3;
            font-weight: 800;
            color: #8d84ab;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="memory-timeline"></div>
    </div>

    <script>
        // URL parameters
        const urlParams = new URLSearchParams(window.location.search);
    var chatRelay = SocialStreamLocalServer.getChatRelayConfig(urlParams);
        const sessionId = urlParams.get('session') || urlParams.get('room') || 'test';
        const password = urlParams.get('password') || 'false';

        // Apply theme settings
        if (urlParams.has('chroma')) {
            document.body.classList.add('chroma');
        } else if (urlParams.has('darkmode')) {
            document.body.classList.add('darkmode');
        }
        if (urlParams.has('transparent')) {
            document.body.classList.add('transparent');
        }

        // Game state
        let gameState = {
            contributors: new Set(),
            memoryCount: 0,
            photos: [],
            slots: [],
            pending: [],
            lastPhotoTime: 0
        };

        const PHOTO_LIFETIME = 90000; // a quiet chat lets the wall clear itself
        const timeline = document.getElementById('memory-timeline');
        const view = { slotWidth: 0, slotHeight: 0, margin: 0 };

        // Memory keywords and their themes
        const memoryKeywords = {
            childhood: { emoji: '🧸', theme: 'childhood', mood: 'nostalgic' },
            school: { emoji: '🎒', theme: 'education', mood: 'nostalgic' },
            friend: { emoji: '👫', theme: 'friendship', mood: 'happy' },
            family: { emoji: '👨‍👩‍👧‍👦', theme: 'family', mood: 'warm' },
            vacation: { emoji: '🏖️', theme: 'travel', mood: 'relaxed' },
            birthday: { emoji: '🎂', theme: 'celebration', mood: 'joyful' },
            christmas: { emoji: '🎄', theme: 'holiday', mood: 'festive' },
            summer: { emoji: '☀️', theme: 'season', mood: 'happy' },
            winter: { emoji: '❄️', theme: 'season', mood: 'cozy' },
            love: { emoji: '💕', theme: 'romance', mood: 'loving' },
            graduation: { emoji: '🎓', theme: 'achievement', mood: 'proud' },
            wedding: { emoji: '💒', theme: 'celebration', mood: 'joyful' },
            pet: { emoji: '🐕', theme: 'animals', mood: 'loving' },
            music: { emoji: '🎵', theme: 'hobby', mood: 'happy' },
            book: { emoji: '📚', theme: 'hobby', mood: 'thoughtful' },
            game: { emoji: '🎮', theme: 'hobby', mood: 'excited' },
            cooking: { emoji: '👨‍🍳', theme: 'hobby', mood: 'creative' },
            art: { emoji: '🎨', theme: 'hobby', mood: 'creative' },
            remember: { emoji: '💭', theme: 'memory', mood: 'nostalgic' },
            nostalgia: { emoji: '🕰️', theme: 'memory', mood: 'nostalgic' }
        };

        // Photo background gradients
        const photoBackgrounds = [
            'linear-gradient(45deg, #ffeaa7, #fab1a0)',
            'linear-gradient(45deg, #fd79a8, #e17055)',
            'linear-gradient(45deg, #74b9ff, #0984e3)',
            'linear-gradient(45deg, #55efc4, #00b894)',
            'linear-gradient(45deg, #fdcb6e, #e17055)',
            'linear-gradient(45deg, #e17055, #d63031)',
            'linear-gradient(45deg, #a29bfe, #6c5ce7)',
            'linear-gradient(45deg, #fd79a8, #fdcb6e)',
            'linear-gradient(45deg, #00b894, #00cec9)',
            'linear-gradient(45deg, #0984e3, #74b9ff)'
        ];

        // Extract memory keywords and emojis from text
        function analyzeMessage(text) {
            const analysis = {
                keywords: [],
                emojis: [],
                mood: 'happy',
                theme: 'general'
            };

            const lowerText = text.toLowerCase();

            // Find memory keywords
            Object.entries(memoryKeywords).forEach(([keyword, data]) => {
                if (lowerText.includes(keyword)) {
                    analysis.keywords.push({ keyword, ...data });
                }
            });

            // Extract emojis
            const emojiRegex = /(\p{Regional_Indicator}\p{Regional_Indicator}|\p{Emoji_Presentation}|\p{Emoji}️)(\p{Emoji_Modifier}|‍\p{Emoji}️?)*/gu;
            const foundEmojis = text.match(emojiRegex) || [];
            analysis.emojis = foundEmojis;

            // Determine mood and theme
            if (analysis.keywords.length > 0) {
                const primaryKeyword = analysis.keywords[0];
                analysis.mood = primaryKeyword.mood;
                analysis.theme = primaryKeyword.theme;
            }

            return analysis;
        }

        function placePhoto(photo) {
            const slot = photo.slot;
            photo.element.style.left = (view.margin + view.slotWidth * (slot.col + 0.5 + photo.offsetX)) + 'px';
            photo.element.style.top = (view.margin + view.slotHeight * (slot.row + 0.5 + photo.offsetY)) + 'px';
        }

        // Lay the wall out as a grid of photo spots: wide windows get 4 x 2, tall ones 2 x 3
        function layoutWall() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            const portrait = height > width;
            const cols = portrait ? 2 : (width / height > 1.25 ? 4 : 3);
            const rows = portrait ? 3 : 2;

            view.margin = Math.min(width, height) * 0.03;
            view.slotWidth = (width - view.margin * 2) / cols;
            view.slotHeight = (height - view.margin * 2) / rows;
            const photoWidth = Math.min(view.slotWidth * 0.86, view.slotHeight * 0.88 / 1.2);
            timeline.style.setProperty('--c', photoWidth + 'px');

            const slots = [];
            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    slots.push({ col: col, row: row, photo: null });
                }
            }

            // Keep the photos already on the wall, newest first, as far as they still fit
            const keep = gameState.photos.slice(-slots.length);
            gameState.photos.slice(0, gameState.photos.length - keep.length).forEach(removePhoto);
            keep.forEach((photo, index) => {
                photo.slot = slots[index];
                slots[index].photo = photo;
                placePhoto(photo);
            });
            gameState.slots = slots;
        }

        function removePhoto(photo) {
            if (photo.removed) return;
            photo.removed = true;
            if (photo.slot && photo.slot.photo === photo) {
                photo.slot.photo = null;
            }
            gameState.photos = gameState.photos.filter(p => p !== photo);
            photo.element.classList.add('leaving');
            setTimeout(() => {
                if (photo.element.parentNode) {
                    photo.element.parentNode.removeChild(photo.element);
                }
            }, 600);
        }

        // Create memory photo
        function createMemoryPhoto(analysis, username, message) {
            // Use a free spot, or take over from the oldest photo on the wall
            let free = gameState.slots.filter(slot => !slot.photo);
            if (free.length === 0 && gameState.photos.length > 0) {
                const oldest = gameState.photos[0];
                free = [oldest.slot];
                removePhoto(oldest);
            }
            if (free.length === 0) return;
            const slot = free[Math.floor(Math.random() * free.length)];

            const photo = document.createElement('div');
            photo.className = 'memory-photo';
            photo.style.setProperty('--tilt', (Math.random() * 10 - 5).toFixed(1) + 'deg');

            const polaroid = document.createElement('div');
            polaroid.className = 'photo-polaroid';
            polaroid.style.animationDelay = (-Math.random() * 6) + 's';

            const imageDiv = document.createElement('div');
            imageDiv.className = 'photo-image';
            imageDiv.style.background = photoBackgrounds[Math.floor(Math.random() * photoBackgrounds.length)];

            // Choose main emoji for photo
            let mainEmoji = '📷';
            if (analysis.emojis.length > 0) {
                mainEmoji = analysis.emojis[0];
            } else if (analysis.keywords.length > 0) {
                mainEmoji = analysis.keywords[0].emoji;
            }

            const emoji = document.createElement('span');
            emoji.className = 'photo-emoji';
            emoji.textContent = mainEmoji;
            imageDiv.appendChild(emoji);

            // Other emojis and themes from the message decorate the corners
            const extras = analysis.emojis.slice(1).concat(analysis.keywords.map(keyword => keyword.emoji))
                .filter((value, index, list) => value !== mainEmoji && list.indexOf(value) === index);
            extras.slice(0, 2).forEach((value, index) => {
                const extra = document.createElement('span');
                extra.className = 'photo-extra ' + (index === 0 ? 'first' : 'second');
                extra.textContent = value;
                imageDiv.appendChild(extra);
            });

            const developer = document.createElement('div');
            developer.className = 'photo-developer';
            imageDiv.appendChild(developer);

            // The message is written under the picture
            const textOverlay = document.createElement('div');
            textOverlay.className = 'photo-text';
            textOverlay.textContent = message.length > 70 ? message.substring(0, 70) + '…' : message;

            const caption = document.createElement('div');
            caption.className = 'photo-caption';
            caption.textContent = username;

            polaroid.appendChild(imageDiv);
            polaroid.appendChild(textOverlay);
            polaroid.appendChild(caption);
            photo.appendChild(polaroid);

            // Store photo data
            const entry = {
                element: photo,
                slot: slot,
                offsetX: (Math.random() - 0.5) * 0.08,
                offsetY: (Math.random() - 0.5) * 0.06,
                removed: false
            };
            slot.photo = entry;
            gameState.photos.push(entry);
            placePhoto(entry);
            timeline.appendChild(photo);

            // Auto-remove after time
            setTimeout(() => removePhoto(entry), PHOTO_LIFETIME);
        }

        // Photos go up one at a time, so a busy chat does not turn the wall into a slideshow
        function queueMemoryPhoto(analysis, username, message) {
            if (gameState.pending.length >= 6) gameState.pending.shift();
            gameState.pending.push([analysis, username, message]);
        }

        function developNextPhoto() {
            if (gameState.pending.length === 0) return;
            const now = Date.now();
            const filling = gameState.photos.length < gameState.slots.length;
            if (now - gameState.lastPhotoTime < (filling ? 450 : 2200)) return;

            gameState.lastPhotoTime = now;
            const next = gameState.pending.shift();
            createMemoryPhoto(next[0], next[1], next[2]);
        }

        // Process incoming message
        function processData(data) {
            // Handle different data formats from Social Stream
            if (data && data.content) {
                data = data.content;
            }
            
            if (!data || !data.chatmessage || !data.chatname) return;

            // Read the name without loading images or running their handlers.
            const nameTemplate = document.createElement('template');
            const tmpName = nameTemplate.content.appendChild(document.createElement('div'));
            tmpName.innerHTML = data.chatname;
            const username = tmpName.textContent || tmpName.innerText || '';
            let message = data.chatmessage;

            // Check if textonly is set, if not we need to extract text from HTML
            // Preserve the chatmessage format: textonly=true is literal text, without HTML parsing/filtering; false/missing permits HTML checked at its ingress boundary.
            if (!data.textonly) {
                // Create a temporary element to parse HTML
                const tempDiv = document.createElement('template').content.appendChild(document.createElement('div'));
                tempDiv.innerHTML = message;
                
                // Replace images with their alt text
                const images = tempDiv.querySelectorAll('img');
                images.forEach(img => {
                    const altText = img.getAttribute('alt') || '';
                    if (altText) {
                        const textNode = document.createTextNode(altText);
                        img.parentNode.replaceChild(textNode, img);
                    }
                });
                
                // Get the text content
                message = tempDiv.textContent || tempDiv.innerText || '';
            }

            // Analyze message for memory content
            const analysis = analyzeMessage(message.trim());

            // Create memory if keywords or emojis found, or if message is long enough
            if (analysis.keywords.length > 0 || analysis.emojis.length > 0 || message.length > 20) {
                if (gameState.contributors.size >= 500) {
                    gameState.contributors = new Set(Array.from(gameState.contributors).slice(-250));
                }
                gameState.contributors.add(username);
                gameState.memoryCount++;

                queueMemoryPhoto(analysis, username, message.trim());
            }
        }

        // Setup iframe communication (skip when using WebSocket mode)
        if (!urlParams.has('demo') && !chatRelay.enabled) {
            if (!urlParams.has('demo') && !chatRelay.enabled) {
            const iframe = document.createElement("iframe");
                iframe.src = `https://vdo.socialstream.ninja/?ln&salt=vdo.ninja&notmobile&password=${encodeURIComponent(password)}&solo&view=${encodeURIComponent(sessionId)}&novideo&noaudio&label=dock&cleanoutput&room=${encodeURIComponent(sessionId)}`;
                iframe.style.width = "0px";
                iframe.style.height = "0px";
                iframe.style.position = "fixed";
                iframe.style.left = "-100px";
                iframe.style.top = "-100px";
                iframe.id = "frame1";
                document.body.appendChild(iframe);
                
                // Listen for messages
                window.addEventListener("message", function(e) {
                    if (e.source !== iframe.contentWindow) return;
                    
                    if (e.data && typeof e.data === "object" && e.data.dataReceived && typeof e.data.dataReceived === "object") {
                        if ("overlayNinja" in e.data.dataReceived) {
                            processData(e.data.dataReceived.overlayNinja);
                        }
                    }
                });
            }
        }

        // Handle WebSocket connection
        if (!urlParams.has('demo') && chatRelay.enabled) {
            const serverUrl = chatRelay.url;
            let socketserver = null;
            let reconnectTimeout = null;

            function connectWebSocket() {
                socketserver = new WebSocket(serverUrl);

                socketserver.onopen = function() {
                    socketserver.send(JSON.stringify({
                        join: sessionId.split(",")[0],
                        out: chatRelay.out, in: chatRelay.in
                    }));
                };

                socketserver.onclose = function() {
                    clearTimeout(reconnectTimeout);
                    reconnectTimeout = setTimeout(connectWebSocket, 5000);
                };

                socketserver.onerror = function() {
                    try { socketserver.close(); } catch (e) {}
                };

                socketserver.onmessage = function(event) {
                    if (event.data) {
                        try {
                            const data = JSON.parse(event.data);
                            processData(data);
                        } catch (e) {
                            console.error('WebSocket parse error:', e);
                        }
                    }
                };
            }

            connectWebSocket();
        }

        // Demo mode
        if (urlParams.has('demo')) {
            const demoMemories = [
                'I remember my childhood summer vacations 🏖️',
                'My first day at school was so exciting! 🎒',
                'Family dinners were always the best 👨‍👩‍👧‍👦',
                'Christmas mornings were magical ✨🎄',
                'Remember playing games all night with friends 🎮',
                'That wedding was beautiful 💒💕',
                'My graduation day was unforgettable 🎓',
                'Nostalgia hits when I see old photos 📷',
                'Love spending time with my pet 🐕❤️',
                'Those winter nights by the fireplace ❄️🔥'
            ];

            const demoUsers = ['Nostalgic_User', 'Memory_Keeper', 'Old_Soul', 'Time_Traveler', 'Dreamer'];

            // Work through the list in a random order so the wall does not repeat itself
            let demoQueue = [];
            function demoMemory() {
                if (demoQueue.length === 0) {
                    demoQueue = demoMemories.slice().sort(() => Math.random() - 0.5);
                }
                const memory = demoQueue.pop();
                const user = demoUsers[Math.floor(Math.random() * demoUsers.length)];

                processData({
                    chatname: user,
                    chatmessage: memory
                });
            }

            // A handful of memories to start the wall, then a steady trickle
            for (let i = 0; i < 5; i++) {
                demoMemory();
            }
            setInterval(demoMemory, 2600);
        }

        // Keep the wall fitted to the window
        window.addEventListener('resize', layoutWall);

        layoutWall();
        setInterval(developNextPhoto, 150);
    </script>
</body>
</html>

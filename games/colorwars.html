<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Color Wars: an interactive stream activity for Social Stream Ninja. Connect your chat session and add the game to your OBS scene.">
    <meta name="robots" content="noindex">
<script src="../js/local-server-url.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Wars - Social Stream Ninja</title>
    <link rel="icon" href="../favicon.ico" />
    <style>
        /* Hide scrollbars */
        ::-webkit-scrollbar {
            display: none;
        }

        * {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            overflow: hidden;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            color: white;
        }

        body.transparent {
            background: transparent;
        }

        #game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #canvas, #fx {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Share of the painted area, one slice per team */
        #team-scores {
            position: absolute;
            top: 3vmin;
            left: 50%;
            width: 76vmin;
            height: 7.4vmin;
            margin-left: -38vmin;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.45);
            overflow: hidden;
            white-space: nowrap;
            font-size: 0;
        }

        .team-score {
            display: inline-block;
            width: 25%;
            height: 100%;
            overflow: hidden;
            text-align: center;
            font-size: 4.4vmin;
            line-height: 7.2vmin;
            font-weight: 900;
            color: #16161d;
            transition: width 0.4s ease;
        }

        #round-timer {
            position: absolute;
            top: 12vmin;
            left: 50%;
            width: 22vmin;
            margin-left: -11vmin;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.5);
            text-align: center;
            font-size: 6vmin;
            line-height: 1.35;
            font-weight: 900;
            font-variant-numeric: tabular-nums;
        }

        #round-timer.ending {
            color: #ffd23f;
        }

        /* Top three painters */
        #leaderboard {
            position: absolute;
            top: 3vmin;
            left: 3vmin;
            width: 36vmin;
        }

        .player-entry {
            position: relative;
            height: 5.4vmin;
            margin-bottom: 0.8vmin;
            padding: 0 2vmin 0 5.4vmin;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.5);
            font-size: 3vmin;
            line-height: 5.2vmin;
            font-weight: 700;
            white-space: nowrap;
        }

        .player-color {
            position: absolute;
            left: 1.2vmin;
            top: 50%;
            width: 3vmin;
            height: 3vmin;
            margin-top: -1.5vmin;
            border-radius: 50%;
        }

        .player-name {
            display: block;
            margin-right: 9vmin;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-cells {
            position: absolute;
            right: 2vmin;
            top: 0;
            font-weight: 900;
        }

        .power-up {
            position: absolute;
            left: 0;
            top: 0;
            width: 1em;
            height: 1em;
            margin: -0.5em 0 0 -0.5em;
            font-size: 8vmin;
            line-height: 1;
            text-align: center;
            animation: power-up-float 1.6s ease-in-out infinite alternate;
        }

        @keyframes power-up-float {
            0% { transform: translateY(-1.2vmin) rotate(-8deg); }
            100% { transform: translateY(1.2vmin) rotate(8deg); }
        }

        /* The one thing viewers need to know: what to type */
        #hint {
            position: absolute;
            bottom: 3vmin;
            left: 0;
            width: 100%;
            text-align: center;
        }

        #hint-chip {
            display: inline-block;
            padding: 0.9vmin 2.6vmin;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.22);
            font-size: 3.8vmin;
            line-height: 1.3;
            font-weight: 800;
            white-space: nowrap;
        }

        #hint-chip span {
            margin: 0 1.2vmin;
        }

        /* Winner */
        #winner-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 44vmin;
            height: 44vmin;
            margin: -22vmin 0 0 -22vmin;
            border-radius: 50%;
            border: 1px solid rgba(0, 0, 0, 0.25);
            box-sizing: border-box;
            text-align: center;
            font-size: 24vmin;
            line-height: 42vmin;
            display: none;
            z-index: 200;
            animation: winner-pop 0.6s cubic-bezier(0.2, 1.5, 0.4, 1) both;
        }

        @keyframes winner-pop {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        /* Tall and squarish windows: the painters move below the share bar */
        body.stacked #team-scores {
            width: 92vmin;
            margin-left: -46vmin;
        }

        body.stacked #round-timer {
            left: auto;
            right: 4vmin;
            margin-left: 0;
        }

        body.stacked #leaderboard {
            top: 12vmin;
            left: 4vmin;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="canvas"></canvas>
        <canvas id="fx"></canvas>
        <div id="power-ups"></div>

        <div id="team-scores">
            <div class="team-score" id="red-score" style="background-color: #ff5d6c;"></div>
            <div class="team-score" id="blue-score" style="background-color: #4d8dff;"></div>
            <div class="team-score" id="yellow-score" style="background-color: #ffd23f;"></div>
            <div class="team-score" id="green-score" style="background-color: #3ddc84;"></div>
        </div>

        <div id="round-timer">2:00</div>

        <div id="leaderboard">
            <div id="player-list"></div>
        </div>

        <div id="hint">
            <div id="hint-chip"><span style="color: #ff7a86;">!red</span><span style="color: #74a7ff;">!blue</span><span style="color: #ffd95e;">!yellow</span><span style="color: #56e59a;">!green</span></div>
        </div>

        <div id="winner-overlay"></div>
    </div>

    <script>
    // Game settings
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const fxCanvas = document.getElementById('fx');
    const fx = fxCanvas.getContext('2d');

    const teams = {
        red: { color: '#ff5d6c', players: new Map() },
        blue: { color: '#4d8dff', players: new Map() },
        yellow: { color: '#ffd23f', players: new Map() },
        green: { color: '#3ddc84', players: new Map() }
    };

    const ROUND_DURATION = 120; // 2 minutes
    const MAX_SPLATS = 900;

    // Sizes follow the window, see layout()
    let unit = 10;
    let GRID_SIZE = 12;
    let PAINT_RADIUS = 55;

    let grid = [];
    let splats = [];
    let powerUps = [];
    let particles = [];
    let rings = [];
    let tags = [];
    let roundTime = ROUND_DURATION;
    let roundStarted = false;
    let gameActive = true;
    let fxDirty = false;

    // URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    var chatRelay = SocialStreamLocalServer.getChatRelayConfig(urlParams);
    const sessionId = urlParams.get('session') || 'test';
    const password = urlParams.get('password') || 'false';

    if (urlParams.has('transparent')) {
        document.body.classList.add('transparent');
    }

    function stripHtml(html) {
        return new DOMParser().parseFromString(String(html), 'text/html').body.textContent || '';
    }

    // Initialize grid
    function initGrid() {
        const cols = Math.ceil(canvas.width / GRID_SIZE);
        const rows = Math.ceil(canvas.height / GRID_SIZE);

        grid = [];
        for (let y = 0; y < rows; y++) {
            grid[y] = [];
            for (let x = 0; x < cols; x++) {
                grid[y][x] = null;
            }
        }
    }

    // Claim every grid cell under a circle of paint, returns how many changed hands
    function markCircle(cx, cy, radius, team) {
        if (!grid.length) return 0;
        const x0 = Math.max(0, Math.floor((cx - radius) / GRID_SIZE));
        const x1 = Math.min(grid[0].length - 1, Math.floor((cx + radius) / GRID_SIZE));
        const y0 = Math.max(0, Math.floor((cy - radius) / GRID_SIZE));
        const y1 = Math.min(grid.length - 1, Math.floor((cy + radius) / GRID_SIZE));
        let changed = 0;

        for (let gy = y0; gy <= y1; gy++) {
            for (let gx = x0; gx <= x1; gx++) {
                const dx = (gx + 0.5) * GRID_SIZE - cx;
                const dy = (gy + 0.5) * GRID_SIZE - cy;
                if (dx * dx + dy * dy <= radius * radius && grid[gy][gx] !== team) {
                    grid[gy][gx] = team;
                    changed++;
                }
            }
        }

        return changed;
    }

    // Put a splat on the paint layer: one big blob with smaller drops around it
    function stampSplat(splat) {
        const x = splat.nx * canvas.width;
        const y = splat.ny * canvas.height;
        const radius = splat.scale * unit;
        let changed = markCircle(x, y, radius, splat.team);

        ctx.fillStyle = teams[splat.team].color;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();

        splat.drops.forEach(drop => {
            const dx = x + Math.cos(drop.angle) * radius * drop.distance;
            const dy = y + Math.sin(drop.angle) * radius * drop.distance;
            changed += markCircle(dx, dy, radius * drop.size, splat.team);
            ctx.beginPath();
            ctx.arc(dx, dy, radius * drop.size, 0, Math.PI * 2);
            ctx.fill();
        });

        return changed;
    }

    function getPlayer(playerKey, username, team) {
        const players = teams[team].players;
        let playerData = players.get(playerKey);
        if (!playerData) {
            if (players.size >= 300) {
                players.delete(players.keys().next().value);
            }
            playerData = { name: stripHtml(username), paintedCells: 0, splashes: 0 };
            players.set(playerKey, playerData);
        }
        return playerData;
    }

    function paintArea(x, y, team, username, radius = PAINT_RADIUS, playerKey = username, credit = true) {
        const splat = {
            nx: x / canvas.width,
            ny: y / canvas.height,
            team: team,
            scale: radius / unit,
            drops: []
        };
        for (let i = 0; i < 7; i++) {
            splat.drops.push({
                angle: Math.random() * Math.PI * 2,
                distance: 0.8 + Math.random() * 0.55,
                size: 0.16 + Math.random() * 0.28
            });
        }

        if (splats.length >= MAX_SPLATS) splats.shift();
        splats.push(splat);
        const paintedCells = stampSplat(splat);

        // Update player stats
        if (credit) {
            const playerData = getPlayer(playerKey, username, team);
            playerData.paintedCells += paintedCells;
            playerData.splashes++;
        }

        // Create visual splash effect
        createSplash(x, y, teams[team].color, radius);

        return paintedCells;
    }

    function createSplash(x, y, color, radius) {
        if (rings.length < 30) {
            rings.push({ x: x, y: y, radius: radius, color: color, life: 1 });
        }

        for (let i = 0; i < 12 && particles.length < 400; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = radius * (2 + Math.random() * 4);
            particles.push({
                x: x,
                y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed - radius * 2,
                size: radius * (0.08 + Math.random() * 0.1),
                color: color,
                life: 1
            });
        }
        fxDirty = true;
    }

    // Show who made a splash, right where it landed
    function showPainter(x, y, username, radius) {
        if (tags.length >= 10) tags.shift();
        const name = stripHtml(username);
        tags.push({
            x: x,
            y: y - radius - unit * 3.4,
            text: name.length > 16 ? name.substring(0, 15) + '…' : name,
            life: 1
        });
        fxDirty = true;
    }

    function placePowerUp(powerUp) {
        powerUp.x = powerUp.nx * canvas.width;
        powerUp.y = powerUp.ny * canvas.height;
        powerUp.element.style.transform = 'translate(' + powerUp.x + 'px, ' + powerUp.y + 'px)';
    }

    function spawnPowerUp() {
        if (!gameActive || !roundStarted) return;
        if (powerUps.length < 3 && Math.random() < 0.08) {
            const types = ['🚀', '💣', '⭐', '🌈'];
            const powerUp = {
                nx: 0.08 + Math.random() * 0.84,
                ny: 0.24 + Math.random() * 0.6,
                type: types[Math.floor(Math.random() * types.length)],
                element: document.createElement('div')
            };

            // The wrapper carries the position so the icon inside is free to bob
            const icon = document.createElement('div');
            icon.className = 'power-up';
            icon.textContent = powerUp.type;
            powerUp.element.style.position = 'absolute';
            powerUp.element.style.left = '0';
            powerUp.element.style.top = '0';
            powerUp.element.appendChild(icon);
            document.getElementById('power-ups').appendChild(powerUp.element);
            placePowerUp(powerUp);
            powerUps.push(powerUp);
        }
    }

    function checkPowerUpCollection(x, y, team, username, playerKey = username) {
        for (let i = powerUps.length - 1; i >= 0; i--) {
            const powerUp = powerUps[i];
            const distance = Math.sqrt(Math.pow(x - powerUp.x, 2) + Math.pow(y - powerUp.y, 2));

            if (distance < PAINT_RADIUS * 1.6) {
                // Apply power-up effect
                switch (powerUp.type) {
                    case '🚀': // Speed paint - larger radius
                        paintArea(x, y, team, username, PAINT_RADIUS * 2, playerKey);
                        sendResponse(`🚀 ${username} got a MEGA SPLASH!`);
                        break;
                    case '💣': // Paint bomb - multiple splashes
                        for (let j = 0; j < 5; j++) {
                            const angle = (Math.PI * 2 / 5) * j;
                            const bx = x + Math.cos(angle) * PAINT_RADIUS * 2.4;
                            const by = y + Math.sin(angle) * PAINT_RADIUS * 2.4;
                            paintArea(bx, by, team, username, PAINT_RADIUS, playerKey);
                        }
                        sendResponse(`💣 ${username} triggered a PAINT BOMB!`);
                        break;
                    case '⭐': // Star power - bonus points
                        getPlayer(playerKey, username, team).paintedCells += 100;
                        sendResponse(`⭐ ${username} got bonus points!`);
                        break;
                    case '🌈': // Rainbow - paint all colors randomly
                        const allTeams = Object.keys(teams);
                        for (let j = 0; j < 10; j++) {
                            const rx = x + (Math.random() - 0.5) * PAINT_RADIUS * 6;
                            const ry = y + (Math.random() - 0.5) * PAINT_RADIUS * 6;
                            const randomTeam = allTeams[Math.floor(Math.random() * allTeams.length)];
                            paintArea(rx, ry, randomTeam, username, PAINT_RADIUS / 2, playerKey, false);
                        }
                        sendResponse(`🌈 ${username} created CHAOS!`);
                        break;
                }

                // Remove power-up
                powerUp.element.remove();
                powerUps.splice(i, 1);
                break;
            }
        }
    }

    function updateScores() {
        const counts = { red: 0, blue: 0, yellow: 0, green: 0 };
        if (!grid.length || !grid[0]) return counts;

        let painted = 0;
        for (let y = 0; y < grid.length; y++) {
            for (let x = 0; x < grid[y].length; x++) {
                if (grid[y][x]) {
                    counts[grid[y][x]]++;
                    painted++;
                }
            }
        }

        Object.keys(teams).forEach(team => {
            const element = document.getElementById(`${team}-score`);
            if (painted === 0) {
                element.style.width = '25%';
                element.textContent = '';
                return;
            }
            const percentage = Math.round((counts[team] / painted) * 100);
            element.style.width = (counts[team] / painted) * 100 + '%';
            element.textContent = percentage >= 12 ? percentage + '%' : '';
        });

        return counts;
    }

    function updateLeaderboard() {
        const allPlayers = [];

        Object.entries(teams).forEach(([team, data]) => {
            data.players.forEach(stats => {
                allPlayers.push({
                    name: stats.name,
                    team: team,
                    paintedCells: stats.paintedCells
                });
            });
        });

        allPlayers.sort((a, b) => b.paintedCells - a.paintedCells);

        const playerList = document.getElementById('player-list');
        while (playerList.firstChild) {
            playerList.removeChild(playerList.firstChild);
        }

        allPlayers.slice(0, 3).forEach(player => {
            const entry = document.createElement('div');
            entry.className = 'player-entry';

            const dot = document.createElement('div');
            dot.className = 'player-color';
            dot.style.backgroundColor = teams[player.team].color;

            const name = document.createElement('span');
            name.className = 'player-name';
            name.textContent = player.name;

            const cells = document.createElement('span');
            cells.className = 'player-cells';
            cells.textContent = player.paintedCells;

            entry.appendChild(dot);
            entry.appendChild(name);
            entry.appendChild(cells);
            playerList.appendChild(entry);
        });
    }

    function roundedRect(target, x, y, width, height, radius) {
        target.beginPath();
        target.moveTo(x + radius, y);
        target.arcTo(x + width, y, x + width, y + height, radius);
        target.arcTo(x + width, y + height, x, y + height, radius);
        target.arcTo(x, y + height, x, y, radius);
        target.arcTo(x, y, x + width, y, radius);
        target.closePath();
    }

    // Short-lived effects live on their own layer above the paint
    function draw(elapsed) {
        if (!fxDirty) return;
        fx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);

        rings = rings.filter(ring => {
            ring.life -= elapsed * 2.2;
            if (ring.life <= 0) return false;
            fx.globalAlpha = ring.life * 0.9;
            fx.strokeStyle = '#ffffff';
            fx.lineWidth = unit * 0.9 * ring.life;
            fx.beginPath();
            fx.arc(ring.x, ring.y, ring.radius * (1.1 + (1 - ring.life) * 0.9), 0, Math.PI * 2);
            fx.stroke();
            return true;
        });

        particles = particles.filter(particle => {
            particle.x += particle.vx * elapsed;
            particle.y += particle.vy * elapsed;
            particle.vy += unit * 160 * elapsed; // gravity
            particle.life -= elapsed * 1.4;

            if (particle.life > 0) {
                fx.globalAlpha = Math.min(1, particle.life * 2);
                fx.fillStyle = particle.color;
                fx.beginPath();
                fx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                fx.fill();
                return true;
            }
            return false;
        });

        const fontSize = Math.round(unit * 3);
        fx.font = '700 ' + fontSize + 'px system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif';
        fx.textAlign = 'center';
        fx.textBaseline = 'middle';
        tags = tags.filter(tag => {
            tag.life -= elapsed * 0.55;
            if (tag.life <= 0) return false;
            const width = fx.measureText(tag.text).width + fontSize * 1.4;
            const height = fontSize * 1.7;
            const x = Math.max(width / 2 + unit, Math.min(fxCanvas.width - width / 2 - unit, tag.x));
            const y = Math.max(height, tag.y) - (1 - tag.life) * unit * 2;

            fx.globalAlpha = Math.min(1, tag.life * 3);
            roundedRect(fx, x - width / 2, y - height / 2, width, height, height / 2);
            fx.fillStyle = 'rgba(0, 0, 0, 0.62)';
            fx.fill();
            fx.fillStyle = '#ffffff';
            fx.fillText(tag.text, x, y + fontSize * 0.04);
            return true;
        });

        fx.globalAlpha = 1;
        fxDirty = rings.length > 0 || particles.length > 0 || tags.length > 0;
    }

    function showTimer() {
        const minutes = Math.floor(roundTime / 60);
        const seconds = roundTime % 60;
        const timer = document.getElementById('round-timer');
        timer.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
        if (roundTime <= 10) {
            timer.classList.add('ending');
        } else {
            timer.classList.remove('ending');
        }
    }

    function updateTimer() {
        // The clock starts with the first splash of a round
        if (!gameActive || !roundStarted) return;

        roundTime--;
        showTimer();

        if (roundTime <= 0) {
            endRound();
        }
    }

    function endRound() {
        gameActive = false;

        const scores = updateScores();
        const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
        const winner = sorted[0];
        const isTie = winner[1] === sorted[1][1];

        const winnerOverlay = document.getElementById('winner-overlay');
        winnerOverlay.textContent = isTie ? '🤝' : '🏆';
        winnerOverlay.style.backgroundColor = isTie ? '#e9ecef' : teams[winner[0]].color;
        winnerOverlay.style.display = 'block';

        // Celebration particles
        const celebrationColors = isTie ? Object.keys(teams).map(team => teams[team].color) : [teams[winner[0]].color, '#ffffff'];
        for (let i = 0; i < 100; i++) {
            setTimeout(() => {
                if (gameActive) return;
                particles.push({
                    x: Math.random() * canvas.width,
                    y: canvas.height + unit,
                    vx: (Math.random() - 0.5) * unit * 60,
                    vy: -(Math.random() * 0.5 + 0.6) * Math.sqrt(canvas.height * unit * 320),
                    size: unit * (0.6 + Math.random() * 0.7),
                    color: celebrationColors[i % celebrationColors.length],
                    life: 2
                });
                fxDirty = true;
            }, i * 20);
        }

        setTimeout(() => {
            startNewRound();
        }, 5000);
    }

    function startNewRound() {
        // Reset game state
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        initGrid();
        splats = [];
        powerUps.forEach(p => p.element && p.element.remove());
        powerUps = [];
        particles = [];
        rings = [];
        tags = [];
        fxDirty = true;
        roundTime = ROUND_DURATION;
        roundStarted = false;
        gameActive = true;

        // Clear player stats
        Object.values(teams).forEach(team => {
            team.players.clear();
        });

        document.getElementById('winner-overlay').style.display = 'none';
        showTimer();
        updateScores();
        updateLeaderboard();
    }

    function processPaint(username, team, playerKey = username) {
        if (!gameActive || !teams[team]) return;
        roundStarted = true;

        // Random position for the paint
        const x = PAINT_RADIUS + Math.random() * (canvas.width - PAINT_RADIUS * 2);
        const y = PAINT_RADIUS + Math.random() * (canvas.height - PAINT_RADIUS * 2);

        paintArea(x, y, team, username, PAINT_RADIUS, playerKey);
        showPainter(x, y, username, PAINT_RADIUS);
        checkPowerUpCollection(x, y, team, username, playerKey);

        updateScores();
        updateLeaderboard();
    }

    function sendResponse(message) {
        if (urlParams.has('demo')) return;
        const response = {
            chatname: 'ColorWarsBot',
            chatmessage: message,
            type: 'bot',
            timestamp: Date.now()
        };
        
        if (window.parent !== window) {
            window.parent.postMessage({
                overlay: 'colorwars',
                response: response
            }, '*');
        }
        
        console.log('Bot response:', message);
    }
    
    function processData(data) {
        if (!data || typeof data !== 'object') return;
        
        if (data.content) {
            data = data.content;
        }
        
        if (!data.chatmessage || !data.chatname) return;

        let rawMessage = data.chatmessage;
        // Preserve the chatmessage format: textonly=true is literal text, without HTML parsing/filtering; false/missing permits HTML checked at its ingress boundary.
        if (!data.textonly) {
            rawMessage = stripHtml(rawMessage);
        }
        const message = rawMessage.trim().toLowerCase();

        if (message.startsWith('!')) {
            const team = message.substring(1);
            if (teams[team]) {
                processPaint(String(data.chatname), team, JSON.stringify([data.type || '', String(data.userid || data.username || data.chatname)]));
            }
        }
    }

    // Fit both layers to the window and repaint what is already on the wall
    function layout() {
        canvas.width = fxCanvas.width = window.innerWidth;
        canvas.height = fxCanvas.height = window.innerHeight;
        unit = Math.min(canvas.width, canvas.height) / 100;
        GRID_SIZE = Math.max(6, unit * 1.2);
        PAINT_RADIUS = unit * 5.5;
        document.body.classList.toggle('stacked', canvas.width / canvas.height < 1.6);

        initGrid();
        splats.forEach(stampSplat);
        powerUps.forEach(placePowerUp);
        fxDirty = true;
        updateScores();
    }

    // Game loop
    let lastFrame = performance.now();
    function gameLoop(now) {
        const elapsed = Math.min(0.1, ((now || lastFrame) - lastFrame) / 1000);
        lastFrame = now || lastFrame;
        draw(elapsed);
        requestAnimationFrame(gameLoop);
    }

    // Initialize
    layout();
    showTimer();
    requestAnimationFrame(gameLoop);
    setInterval(updateTimer, 1000);
    setInterval(spawnPowerUp, 1000);

    // Setup iframe communication
    if (!urlParams.has('demo') && !chatRelay.enabled) {
        const iframe = document.createElement("iframe");
        iframe.src = `https://vdo.socialstream.ninja/?ln&salt=vdo.ninja&notmobile&password=${encodeURIComponent(password)}&solo&view=${encodeURIComponent(sessionId)}&novideo&noaudio&label=dock&cleanoutput&room=${encodeURIComponent(sessionId)}`;
        iframe.style.width = "0px";
        iframe.style.height = "0px";
        iframe.style.position = "fixed";
        iframe.style.left = "-100px";
        iframe.style.top = "-100px";
        iframe.id = "frame1";
        document.body.appendChild(iframe);
        
        window.addEventListener("message", function(e) {
            if (e.source !== iframe.contentWindow) return;
            
            if (e.data && typeof e.data === "object" && e.data.dataReceived && typeof e.data.dataReceived === "object") {
                if ("overlayNinja" in e.data.dataReceived) {
                    processData(e.data.dataReceived.overlayNinja);
                }
            }
        });
    }

    // Handle WebSocket if server parameter provided
    if (!urlParams.has('demo') && chatRelay.enabled) {
        const serverUrl = chatRelay.url;
        let socketserver = null;
        let reconnectTimeout = null;

        function connectWebSocket() {
            socketserver = new WebSocket(serverUrl);

            socketserver.onopen = function() {
                socketserver.send(JSON.stringify({
                    join: sessionId.split(",")[0],
                    out: chatRelay.out, in: chatRelay.in
                }));
            };

            socketserver.onclose = function() {
                clearTimeout(reconnectTimeout);
                reconnectTimeout = setTimeout(connectWebSocket, 5000);
            };

            socketserver.onerror = function() {
                try { socketserver.close(); } catch (e) {}
            };

            socketserver.onmessage = function(event) {
                if (event.data) {
                    try {
                        const data = JSON.parse(event.data);
                        processData(data);
                    } catch (e) {
                        console.error('WebSocket parse error:', e);
                    }
                }
            };
        }

        connectWebSocket();
    }

    // Handle window resize
    window.addEventListener('resize', layout);

    // Demo mode
    if (urlParams.has('demo')) {
        setInterval(() => {
            const demoUsers = ['Painter1', 'Painter2', 'Painter3', 'Painter4', 'Painter5', 'Painter6'];
            const demoTeams = Object.keys(teams);
            const index = Math.floor(Math.random() * demoUsers.length);
            // Each demo painter sticks to one team, like a real chatter would
            processData({
                chatname: demoUsers[index],
                chatmessage: '!' + demoTeams[index % demoTeams.length]
            });
        }, 450);
    }
    </script>
</body>
</html>

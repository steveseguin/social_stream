<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>Coin rocket · SSN starter</title><link rel="stylesheet" href="starter.css"></head>
<body><main><div class="host"><a href="../../docs/making-games.html">Build games and rewards</a><p id="connection" role="status"></p></div>
<p class="eyebrow">Template 01 · Native units</p><h1>Give the rocket a boost.</h1>
<p id="rules"></p><section class="stage" aria-label="Rocket progress"><div class="art" aria-hidden="true">🚀</div>
<p id="score" class="score" aria-live="polite"></p><progress id="progress" max="10" value="0" aria-label="Boosts toward the next planet"></progress>
<p id="latest" role="status">Waiting for the first boost.</p></section>
<div class="host"><div id="demo-controls"><button id="coins" type="button">Sample: 10 TikTok coins</button><button id="bits" type="button">Sample: 100 Bits</button><button id="stars" type="button">Sample: 100 Stars</button><button id="streak" type="button">Sample: streak 1, 2, 3</button><button id="unknown" type="button">Sample: unknown gift price</button></div>
<button id="reset" type="button">Reset run</button><details><summary>Last received payload</summary><pre id="payload">Use a sample button to inspect an event.</pre></details>
<p class="muted">Balances and progress last until reset or reload. Add &amp;clean to hide these controls in OBS.</p></div></main>
<script src="../../js/local-server-url.js"></script><script src="starter.js"></script><script>
'use strict';
// EDIT THESE RULES: native platform units required for one boost.
var COST = { tiktok: 10, twitch: 100, facebook: 100 };
var boosts = 0, balances = new Map(), R = RewardStarter;
R.text('rules', COST.tiktok + ' TikTok coins, ' + COST.twitch + ' Twitch Bits, or ' + COST.facebook + ' Facebook Stars = one boost. Each viewer keeps their remainder.');
function render() {
    R.text('score', boosts + ' boosts · ' + Math.floor(boosts / 10) + ' planets reached');
    document.getElementById('progress').value = boosts % 10;
}
function receive(data) {
    if (!R.isSupport(data)) return;
    var type = R.platform(data), amount = type === 'tiktok' ? R.coins(data) :
        type === 'twitch' ? R.labelCount(data, 'bit') : type === 'facebook' ? R.labelCount(data, 'star') : 0;
    if (!amount) { R.log('No supported native-unit amount on this event.'); return; }
    var added = R.increment(data, amount, 'native-units');
    if (!added) return;
    var key = JSON.stringify([type, data.userid || data.chatname || 'anonymous']);
    var balance = (balances.get(key) || 0) + added;
    var awarded = Math.floor(balance / COST[type]);
    balances.set(key, balance % COST[type]);
    boosts += awarded;
    R.log((data.chatname || 'A viewer') + ': +' + awarded + ' boosts; ' + balances.get(key) + ' units toward the next.');
    render();
}
function gift(id, count) { return { id: id, type: 'tiktok', event: 'gift', userid: 'demo-tiktok', chatname: 'Sample viewer', chatmessage: 'Sent Demo gift x' + count, hasDonation: (count * 10) + ' coins', donoValue: count * 0.1, meta: { giftName: 'Demo gift', coinsPerGift: 10, tiktokGiftCount: count } }; }
R.start(receive, function () { boosts = 0; balances.clear(); render(); }, {
    coins: function (id) { return gift('coins-' + id, 1); },
    bits: function (id) { return { id: 'bits-' + id, type: 'twitch', event: 'cheer', chatname: 'Sample viewer', hasDonation: '100 bits', donoValue: 1 }; },
    stars: function (id) { return { id: 'stars-' + id, type: 'facebook', chatname: 'Sample viewer', hasDonation: '100 Stars', donoValue: 1 }; },
    streak: function (id) { return [1, 2, 3].map(function (count) { var data = gift('streak-' + id + '-' + count, count); data.meta.tiktokGiftStreakId = 'demo-streak-' + id; return data; }); },
    unknown: function (id) { return { id: 'unknown-' + id, type: 'tiktok', event: 'gift', hasDonation: '1 gift', donoValue: 0.01, meta: { tiktokGiftCount: 1 } }; }
});
</script></body></html>

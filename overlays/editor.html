	<script>
	(function () {
		var $ = function (id) { return document.getElementById(id); };
		var params = new URLSearchParams(location.search);
		var def = SSO.get(params.get("t")) || SSO.list()[0];
		var cfg = SSO.readConfig(def);
		// Settings can sit after the # in the link, so the skip link must not put "#form" in their place.
		document.querySelector(".studio-skip").addEventListener("click", function (event) { event.preventDefault(); $("form").focus(); });
		// A still picture (channel art) is downloaded as PNG files; it has no OBS link, size or events.
		var still = def.still || null;
		// strip: on a phone, panels are shown in one row at a size that can be read; the row is swiped sideways.
		var strip = false, stillCount = 0;
		function narrow() { return window.innerWidth <= 860; }
		function wantStrip() { return !!(still && still.row && stillCount && narrow()); }
		// mine: the text boxes the viewer has typed in. A new style never replaces those, even where the words happen to
		// match a style's own sample. For a still picture the list rides in the link, so it is still known after a reload.
		function readMine() {
			var out = {};
			if (!still) { return out; }
			(new URLSearchParams(SSO.pageQuery()).get("mine") || "").split(",").forEach(function (key) {
				if (def.fields.some(function (f) { return f.key === key; })) { out[key] = true; }
			});
			return out;
		}
		var mine = readMine();
		var sizeTouched = !still && (params.has("w") || params.has("h"));
		var extra = new URLSearchParams();
		["css", "b64css", "cssb64", "scale"].forEach(function (key) { if (params.has(key)) { extra.set(key, params.get(key)); } });
		var size = still ? [0, 0] : [parseInt(params.get("w"), 10) || 0, parseInt(params.get("h"), 10) || 0];

		// template picker
		SSO.CATEGORIES.forEach(function (cat) {
			var group = document.createElement("optgroup");
			group.label = cat.label;
			SSO.list().forEach(function (d) {
				if (d.category !== cat.id) { return; }
				var o = document.createElement("option");
				o.value = d.id;
				o.textContent = d.name;
				group.appendChild(o);
			});
			$("tpl").appendChild(group);
		});
		$("tpl").value = def.id;
		$("tpl").addEventListener("change", function () {
			location.href = "editor.html?" + SSO.presetQuery(SSO.get($("tpl").value), SSO.get($("tpl").value).presets[0]);
		});
		$("name").textContent = def.name;
		$("desc").textContent = def.description || "";
		document.title = def.name + " - Overlay Editor - Social Stream Ninja";

		// Sample words come with the overlay: its defaults, and the words its styles bring. Anything else in a text box is
		// the viewer's own.
		function isSample(field, value) {
			var own = String(value == null ? "" : value);
			if (own === String(field.default == null ? "" : field.default)) { return true; }
			return def.presets.some(function (preset) { return preset.values && field.key in preset.values && String(preset.values[field.key]) === own; });
		}
		def.presets.forEach(function (p) {
			var b = document.createElement("button");
			b.type = "button";
			b.className = "chip";
			b.textContent = p.name;
			b.addEventListener("click", function () {
				// Presets restyle; the viewer's own text, messages and socials carry over.
				// On an ordinary overlay a style still sets every text box it names, as it always has: a text box there can
				// be a working setting (which list of drawn numbers to use), not only words.
				// Channel art is all words. There a style's sample words replace other sample words, never something the
				// viewer typed.
				var keep = {};
				def.fields.forEach(function (f) {
					var words = f.type === "text" || f.type === "textarea" || f.type === "socials";
					if (!words && !f.keep) { return; }
					if (!(f.key in p.values) || (still && words && (mine[f.key] || !isSample(f, cfg[f.key])))) { keep[f.key] = cfg[f.key]; }
				});
				cfg = SSO.readConfig(def, "");
				Object.keys(p.values).forEach(function (k) { cfg[k] = p.values[k]; });
				Object.keys(keep).forEach(function (k) { cfg[k] = keep[k]; });
				buildForm();
				if (!sizeTouched) { size = [0, 0]; }
				update(true);
			});
			$("presets").appendChild(b);
		});

		// ---------- form ----------
		function visible(field) {
			if (!field.show) { return true; }
			return Object.keys(field.show).every(function (k) {
				var want = field.show[k];
				var have = cfg[k];
				if (Object.prototype.toString.call(want) === "[object Array]") { return want.map(String).indexOf(String(have)) !== -1; }
				if (typeof want === "string" && want.charAt(0) === "!") { return String(have) !== want.slice(1); }
				return String(have) === String(want);
			});
		}

		function socialsEditor(field, wrap) {
			var list = SSO.parseSocials(cfg[field.key]).map(function (s) { return { net: s.net, handle: s.handle }; });
			var holder = document.createElement("div");
			wrap.appendChild(holder);
			function save() { cfg[field.key] = SSO.stringifySocials(list); mine[field.key] = true; update(); }
			function draw() {
				holder.innerHTML = "";
				list.forEach(function (item, idx) {
					var row = document.createElement("div");
					row.className = "soc-row";
					var sel = document.createElement("select");
					Object.keys(SSO.NETWORKS).forEach(function (k) {
						var o = document.createElement("option");
						o.value = k;
						o.textContent = SSO.NETWORKS[k].label;
						sel.appendChild(o);
					});
					sel.value = item.net;
					sel.setAttribute("aria-label", "Network");
					sel.addEventListener("change", function () { item.net = sel.value; save(); });
					var inp = document.createElement("input");
					inp.type = "text";
					inp.value = item.handle;
					inp.placeholder = "@handle or link";
					inp.setAttribute("aria-label", "Handle");
					inp.addEventListener("input", function () { item.handle = inp.value; save(); });
					var up = document.createElement("button");
					up.type = "button";
					up.className = "btn small";
					up.textContent = "↑";
					up.title = "Move up"; up.setAttribute("aria-label", "Move account up");
					up.disabled = idx === 0;
					up.addEventListener("click", function () { list.splice(idx - 1, 0, list.splice(idx, 1)[0]); save(); draw(); });
					var del = document.createElement("button");
					del.type = "button";
					del.className = "btn small";
					del.textContent = "✕";
					del.title = "Remove"; del.setAttribute("aria-label", "Remove account");
					del.addEventListener("click", function () { list.splice(idx, 1); save(); draw(); });
					row.appendChild(sel); row.appendChild(inp); row.appendChild(up); row.appendChild(del);
					holder.appendChild(row);
				});
				var add = document.createElement("button");
				add.type = "button";
				add.className = "btn small";
				add.textContent = "+ Add account";
				add.addEventListener("click", function () {
					var used = list.map(function (s) { return s.net; });
					var next = ["twitch", "youtube", "kick", "tiktok", "discord", "instagram", "x", "facebook"].filter(function (n) { return used.indexOf(n) === -1; })[0] || "website";
					list.push({ net: next, handle: "" });
					draw();
					var inputs = holder.querySelectorAll("input");
					inputs[inputs.length - 1].focus();
				});
				holder.appendChild(add);
			}
			draw();
		}

		function control(field) {
			var wrap = document.createElement("div");
			wrap.className = "fld" + (field.type === "bool" ? " bool" : "");
			wrap.setAttribute("data-key", field.key);
			var id = "f-" + field.key;
			var value = cfg[field.key];
			if (field.type === "bool") {
				wrap.innerHTML = '<label><input type="checkbox" id="' + id + '"><span></span></label>';
				wrap.querySelector("span").textContent = field.label;
				var cb = wrap.querySelector("input");
				cb.checked = !!value;
				cb.addEventListener("change", function () { cfg[field.key] = cb.checked; update(); refreshVisibility(); });
			} else {
				var label = document.createElement("label");
				label.htmlFor = id;
				label.textContent = field.label;
				wrap.appendChild(label);
				if (field.type === "socials") {
					label.removeAttribute("for");
					socialsEditor(field, wrap);
				} else if (field.type === "select") {
					var sel = document.createElement("select");
					sel.id = id;
					field.options.forEach(function (o) {
						var opt = document.createElement("option");
						opt.value = o[0];
						opt.textContent = o[1];
						if (field.key === "font" && o[0]) { opt.style.fontFamily = SSO.fontStack(o[0]); }
						sel.appendChild(opt);
					});
					sel.value = value;
					sel.addEventListener("change", function () {
						cfg[field.key] = sel.value;
						update();
						refreshVisibility();
						// A choice other fields take their look from (a theme) redraws the form.
						if (field.rebuild) { buildForm(); if ($(id)) { $(id).focus(); } }
					});
					wrap.appendChild(sel);
				} else if (field.type === "textarea") {
					var ta = document.createElement("textarea");
					ta.id = id;
					if (field.image) {
						var up2 = document.createElement("div");
						up2.className = "help";
						up2.innerHTML = 'Host images on the <a href="https://fileupload.socialstream.ninja/" target="_blank" rel="noopener">SSN uploader</a> and paste each link on its own line.';
						wrap.appendChild(up2);
					}
					ta.value = value;
					ta.addEventListener("input", function () { cfg[field.key] = ta.value; mine[field.key] = true; update(); });
					wrap.appendChild(ta);
				} else if (field.type === "range") {
					var row = document.createElement("div");
					row.className = "row";
					var rng = document.createElement("input");
					rng.type = "range";
					rng.id = id;
					rng.min = field.min; rng.max = field.max; rng.step = field.step || 1;
					rng.value = value;
					var num = document.createElement("input");
					num.type = "number";
					num.className = "val";
					num.min = field.min; num.max = field.max; num.step = field.step || 1;
					num.value = value;
					num.setAttribute("aria-label", field.label);
					rng.addEventListener("input", function () { num.value = rng.value; cfg[field.key] = parseFloat(rng.value); update(); refreshVisibility(); });
					num.addEventListener("input", function () { if (num.value === "") { return; } rng.value = num.value; cfg[field.key] = parseFloat(rng.value); update(); refreshVisibility(); });
					num.addEventListener("change", function () { num.value = rng.value; });
					row.appendChild(rng); row.appendChild(num);
					wrap.appendChild(row);
				} else if (field.type === "color") {
					var crow = document.createElement("div");
					crow.className = "row";
					var pick = document.createElement("input");
					pick.type = "color";
					pick.setAttribute("aria-label", field.label + " picker");
					var txt = document.createElement("input");
					txt.type = "text";
					txt.id = id;
					txt.value = value ? "#" + String(value).replace(/^#/, "") : "";
					txt.placeholder = field.placeholder || (field.default === "" ? "none" : "#rrggbb");
					var syncPick = function () {
						var v = String(cfg[field.key] || "").replace(/^#/, "");
						// An empty colour can stand for one the overlay picks itself; show that one in the swatch.
						if (!v && field.auto) { v = String(field.auto(cfg) || "").replace(/^#/, ""); }
						if (/^[0-9a-f]{6}/i.test(v)) { pick.value = "#" + v.slice(0, 6); }
						else if (/^[0-9a-f]{3}$/i.test(v)) { pick.value = "#" + v[0] + v[0] + v[1] + v[1] + v[2] + v[2]; }
					};
					syncPick();
					pick.addEventListener("input", function () {
						var old = String(cfg[field.key] || "").replace(/^#/, "");
						cfg[field.key] = pick.value.slice(1) + (old.length === 8 ? old.slice(6) : "");
						txt.value = "#" + cfg[field.key];
						update();
					});
					txt.addEventListener("input", function () { cfg[field.key] = txt.value.trim().replace(/^#/, ""); syncPick(); update(); });
					crow.appendChild(pick); crow.appendChild(txt);
					wrap.appendChild(crow);
				} else {
					var inp = document.createElement("input");
					inp.type = field.type === "number" ? "number" : "text";
					if (field.image) {
						// Images can be hosted on the SSN uploader, then pasted back here as a link.
						var up = document.createElement("div");
						up.className = "help";
						up.innerHTML = 'Need a link for your image? <a href="https://fileupload.socialstream.ninja/" target="_blank" rel="noopener">Upload it here</a>, then paste the link.';
						wrap.appendChild(up);
					}
					inp.id = id;
					if (field.type === "number") {
						if (field.min != null) { inp.min = field.min; }
						if (field.max != null) { inp.max = field.max; }
						inp.step = field.step || 1;
						inp.addEventListener("change", function () { inp.value = cfg[field.key]; });
					}
					inp.value = value;
					inp.addEventListener("input", function () {
						if (field.type === "number") {
							if (inp.value === "" || isNaN(parseFloat(inp.value))) { return; }
							var n = parseFloat(inp.value);
							if (!isFinite(n)) { return; }
							if (field.min != null) { n = Math.max(field.min, n); }
							if (field.max != null) { n = Math.min(field.max, n); }
							cfg[field.key] = n;
						} else {
							cfg[field.key] = inp.value;
							mine[field.key] = true;
						}
						update();
						refreshVisibility();
					});
					wrap.appendChild(inp);
				}
			}
			if (field.help) {
				var help = document.createElement("div");
				help.className = "help";
				help.textContent = field.help;
				wrap.appendChild(help);
			}
			return wrap;
		}

		function buildForm() {
			var form = $("form");
			form.innerHTML = "";
			var groups = {};
			var order = [];
			def.fields.forEach(function (f) {
				var g = f.group || "Settings";
				if (!groups[g]) { groups[g] = []; order.push(g); }
				groups[g].push(f);
			});
			order.forEach(function (g) {
				var fs = document.createElement("fieldset");
				var lg = document.createElement("legend");
				lg.textContent = g;
				fs.appendChild(lg);
				groups[g].forEach(function (f) { fs.appendChild(control(f)); });
				form.appendChild(fs);
			});
			refreshVisibility();
		}
		function refreshVisibility() {
			def.fields.forEach(function (f) {
				var el = $("form").querySelector('[data-key="' + f.key + '"]');
				if (el) { el.style.display = visible(f) ? "" : "none"; }
			});
		}

		// ---------- preview + output ----------
		var bg = SSO.store.get("editor-bg") || "game";
		if (["game", "dark", "light", "checker"].indexOf(bg) === -1) { bg = "game"; }
		// Channel art is looked at on a channel page, not over a game.
		if (still) { $("bg").remove(0); if (bg === "game") { bg = "dark"; } }
		$("bg").value = bg;
		$("bg").addEventListener("change", function () { bg = $("bg").value; SSO.store.set("editor-bg", bg); $("box").className = "frame-box bg-" + bg; });
		$("box").className = "frame-box bg-" + bg;

		function currentSize() {
			var base = def.sizeFor ? def.sizeFor(cfg, false, strip) : def.size;
			return [SSO.clamp(Math.round(size[0] || base[0]), 50, 7680), SSO.clamp(Math.round(size[1] || base[1]), 20, 4320)];
		}
		function fit() {
			var s = currentSize();
			var stage = $("stage");
			stage.className = "stage" + (strip ? " strip" : "");
			if (!strip) { stage.style.height = ""; }
			// In a strip one picture fills the width, whatever its height: the rest are a swipe away, and a tall one
			// scrolls down inside the preview.
			var scale = strip ? Math.min((stage.clientWidth - 24) / 344, 1) : Math.min((stage.clientWidth - 40) / s[0], (stage.clientHeight - 40) / s[1], 1);
			if (strip) { stage.style.height = SSO.clamp(Math.round(s[1] * scale) + 16, 200, Math.round(window.innerHeight * 0.62)) + "px"; }
			var frame = $("preview");
			frame.style.width = s[0] + "px";
			frame.style.height = s[1] + "px";
			frame.style.transform = "scale(" + scale + ")";
			$("box").style.width = (s[0] * scale) + "px";
			$("box").style.height = (s[1] * scale) + "px";
		}
		["w", "h"].forEach(function (k, i) {
			$(k).addEventListener("change", function () { $(k).value = currentSize()[i]; });
			$(k).addEventListener("input", function () {
				var v = parseInt($(k).value, 10);
				if (!(v > 0)) { return; }
				var s = currentSize();
				size = [s[0], s[1]];
				size[i] = v;
				sizeTouched = true;
				fit();
				update();
			});
		});

		var timer;
		function update(now) {
			var query = SSO.buildQuery(def, cfg) + (extra.toString() ? "&" + extra.toString() : "");
			var s = currentSize();
			if (document.activeElement !== $("w")) { $("w").value = s[0]; }
			if (document.activeElement !== $("h")) { $("h").value = s[1]; }
			var link = SSO.viewerBase() + "?" + query;
			$("url").value = link;
			$("open").href = link;
			$("hint").innerHTML = still ? still.hint : "In OBS: <b>Sources → + → Browser</b>, paste the link, and set width <b>" + s[0] + "</b> and height <b>" + s[1] + "</b>. Bookmark this page to edit it later." +
				// A moment with a name or amount in it can be played by the alert box for real events.
				(def.fields.some(function (f) { return f.live; }) ? " To play it for real follows, subs and tips with the viewer's name filled in, paste the link into the <b>Media</b> box of an alert under <b>Multi-Stream Alert Box → Event animations &amp; sound effects</b> in Social Stream Ninja." : "");
			if (still) { stillButtons(); }
			var pageLink = "editor.html?" + query + (sizeTouched ? "&w=" + s[0] + "&h=" + s[1] : ""), frameLink = "view.html?" + query + "&preview";
			if (still) {
				// Channel art can hold a lot of text. Its settings ride after the #, which no server is sent, so the link can
				// always be opened again however long it gets. What the preview page reads from the query itself (scale, css)
				// stays in the query, and so does the overlay's name.
				var own = SSO.buildQuery(def, cfg), split = own.indexOf("&"), head = (split < 0 ? own : own.slice(0, split)) + (extra.toString() ? "&" + extra.toString() : "");
				var typed = Object.keys(mine).sort().join(","), tail = split < 0 ? "" : own.slice(split + 1);
				if (typed) { tail += (tail ? "&" : "") + "mine=" + typed; }
				if (tail) { tail = "#" + tail; }
				pageLink = "editor.html?" + head + tail;
				frameLink = "view.html?" + head + "&preview" + (strip ? "&row=1" : "") + tail;
			}
			try { history.replaceState(null, "", pageLink); } catch (e) {}
			fit();
			clearTimeout(timer);
			timer = setTimeout(function () {
				var frame = $("preview");
				// A still picture's preview is swapped in place. Setting src would add an entry to the browser's history on
				// every change, and Back would then step the preview to an older design while the form stayed on this one.
				if (still) {
					try { frame.contentWindow.location.replace(new URL(frameLink, location.href).href); return; } catch (e) {}
				}
				frame.src = frameLink;
			}, now ? 0 : 300);
		}
		$("replay").addEventListener("click", function () { update(true); });
		// Scene changes step through a typical show, so every scene-aware reaction gets its turn.
		var demoScenes = ["Just Chatting", "Gameplay", "Be Right Back", "Ending", "Starting Soon"], demoAt = 0;
		function sendObs(name, label) {
			var detail = name === "obsSceneChanged" ? { name: demoScenes[demoAt++ % demoScenes.length] } : name === "obsSourceVisibleChanged" ? { visible: true } : {};
			try { $("preview").contentWindow.postMessage({ ssoObsEvent: name, detail: detail }, "*"); } catch (e) {}
			toast(name === "obsSceneChanged" ? "Sent: scene changed to " + detail.name : "Sent: " + label);
		}
		var obsBtns = document.querySelectorAll("[data-obs]");
		for (var ob = 0; ob < obsBtns.length; ob++) {
			obsBtns[ob].addEventListener("click", function () { sendObs(this.getAttribute("data-obs"), this.textContent); });
		}
		$("obsMore").addEventListener("change", function () {
			if (this.value) { sendObs(this.value, this.options[this.selectedIndex].text); }
			this.value = "";
		});
		function copyLink(text, message) {
			var input = $("url");
			var done = function () { toast(message); };
			function fallback() {
				var row = input.parentNode, was = row.style.display, old = input.value;
				row.style.display = "";
				input.value = text;
				input.focus(); input.select();
				var copied = false;
				try { copied = document.execCommand("copy"); } catch (e) {}
				if (copied) { done(); } else { toast("Link selected. Press Ctrl+C (Command+C on Mac) to copy."); }
				if (copied) { input.value = old; row.style.display = was; }
			}
			if (navigator.clipboard && navigator.clipboard.writeText) {
				navigator.clipboard.writeText(text).then(done, fallback);
			} else {
				fallback();
			}
		}
		$("copy").addEventListener("click", function () { copyLink($("url").value, "Link copied. Paste it into an OBS Browser Source."); });

		// ---------- still pictures (channel art): downloads in place of an OBS link ----------
		var stillRow = null, stillWarn = null, stillKey = null, stillBusy = false, crcTable = null, checkSeq = 0, checkTimer = 0, lateChecks = 0;
		function settingsNow() {
			var copy = {}, key;
			for (key in cfg) { copy[key] = cfg[key]; }
			return copy;
		}
		// A picture can only be so tall. Past that the end of its text is left out, and that must never happen quietly.
		function showCut(items) {
			var cut = items.filter(function (item) { return item.cut; }).map(function (item) { return item.label; });
			stillWarn.innerHTML = "<b>Too much text.</b> <span></span>";
			stillWarn.lastChild.textContent = cut.join(", ") + (cut.length === 1 ? " has" : " have") + " more text than fits in one picture, so the end is left out. Shorten it, or move some of it to another panel.";
			stillWarn.style.display = cut.length ? "" : "none";
		}
		// Asks the overlay which pictures are cut. It answers once its fonts are loaded on this page, so the answer is
		// the one a download would give, not a guess made with a stand-in font.
		function checkFit() {
			var seq = ++checkSeq;
			if (!still.check) { return; }
			still.check(settingsNow(), function (items) {
				if (seq !== checkSeq || !items) { return; }
				showCut(items);
				// The fonts are in on this page now, so the preview is sized from the same measurements it is drawn with.
				fit();
			});
		}
		function saveBlob(blob, name) {
			var a = document.createElement("a"), href = URL.createObjectURL(blob);
			a.href = href;
			a.download = name;
			document.body.appendChild(a);
			a.click();
			setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(href); }, 4000);
		}
		function crc32(bytes) {
			var crc = -1, n, k, c;
			if (!crcTable) {
				crcTable = [];
				for (n = 0; n < 256; n++) {
					c = n;
					for (k = 0; k < 8; k++) { c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; }
					crcTable[n] = c >>> 0;
				}
			}
			for (n = 0; n < bytes.length; n++) { crc = crcTable[(crc ^ bytes[n]) & 255] ^ (crc >>> 8); }
			return (crc ^ -1) >>> 0;
		}
		// A zip with the files stored as they are (PNG is already compressed). files: [{ name, bytes }], names in plain ASCII.
		function zipOf(files) {
			var parts = [], central = [], offset = 0, centralSize = 0, now = new Date();
			var time = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
			var date = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
			files.forEach(function (file) {
				var name = new Uint8Array(file.name.length), crc = crc32(file.bytes), size = file.bytes.length, i;
				for (i = 0; i < file.name.length; i++) { name[i] = file.name.charCodeAt(i) & 127; }
				var local = new DataView(new ArrayBuffer(30)), entry = new DataView(new ArrayBuffer(46));
				local.setUint32(0, 0x04034b50, true); local.setUint16(4, 20, true); local.setUint16(10, time, true); local.setUint16(12, date, true);
				local.setUint32(14, crc, true); local.setUint32(18, size, true); local.setUint32(22, size, true); local.setUint16(26, name.length, true);
				entry.setUint32(0, 0x02014b50, true); entry.setUint16(4, 20, true); entry.setUint16(6, 20, true); entry.setUint16(12, time, true); entry.setUint16(14, date, true);
				entry.setUint32(16, crc, true); entry.setUint32(20, size, true); entry.setUint32(24, size, true); entry.setUint16(28, name.length, true); entry.setUint32(42, offset, true);
				parts.push(local.buffer, name, file.bytes);
				central.push(entry.buffer, name);
				offset += 30 + name.length + size;
				centralSize += 46 + name.length;
			});
			var end = new DataView(new ArrayBuffer(22));
			end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true); end.setUint32(12, centralSize, true); end.setUint32(16, offset, true);
			return new Blob(parts.concat(central, [end.buffer]), { type: "application/zip" });
		}
		// cb([{ name, blob, bytes }]) with every picture at its real size, or cb(null) when they could not be made.
		// It always answers, so a failure can never leave the download buttons switched off.
		function stillFiles(settings, cb) {
			var over = false, guard = setTimeout(function () { finish(null); }, 20000);
			function finish(result) { if (!over) { over = true; clearTimeout(guard); cb(result); } }
			try {
				still.files(settings, function (pictures) {
					var left = pictures ? pictures.length : 0, out = [];
					if (!pictures) { finish(null); return; }
					if (!left) { finish(out); return; }
					pictures.forEach(function (picture, i) {
						picture.canvas.toBlob(function (blob) {
							if (!blob) { finish(null); return; }
							var reader = new FileReader();
							reader.onerror = function () { finish(null); };
							reader.onload = function () {
								out[i] = { name: picture.name, label: picture.label, cut: !!picture.cut, blob: blob, bytes: new Uint8Array(reader.result) };
								if (!--left) { finish(out); }
							};
							reader.readAsArrayBuffer(blob);
						}, "image/png");
					});
				});
			} catch (e) {
				finish(null);
				throw e;
			}
		}
		// name: which picture, or null for all of them (one zip when there are several). The settings are copied at the
		// click, so typing while the pictures are being made cannot change what gets saved.
		function download(name) {
			if (stillBusy) { return; }
			var settings = settingsNow(), drawnFor = SSO.buildQuery(def, settings);
			stillBusy = true;
			toast("Making your pictures…");
			stillFiles(settings, function (made) {
				stillBusy = false;
				if (!made) { toast("Sorry, the pictures could not be made. Please try again."); return; }
				if (!made.length) { toast("There is nothing to download yet."); return; }
				// What was just drawn is the last word on what fits, but only for the design it was drawn from. If the form
				// has moved on since the click (another design opened, more typing), that design's own check stands.
				if (SSO.buildQuery(def, cfg) === drawnFor) { checkSeq++; showCut(made); }
				if (name === null && made.length > 1) {
					saveBlob(zipOf(made), still.zip || "channel-art.zip");
					toast(made.length + " pictures saved in " + (still.zip || "channel-art.zip") + ".");
					return;
				}
				var one = name === null ? made[0] : made.filter(function (file) { return file.name === name; })[0];
				if (!one) { toast("Sorry, that picture could not be made. Please try again."); return; }
				saveBlob(one.blob, one.name);
				toast("Saved " + one.name + (one.cut ? ". Not all of its text fits." : "."));
			});
		}
		function stillButton(label, primary, onClick) {
			var b = document.createElement("button");
			b.type = "button";
			b.className = "btn" + (primary ? " primary" : "");
			b.textContent = label;
			b.addEventListener("click", onClick);
			stillRow.appendChild(b);
			return b;
		}
		// The download buttons follow the pictures: one each, plus everything in a zip when there are several.
		function stillButtons() {
			var list = still.list(cfg), key = list.map(function (item) { return item.name + "|" + item.label; }).join("\n");
			stillCount = list.length;
			strip = wantStrip();
			lateChecks = 0;
			clearTimeout(checkTimer);
			checkTimer = setTimeout(checkFit, 200);
			if (key === stillKey) { return; }
			stillKey = key;
			stillRow.innerHTML = "";
			if (list.length > 1) {
				stillButton("Download all (.zip)", true, function () { download(null); });
				var each = document.createElement("span");
				each.className = "still-each";
				each.textContent = "or one picture:";
				stillRow.appendChild(each);
			}
			list.forEach(function (item) { stillButton(item.label, list.length === 1, function () { download(list.length === 1 ? null : item.name); }); });
			stillButton("Copy link to edit later", false, function () { copyLink(location.href, "Link copied. Open it any time to change your pictures."); }).className += " still-link";
		}
		if (still) {
			document.body.className += " studio-still";
			$("sizeGrp").style.display = "none";
			$("replay").style.display = "none";
			document.querySelector(".obs-test").style.display = "none";
			$("url").parentNode.style.display = "none";
			stillWarn = document.createElement("div");
			stillWarn.className = "still-warn";
			stillWarn.setAttribute("role", "status");
			stillWarn.style.display = "none";
			$("hint").parentNode.insertBefore(stillWarn, $("hint"));
			stillRow = document.createElement("div");
			stillRow.className = "row still";
			$("hint").parentNode.insertBefore(stillRow, $("hint"));
			document.querySelector(".studio-breadcrumb [aria-current]").textContent = "Customize pictures";
			// Opening another saved design in this tab (a pasted link, Back, Forward) only changes what follows the #, and
			// that does not load the page again. The form and the downloads must follow the address.
			window.addEventListener("hashchange", function () {
				cfg = SSO.readConfig(def);
				mine = readMine();
				stillKey = null;
				buildForm();
				update(true);
			});
			// A font that turns up late changes how tall the pictures are and how much text fits. When one lands, the
			// preview is sized again and the question of what fits is asked again.
			if (document.fonts && document.fonts.addEventListener) {
				document.fonts.addEventListener("loadingdone", function () {
					fit();
					if (lateChecks++ > 6) { return; }
					clearTimeout(checkTimer);
					checkTimer = setTimeout(checkFit, 250);
				});
			}
		}
		var toastTimer;
		function toast(msg) {
			clearTimeout(toastTimer);
			var t = $("toast");
			t.textContent = msg;
			t.className = "toast on";
			toastTimer = setTimeout(function () { t.className = "toast"; }, 2200);
		}
		var rt;
		window.addEventListener("resize", function () {
			clearTimeout(rt);
			rt = setTimeout(function () {
				// Crossing the phone width swaps the channel art preview between the board and the single row.
				if (still && strip !== wantStrip()) { update(true); } else { fit(); }
			}, 100);
		});

		buildForm();
		update(true);
	})();
	</script>
</body>
</html>
